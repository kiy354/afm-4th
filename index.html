<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 도감</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    /* Tailwind 유틸리티로 표현 불가한 것만 커스텀 CSS 로 처리 */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes growBar { from { width: 0; } }
    .anim-fade { animation: fadeIn .18s ease-out both; }
    .anim-pop { animation: popIn .22s cubic-bezier(.2,.9,.3,1.2) both; }
    .anim-bar { animation: growBar .6s cubic-bezier(.2,.8,.3,1) both; }
    /* 저해상도 도트 스프라이트를 확대해도 선명하게 */
    .pixelated { image-rendering: pixelated; }
    @media (prefers-reduced-motion: reduce) {
      .anim-fade, .anim-pop, .anim-bar { animation: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    // ========================================
    // ⚙️ Config & Constants
    // ========================================

    // PokeAPI GraphQL 엔드포인트 — 1025마리 전체 한글 데이터를 단일 요청으로 가져온다.
    const API_ENDPOINT = 'https://graphql.pokeapi.co/v1beta2';

    // 이미지: 목록은 가벼운 도트 스프라이트, 상세는 고해상도 공식 일러스트
    const SPRITE_BASE = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon';
    const spriteUrl = (id) => `${SPRITE_BASE}/${id}.png`;
    const artworkUrl = (id) => `${SPRITE_BASE}/other/official-artwork/${id}.png`;

    const PAGE_SIZE = 60;   // "더 보기" 한 번에 늘어나는 카드 수
    const MAX_STAT = 255;   // 종족값 이론상 최댓값 (바 길이 기준)

    // 18개 타입별 색상 — Tailwind CDN 이 파싱할 수 있도록 클래스명을 문자열 그대로 둔다.
    const TYPE_STYLES = {
      normal:   { badge: 'bg-stone-100 text-stone-700 ring-stone-200',       bar: 'bg-stone-400',   hero: 'from-stone-300 to-stone-200' },
      fighting: { badge: 'bg-red-100 text-red-700 ring-red-200',             bar: 'bg-red-500',     hero: 'from-red-400 to-orange-300' },
      flying:   { badge: 'bg-indigo-100 text-indigo-700 ring-indigo-200',    bar: 'bg-indigo-400',  hero: 'from-indigo-300 to-sky-200' },
      poison:   { badge: 'bg-fuchsia-100 text-fuchsia-700 ring-fuchsia-200', bar: 'bg-fuchsia-500', hero: 'from-fuchsia-400 to-purple-300' },
      ground:   { badge: 'bg-amber-100 text-amber-800 ring-amber-200',       bar: 'bg-amber-600',   hero: 'from-amber-400 to-yellow-200' },
      rock:     { badge: 'bg-stone-200 text-stone-800 ring-stone-300',       bar: 'bg-stone-500',   hero: 'from-stone-400 to-amber-200' },
      bug:      { badge: 'bg-lime-100 text-lime-700 ring-lime-200',          bar: 'bg-lime-500',    hero: 'from-lime-400 to-green-200' },
      ghost:    { badge: 'bg-violet-100 text-violet-700 ring-violet-200',    bar: 'bg-violet-500',  hero: 'from-violet-400 to-indigo-300' },
      steel:    { badge: 'bg-slate-100 text-slate-700 ring-slate-200',       bar: 'bg-slate-400',   hero: 'from-slate-300 to-slate-200' },
      fire:     { badge: 'bg-orange-100 text-orange-700 ring-orange-200',    bar: 'bg-orange-500',  hero: 'from-orange-400 to-amber-300' },
      water:    { badge: 'bg-sky-100 text-sky-700 ring-sky-200',             bar: 'bg-sky-500',     hero: 'from-sky-400 to-cyan-300' },
      grass:    { badge: 'bg-green-100 text-green-700 ring-green-200',       bar: 'bg-green-500',   hero: 'from-green-400 to-lime-300' },
      electric: { badge: 'bg-yellow-100 text-yellow-700 ring-yellow-200',    bar: 'bg-yellow-500',  hero: 'from-yellow-300 to-amber-200' },
      psychic:  { badge: 'bg-pink-100 text-pink-700 ring-pink-200',          bar: 'bg-pink-500',    hero: 'from-pink-400 to-rose-300' },
      ice:      { badge: 'bg-cyan-100 text-cyan-700 ring-cyan-200',          bar: 'bg-cyan-400',    hero: 'from-cyan-300 to-sky-200' },
      dragon:   { badge: 'bg-indigo-100 text-indigo-800 ring-indigo-200',    bar: 'bg-indigo-600',  hero: 'from-indigo-500 to-violet-300' },
      dark:     { badge: 'bg-neutral-200 text-neutral-800 ring-neutral-300', bar: 'bg-neutral-700', hero: 'from-neutral-600 to-neutral-400' },
      fairy:    { badge: 'bg-rose-100 text-rose-700 ring-rose-200',          bar: 'bg-rose-400',    hero: 'from-rose-300 to-pink-200' },
    };

    const FALLBACK_STYLE = { badge: 'bg-slate-100 text-slate-700 ring-slate-200', bar: 'bg-slate-400', hero: 'from-slate-300 to-slate-200' };
    const typeStyle = (englishName) => TYPE_STYLES[englishName] || FALLBACK_STYLE;

    const SORT_OPTIONS = [
      { value: 'id-asc', label: '도감번호 ↑' },
      { value: 'id-desc', label: '도감번호 ↓' },
      { value: 'name-asc', label: '이름 가나다순' },
    ];

    const dexNo = (id) => `No.${String(id).padStart(4, '0')}`;
    const toMeter = (decimeter) => (decimeter / 10).toFixed(1);   // PokeAPI 는 키를 dm 단위로 준다
    const toKg = (hectogram) => (hectogram / 10).toFixed(1);      // 몸무게는 hg 단위
    const cleanText = (text) => (text || '').replace(/[\n\f\r]/g, ' ').trim();

    // ========================================
    // 📡 API Layer — PokeAPI GraphQL
    // ========================================

    // 언어 필터를 재사용하기 위한 조각
    const KO = '(where: {language: {name: {_eq: "ko"}}})';

    const INDEX_QUERY = `query PokedexIndex {
      pokemon(where: {is_default: {_eq: true}, id: {_lte: 1025}}, order_by: {id: asc}) {
        id
        name
        pokemontypes(order_by: {slot: asc}) {
          type { name typenames${KO} { name } }
        }
        pokemonspecy {
          generation_id
          pokemonspeciesnames${KO} { name genus }
        }
      }
      type(where: {id: {_lte: 18}}, order_by: {id: asc}) {
        name
        typenames${KO} { name }
      }
      generation(order_by: {id: asc}) {
        id
        generationnames${KO} { name }
      }
    }`;

    const DETAIL_QUERY = `query PokemonDetail($id: Int!) {
      pokemon(where: {id: {_eq: $id}}) {
        height
        weight
        pokemonstats(order_by: {stat_id: asc}) {
          base_stat
          stat { name statnames${KO} { name } }
        }
        pokemonabilities(order_by: {slot: asc}) {
          is_hidden
          ability { name abilitynames${KO} { name } }
        }
        pokemonspecy {
          pokemonspeciesflavortexts(
            where: {language: {name: {_eq: "ko"}}}
            limit: 1
            order_by: {id: desc}
          ) { flavor_text }
        }
      }
    }`;

    async function gqlRequest(query, variables) {
      const res = await fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables }),
      });
      if (!res.ok) throw new Error(`서버 응답 오류 (${res.status})`);
      const json = await res.json();
      if (json.errors && json.errors.length) throw new Error(json.errors[0].message || '데이터를 불러오지 못했습니다');
      return json.data;
    }

    // GraphQL 응답을 화면에서 쓰기 좋은 평평한 구조로 변환
    function normalizeIndex(data) {
      const pokemons = data.pokemon.map((p) => {
        const species = p.pokemonspecy || {};
        const koSpecies = (species.pokemonspeciesnames || [])[0] || {};
        return {
          id: p.id,
          enName: p.name,
          koName: koSpecies.name || p.name,
          genus: koSpecies.genus || '',
          generationId: species.generation_id || 0,
          types: p.pokemontypes.map((t) => ({
            en: t.type.name,
            ko: (t.type.typenames[0] || {}).name || t.type.name,
          })),
        };
      });

      const types = data.type.map((t) => ({ en: t.name, ko: (t.typenames[0] || {}).name || t.name }));
      const generations = data.generation.map((g) => ({ id: g.id, ko: (g.generationnames[0] || {}).name || `${g.id}세대` }));

      return { pokemons, types, generations };
    }

    function normalizeDetail(data) {
      const p = (data.pokemon || [])[0];
      if (!p) throw new Error('상세 정보를 찾을 수 없습니다');
      const flavor = ((p.pokemonspecy || {}).pokemonspeciesflavortexts || [])[0] || {};
      return {
        height: p.height,
        weight: p.weight,
        description: cleanText(flavor.flavor_text) || '아직 등록된 한국어 도감 설명이 없습니다.',
        abilities: p.pokemonabilities.map((a) => ({
          name: (a.ability.abilitynames[0] || {}).name || a.ability.name,
          hidden: a.is_hidden,
        })),
        stats: p.pokemonstats.map((s) => ({
          label: (s.stat.statnames[0] || {}).name || s.stat.name,
          value: s.base_stat,
        })),
      };
    }

    // 도감 전체 색인을 한 번만 불러오는 훅
    function usePokedexIndex() {
      const [state, setState] = useState({ data: null, loading: true, error: null });
      const [reloadKey, setReloadKey] = useState(0);

      useEffect(() => {
        let cancelled = false;
        setState({ data: null, loading: true, error: null });

        gqlRequest(INDEX_QUERY)
          .then((data) => { if (!cancelled) setState({ data: normalizeIndex(data), loading: false, error: null }); })
          .catch((err) => { if (!cancelled) setState({ data: null, loading: false, error: err }); });

        return () => { cancelled = true; };
      }, [reloadKey]);

      const retry = useCallback(() => setReloadKey((k) => k + 1), []);
      return { ...state, retry };
    }

    // 상세 정보는 열람한 포켓몬만 요청하고 메모리에 캐시한다.
    const detailCache = new Map();

    function usePokemonDetail(id) {
      const [state, setState] = useState({ data: null, loading: false, error: null });

      useEffect(() => {
        if (!id) return;
        if (detailCache.has(id)) {
          setState({ data: detailCache.get(id), loading: false, error: null });
          return;
        }

        let cancelled = false;
        setState({ data: null, loading: true, error: null });

        gqlRequest(DETAIL_QUERY, { id })
          .then((raw) => {
            const detail = normalizeDetail(raw);
            detailCache.set(id, detail);
            if (!cancelled) setState({ data: detail, loading: false, error: null });
          })
          .catch((err) => { if (!cancelled) setState({ data: null, loading: false, error: err }); });

        return () => { cancelled = true; };
      }, [id]);

      return state;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {
      const base =
        'inline-flex items-center justify-center gap-1.5 font-semibold rounded-xl transition ' +
        'focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-indigo-500 ' +
        'disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 active:bg-indigo-800 shadow-sm',
        secondary: 'bg-white text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50 active:bg-slate-100',
        danger: 'bg-rose-600 text-white hover:bg-rose-700 active:bg-rose-800 shadow-sm',
        ghost: 'bg-transparent text-slate-600 hover:bg-slate-200/70 active:bg-slate-300/70',
      };
      const sizes = { sm: 'text-xs px-2.5 py-1.5', md: 'text-sm px-4 py-2', lg: 'text-base px-5 py-2.5' };

      return (
        <button
          type="button"
          className={`${base} ${variants[variant] || variants.primary} ${sizes[size] || sizes.md} ${className}`}
          disabled={disabled}
          onClick={onClick}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder = '', error = '', disabled = false, className = '', ...rest }) {
      const id = useRef(`input-${Math.random().toString(36).slice(2, 9)}`).current;
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block mb-1.5 text-sm font-medium text-slate-700">{label}</label>}
          <input
            id={id}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={error ? 'true' : undefined}
            className={
              'w-full rounded-xl bg-white px-4 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 ' +
              'ring-1 transition focus:outline-none focus:ring-2 disabled:bg-slate-100 disabled:text-slate-400 ' +
              (error ? 'ring-rose-400 focus:ring-rose-500' : 'ring-slate-300 focus:ring-indigo-500')
            }
            {...rest}
          />
          {error && <p className="mt-1.5 text-xs text-rose-600">{error}</p>}
        </div>
      );
    }

    function Select({ label, value, onChange, options, disabled = false, className = '' }) {
      const id = useRef(`select-${Math.random().toString(36).slice(2, 9)}`).current;
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block mb-1.5 text-sm font-medium text-slate-700">{label}</label>}
          <select
            id={id}
            value={value}
            onChange={onChange}
            disabled={disabled}
            className="w-full rounded-xl bg-white px-3 py-2.5 text-sm text-slate-900 ring-1 ring-slate-300 transition focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-slate-100 disabled:text-slate-400"
          >
            {options.map((opt) => (
              <option key={opt.value} value={opt.value}>{opt.label}</option>
            ))}
          </select>
        </div>
      );
    }

    function Card({ className = '', children, ...rest }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm ring-1 ring-slate-200/80 p-5 ${className}`} {...rest}>
          {children}
        </div>
      );
    }

    function Badge({ className = '', children }) {
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ring-inset ${className}`}>
          {children}
        </span>
      );
    }

    function Spinner({ className = 'h-6 w-6 text-indigo-600' }) {
      return (
        <svg className={`animate-spin ${className}`} viewBox="0 0 24 24" fill="none" role="status" aria-label="불러오는 중">
          <circle className="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
          <path className="opacity-90" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z" />
        </svg>
      );
    }

    function Modal({ isOpen, onClose, title, size = 'md', children }) {
      const panelRef = useRef(null);

      // ESC 로 닫기 + 배경 스크롤 잠금 (cleanup 포함)
      useEffect(() => {
        if (!isOpen) return;
        const onKeyDown = (e) => { if (e.key === 'Escape') onClose(); };
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        window.addEventListener('keydown', onKeyDown);
        if (panelRef.current) panelRef.current.focus();
        return () => {
          window.removeEventListener('keydown', onKeyDown);
          document.body.style.overflow = prevOverflow;
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl' };

      return (
        <div
          className="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/50 p-0 backdrop-blur-sm sm:items-center sm:p-4 anim-fade"
          onClick={onClose}
        >
          <div
            ref={panelRef}
            tabIndex={-1}
            role="dialog"
            aria-modal="true"
            aria-label={title}
            onClick={(e) => e.stopPropagation()}
            className={`w-full ${sizes[size] || sizes.md} max-h-[92vh] overflow-y-auto rounded-t-3xl bg-white shadow-2xl focus:outline-none sm:rounded-3xl anim-pop`}
          >
            {children}
          </div>
        </div>
      );
    }

    function StatBar({ label, value, barClass }) {
      const pct = Math.min(100, Math.round((value / MAX_STAT) * 100));
      return (
        <div className="flex items-center gap-3">
          <span className="w-20 shrink-0 text-xs font-medium text-slate-500">{label}</span>
          <span className="w-9 shrink-0 text-right text-sm font-bold tabular-nums text-slate-800">{value}</span>
          <div className="h-2 flex-1 overflow-hidden rounded-full bg-slate-200">
            <div
              className={`h-full rounded-full anim-bar ${barClass}`}
              style={{ width: `${pct}%` }}
              role="progressbar"
              aria-valuenow={value}
              aria-valuemin={0}
              aria-valuemax={MAX_STAT}
              aria-label={`${label} ${value}`}
            />
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 Common / Layout Components
    // ========================================

    function Header({ total, loading }) {
      return (
        <header className="bg-gradient-to-r from-rose-500 via-red-500 to-orange-500 text-white">
          <div className="mx-auto max-w-6xl px-4 py-8 sm:py-10">
            <div className="flex items-center gap-3">
              <span className="grid h-11 w-11 place-items-center rounded-full bg-white text-2xl shadow-inner" aria-hidden="true">🔴</span>
              <div>
                <h1 className="text-2xl font-extrabold tracking-tight sm:text-3xl">포켓몬 도감</h1>
                <p className="text-sm text-white/85">
                  {loading ? 'PokeAPI 에서 도감을 불러오는 중…' : `전국도감 ${total}마리 · PokeAPI 실시간 데이터`}
                </p>
              </div>
            </div>
          </div>
        </header>
      );
    }

    function PokemonImage({ id, name, variant = 'sprite', className = '' }) {
      const [failed, setFailed] = useState(false);
      const src = variant === 'artwork' ? artworkUrl(id) : spriteUrl(id);

      // 포켓몬이 바뀌면 실패 상태를 초기화한다.
      useEffect(() => { setFailed(false); }, [id, variant]);

      if (failed) {
        return <span className={`grid place-items-center text-4xl ${className}`} role="img" aria-label={name}>❓</span>;
      }

      return (
        <img
          src={src}
          alt={`${name} 이미지`}
          loading="lazy"
          onError={() => setFailed(true)}
          className={`object-contain ${variant === 'sprite' ? 'pixelated' : 'drop-shadow-md'} ${className}`}
        />
      );
    }

    function PokemonCard({ pokemon, onSelect }) {
      const style = typeStyle(pokemon.types[0] ? pokemon.types[0].en : '');
      return (
        <Card className="group overflow-hidden p-0 transition hover:-translate-y-1 hover:shadow-lg focus-within:ring-2 focus-within:ring-indigo-500">
          <button
            type="button"
            onClick={() => onSelect(pokemon)}
            aria-label={`${pokemon.koName} 상세 정보 보기`}
            className="block w-full cursor-pointer text-left focus:outline-none"
          >
            <div className={`relative bg-gradient-to-br ${style.hero} px-3 pt-3 pb-1`}>
              <span className="absolute left-3 top-2 text-[11px] font-bold tabular-nums text-white/80">{dexNo(pokemon.id)}</span>
              <div className="grid h-24 place-items-center">
                <PokemonImage id={pokemon.id} name={pokemon.koName} className="h-20 w-20 transition group-hover:scale-110" />
              </div>
            </div>
            <div className="p-3">
              <h2 className="truncate text-base font-bold text-slate-900">{pokemon.koName}</h2>
              <p className="truncate text-xs capitalize text-slate-500">{pokemon.enName}</p>
              <div className="mt-2 flex flex-wrap gap-1">
                {pokemon.types.map((t) => (
                  <Badge key={t.en} className={typeStyle(t.en).badge}>{t.ko}</Badge>
                ))}
              </div>
            </div>
          </button>
        </Card>
      );
    }

    function PokemonDetail({ pokemon, onClose }) {
      const { data, loading, error } = usePokemonDetail(pokemon.id);
      const style = typeStyle(pokemon.types[0] ? pokemon.types[0].en : '');
      const total = data ? data.stats.reduce((sum, s) => sum + s.value, 0) : 0;

      return (
        <React.Fragment>
          <div className={`relative bg-gradient-to-br ${style.hero} px-6 pt-6 pb-4`}>
            <Button
              variant="ghost"
              size="sm"
              onClick={onClose}
              aria-label="닫기"
              className="absolute right-4 top-4 h-8 w-8 rounded-full bg-white/70 text-slate-700 hover:bg-white"
            >
              ✕
            </Button>
            <span className="text-xs font-bold tabular-nums text-white/85">{dexNo(pokemon.id)}</span>
            <div className="grid h-44 place-items-center">
              <PokemonImage id={pokemon.id} name={pokemon.koName} variant="artwork" className="h-40 w-40" />
            </div>
          </div>

          <div className="p-6">
            <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1">
              <h2 className="text-2xl font-extrabold text-slate-900">{pokemon.koName}</h2>
              <span className="text-sm capitalize text-slate-500">{pokemon.enName}</span>
            </div>
            {pokemon.genus && <p className="mt-1 text-sm text-slate-500">{pokemon.genus}</p>}

            <div className="mt-3 flex flex-wrap gap-1.5">
              {pokemon.types.map((t) => (
                <Badge key={t.en} className={typeStyle(t.en).badge}>{t.ko}</Badge>
              ))}
            </div>

            {loading && (
              <div className="flex items-center justify-center gap-2 py-12 text-sm text-slate-500">
                <Spinner className="h-5 w-5 text-indigo-600" />
                상세 정보를 불러오는 중…
              </div>
            )}

            {error && (
              <div className="mt-6 rounded-xl bg-rose-50 p-4 text-center ring-1 ring-rose-200">
                <p className="text-sm font-semibold text-rose-700">상세 정보를 불러오지 못했습니다</p>
                <p className="mt-1 text-xs text-rose-600">{error.message}</p>
              </div>
            )}

            {data && (
              <React.Fragment>
                <p className="mt-5 text-sm leading-relaxed text-slate-700">{data.description}</p>

                <dl className="mt-5 grid grid-cols-3 gap-3 text-center">
                  <div className="rounded-xl bg-slate-50 p-3 ring-1 ring-slate-200/70">
                    <dt className="text-xs text-slate-500">키</dt>
                    <dd className="mt-0.5 text-sm font-bold text-slate-900">{toMeter(data.height)} m</dd>
                  </div>
                  <div className="rounded-xl bg-slate-50 p-3 ring-1 ring-slate-200/70">
                    <dt className="text-xs text-slate-500">몸무게</dt>
                    <dd className="mt-0.5 text-sm font-bold text-slate-900">{toKg(data.weight)} kg</dd>
                  </div>
                  <div className="rounded-xl bg-slate-50 p-3 ring-1 ring-slate-200/70">
                    <dt className="text-xs text-slate-500">특성</dt>
                    <dd className="mt-0.5 text-sm font-bold text-slate-900">
                      {data.abilities.map((a) => (a.hidden ? `${a.name}(숨김)` : a.name)).join(', ')}
                    </dd>
                  </div>
                </dl>

                <section className="mt-6" aria-label="종족값">
                  <div className="mb-3 flex items-baseline justify-between">
                    <h3 className="text-sm font-bold text-slate-900">종족값</h3>
                    <span className="text-xs text-slate-500">합계 <strong className="tabular-nums text-slate-800">{total}</strong></span>
                  </div>
                  <div className="space-y-2.5">
                    {data.stats.map((s) => (
                      <StatBar key={s.label} label={s.label} value={s.value} barClass={style.bar} />
                    ))}
                  </div>
                </section>
              </React.Fragment>
            )}

            <Button variant="secondary" size="md" onClick={onClose} className="mt-6 w-full">닫기</Button>
          </div>
        </React.Fragment>
      );
    }

    function SkeletonGrid({ count = 12 }) {
      return (
        <div className="mt-3 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
          {Array.from({ length: count }, (_, i) => (
            <Card key={i} className="animate-pulse overflow-hidden p-0">
              <div className="h-24 bg-slate-200" />
              <div className="space-y-2 p-3">
                <div className="h-4 w-2/3 rounded bg-slate-200" />
                <div className="h-3 w-1/2 rounded bg-slate-100" />
                <div className="h-5 w-12 rounded-full bg-slate-100" />
              </div>
            </Card>
          ))}
        </div>
      );
    }

    function ErrorState({ error, onRetry }) {
      return (
        <Card className="py-14 text-center">
          <div className="text-5xl" aria-hidden="true">📡</div>
          <p className="mt-4 text-base font-semibold text-slate-800">도감 데이터를 불러오지 못했습니다</p>
          <p className="mt-1 text-sm text-slate-500">{error.message}</p>
          <p className="mt-1 text-xs text-slate-400">네트워크 연결을 확인한 뒤 다시 시도해 주세요.</p>
          <Button variant="primary" size="md" onClick={onRetry} className="mt-5">다시 시도</Button>
        </Card>
      );
    }

    function EmptyState({ onReset }) {
      return (
        <Card className="col-span-full py-14 text-center">
          <div className="text-5xl" aria-hidden="true">🔍</div>
          <p className="mt-4 text-base font-semibold text-slate-800">조건에 맞는 포켓몬이 없습니다</p>
          <p className="mt-1 text-sm text-slate-500">검색어나 필터를 바꿔보세요.</p>
          <Button variant="secondary" size="sm" onClick={onReset} className="mt-5">필터 초기화</Button>
        </Card>
      );
    }

    // ========================================
    // 📄 Page Component — 도감 목록
    // ========================================

    function PokedexPage() {
      const { data, loading, error, retry } = usePokedexIndex();

      const [keyword, setKeyword] = useState('');
      const [type, setType] = useState('all');
      const [generation, setGeneration] = useState('all');
      const [sort, setSort] = useState('id-asc');
      const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);
      const [selected, setSelected] = useState(null);

      const pokemons = data ? data.pokemons : [];

      const typeOptions = useMemo(() => {
        const list = data ? data.types : [];
        return [{ value: 'all', label: '모든 타입' }].concat(list.map((t) => ({ value: t.en, label: t.ko })));
      }, [data]);

      const generationOptions = useMemo(() => {
        const list = data ? data.generations : [];
        return [{ value: 'all', label: '모든 세대' }].concat(list.map((g) => ({ value: String(g.id), label: g.ko })));
      }, [data]);

      const filtered = useMemo(() => {
        const q = keyword.trim().toLowerCase();
        const result = pokemons.filter((p) => {
          const matchType = type === 'all' || p.types.some((t) => t.en === type);
          const matchGen = generation === 'all' || String(p.generationId) === generation;
          const matchKeyword =
            !q ||
            p.koName.toLowerCase().includes(q) ||
            p.enName.toLowerCase().includes(q) ||
            String(p.id).includes(q);
          return matchType && matchGen && matchKeyword;
        });

        if (sort === 'id-desc') return result.slice().sort((a, b) => b.id - a.id);
        if (sort === 'name-asc') return result.slice().sort((a, b) => a.koName.localeCompare(b.koName, 'ko'));
        return result;
      }, [pokemons, keyword, type, generation, sort]);

      // 필터가 바뀌면 다시 첫 페이지부터 보여준다.
      useEffect(() => { setVisibleCount(PAGE_SIZE); }, [keyword, type, generation, sort]);

      const visible = useMemo(() => filtered.slice(0, visibleCount), [filtered, visibleCount]);
      const hasMore = visibleCount < filtered.length;

      // 스크롤이 목록 끝에 닿으면 자동으로 더 불러온다.
      const sentinelRef = useRef(null);
      useEffect(() => {
        if (!hasMore || typeof IntersectionObserver === 'undefined') return;
        const node = sentinelRef.current;
        if (!node) return;

        const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) setVisibleCount((c) => c + PAGE_SIZE);
        }, { rootMargin: '400px' });

        observer.observe(node);
        return () => observer.disconnect();
      }, [hasMore, filtered.length]);

      const resetFilters = useCallback(() => {
        setKeyword('');
        setType('all');
        setGeneration('all');
        setSort('id-asc');
      }, []);

      const closeDetail = useCallback(() => setSelected(null), []);

      return (
        <div className="flex min-h-screen flex-col">
          <Header total={pokemons.length} loading={loading} />

          <main className="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:py-8">
            {error ? (
              <ErrorState error={error} onRetry={retry} />
            ) : (
              <React.Fragment>
                <section className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4" aria-label="검색 및 필터">
                  <Input
                    label="포켓몬 검색"
                    value={keyword}
                    onChange={(e) => setKeyword(e.target.value)}
                    placeholder="한글·영문 이름 또는 도감번호"
                    disabled={loading}
                  />
                  <Select label="타입" value={type} onChange={(e) => setType(e.target.value)} options={typeOptions} disabled={loading} />
                  <Select label="세대" value={generation} onChange={(e) => setGeneration(e.target.value)} options={generationOptions} disabled={loading} />
                  <Select label="정렬" value={sort} onChange={(e) => setSort(e.target.value)} options={SORT_OPTIONS} disabled={loading} />
                </section>

                {loading ? (
                  <React.Fragment>
                    <p className="mt-5 flex items-center gap-2 text-sm text-slate-500">
                      <Spinner className="h-4 w-4 text-indigo-600" />
                      전국도감 1025마리를 불러오는 중…
                    </p>
                    <SkeletonGrid count={10} />
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <p className="mt-5 text-sm text-slate-500" aria-live="polite">
                      {filtered.length}마리 중 <strong className="tabular-nums text-slate-700">{visible.length}</strong>마리 표시 중
                    </p>

                    <div className="mt-3 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
                      {filtered.length === 0 ? (
                        <EmptyState onReset={resetFilters} />
                      ) : (
                        visible.map((p) => <PokemonCard key={p.id} pokemon={p} onSelect={setSelected} />)
                      )}
                    </div>

                    {hasMore && (
                      <div ref={sentinelRef} className="mt-8 flex justify-center">
                        <Button variant="secondary" size="lg" onClick={() => setVisibleCount((c) => c + PAGE_SIZE)}>
                          더 보기 ({filtered.length - visible.length}마리 남음)
                        </Button>
                      </div>
                    )}
                  </React.Fragment>
                )}
              </React.Fragment>
            )}
          </main>

          <footer className="border-t border-slate-200 bg-white/60 py-5 text-center text-xs text-slate-500">
            데이터 제공 · <a href="https://pokeapi.co" target="_blank" rel="noopener noreferrer" className="font-medium text-indigo-600 hover:underline">PokeAPI</a>
          </footer>

          <Modal isOpen={!!selected} onClose={closeDetail} title={selected ? `${selected.koName} 상세 정보` : ''} size="md">
            {selected && <PokemonDetail pokemon={selected} onClose={closeDetail} />}
          </Modal>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return <PokedexPage />;
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

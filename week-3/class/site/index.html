    function Button({ variant = 'primary', size = 'md', className = '', children, ...props }) {

      return (

    function Modal({ isOpen, onClose, title, size = 'lg', children }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        const prev = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = prev;
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;
      const sizes = { md: 'max-w-2xl', lg: 'max-w-5xl', xl: 'max-w-7xl' };

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-8"
          role="dialog"
          aria-modal="true"
          aria-label={title}
        >
          <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
          <div className={`relative w-full ${sizes[size]} anim-in`}>
            <div className="flex items-center justify-between gap-4 pb-3">
              <p className="text-sm font-medium text-slate-300 truncate">{title}</p>
              <Button variant="secondary" size="sm" onClick={onClose} aria-label="닫기">

              </Button>
            </div>
            <div className="max-h-[78vh] overflow-auto rounded-2xl ring-1 ring-white/15 bg-[#0b1020]">
              {children}
            </div>
          </div>
        </div>
      );
    }

      useEffect(() => {
        const onHashChange = () => setPath(window.location.hash.slice(1) || '/');
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      useEffect(() => { window.scrollTo({ top: 0, behavior: 'auto' }); }, [path]);

      const navigate = useCallback((to) => { window.location.hash = to; }, []);
      const value = useMemo(() => ({ path, navigate }), [path, navigate]);

      return <RouterContext.Provider value={value}>{children}</RouterContext.Provider>;
    }

    function matchRoute(pattern, path) {
      const p = pattern.split('/').filter(Boolean);
      const c = path.split('/').filter(Boolean);
      if (p.length !== c.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(c[i]);
        else if (p[i] !== c[i]) return null;
      }
      return params;
    }

    function Routes({ children }) {
      const { path } = useContext(RouterContext);
      const routes = React.Children.toArray(children);
      for (const route of routes) {
        const params = matchRoute(route.props.path, path);
        if (params) {
          return <RouteParamsProvider params={params}>{route.props.element}</RouteParamsProvider>;
        }
      }
      const fallback = routes.find(r => r.props.path === '*');
      return fallback ? fallback.props.element : null;
    }

    function Route() { return null; }

    const ParamsContext = createContext({});
    function RouteParamsProvider({ params, children }) {
      const value = useMemo(() => params, [JSON.stringify(params)]);
      return <ParamsContext.Provider value={value}>{children}</ParamsContext.Provider>;
    }

    function useRouter() { return useContext(RouterContext); }
    function useParams() { return useContext(ParamsContext); }

      return (

        <main className="mx-auto max-w-5xl px-5 py-12">
          <Link to="/" className="inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-white transition-colors">
            <span aria-hidden="true">←</span> 전체 챌린지
          </Link>

          <div className="mt-6">
            <SectionTitle
              eyebrow="Takeaways"
              title="배운 점 6가지"
              description="7개 챌린지를 돌면서 반복적으로 확인된 규칙들입니다. 다음 자동화 시나리오를 짤 때 그대로 적용합니다."
            />
          </div>

          <div className="grid gap-4 sm:grid-cols-2">
            {LESSONS.map((l, i) => (
              <Card key={l.title} className="anim-in p-6" style={{ animationDelay: `${i * 50}ms` }}>
                <div className="flex items-start gap-4">
                  <span className="grid h-11 w-11 flex-none place-items-center rounded-xl bg-white/5 text-xl ring-1 ring-white/10" aria-hidden="true">
                    {l.icon}
                  </span>
                  <div>
                    <h3 className="font-bold text-white">
                      <span className="mr-2 font-mono text-xs text-slate-600">{String(i + 1).padStart(2, '0')}</span>
                      {l.title}
                    </h3>
                    <p className="mt-2 text-sm leading-relaxed text-slate-400">{l.body}</p>
                  </div>
                </div>
              </Card>
            ))}
          </div>

          <Card className="mt-10 p-6">
            <h2 className="text-sm font-bold uppercase tracking-wider text-slate-500">기록 출처</h2>
            <ul className="mt-4 space-y-2 text-sm text-slate-400">
              <li>· 리서치 원본: <a href={RESEARCH.docPath} className="text-indigo-300 hover:text-indigo-200">{RESEARCH.docPath}</a></li>
              <li>· 브라우저 로그·접근성 스냅샷: <a href={RESEARCH.logPath} className="text-indigo-300 hover:text-indigo-200">{RESEARCH.logPath}</a></li>
              <li>· 스크린샷 {TOTAL_SHOTS}장은 이 문서와 같은 폴더에 있습니다.</li>
            </ul>
          </Card>
        </main>
      );
    }

    function NotFoundPage() {
      return (
        <main className="mx-auto grid min-h-[60vh] max-w-3xl place-items-center px-5 text-center">
          <div>
            <p className="text-6xl" aria-hidden="true">🧭</p>
            <h1 className="mt-6 text-2xl font-bold text-white">페이지를 찾을 수 없습니다</h1>
            <p className="mt-3 text-sm text-slate-400">주소를 다시 확인하거나 처음 화면으로 돌아가세요.</p>
            <div className="mt-8">
              <Link to="/"><Button>처음으로</Button></Link>
            </div>
          </div>
        </main>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      const [activeShot, setActiveShot] = useState(null);
      const openShot = useCallback((shot) => setActiveShot(shot), []);
      const closeShot = useCallback(() => setActiveShot(null), []);

      return (
        <Router>
          <div className="min-h-screen">
            <Header />

            <Routes>
              <Route path="/" element={<HomePage onOpenShot={openShot} />} />
              <Route path="/challenge/:id" element={<ChallengeDetailPage onOpenShot={openShot} />} />
              <Route path="/lessons" element={<LessonsPage />} />
              <Route path="*" element={<NotFoundPage />} />
            </Routes>

            <Footer />

            <Modal isOpen={!!activeShot} onClose={closeShot} title={activeShot ? activeShot.caption : ''} size="xl">
              {activeShot && <img src={activeShot.src} alt={activeShot.caption} className="w-full" />}
            </Modal>
          </div>
        </Router>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

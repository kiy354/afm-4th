                      - generic [ref=f98e3716]: 베지밀 17곡 한끼두유, 190ml, 16개평소에 간단하게 한 끼 대신 마실 음료를 찾다가 베지밀 17곡 한끼두유를 구매해서 마셔봤는데, 전체적으로 부담 없이 마시기 좋은 제품이었어요. 190ml 16개 구성이라 집에 두고 하나씩 꺼내 마시기 편했고, 아침이나 간식 대용으로 활용하기 좋았습니다.맛은 일반 두유보다 조금 더 고소한 곡물 느낌이 강한 편이었어요. 17곡이 들어가 있어서 그런지 단순한 콩 맛보다는 여러 곡물의 고소함이 섞인 느낌이라 더 부드럽게 넘어갔습니다. 너무 달지 않아서 질리지 않고 계속 마시기 좋았고, 우유보다 가볍게 느껴지는 점도 마음에 들었습니다.양은 한 번에 마시기 딱 적당한 190ml라서 부담이 없었어요. 출근 전이나 공부하면서 간단하게 마시기 좋았고, 배가 너무 부담스럽게 차지 않는 정도라 간식이나 가벼운 식사 대용으로 괜찮았습니다. 바쁜 날 아침에 하나씩 마시면 허기 달래기에도 충분한 느낌이었어요.포장도 깔끔해서 보관하기 편했고, 냉장고에 넣어두고 차갑게 마시면 더 고소하고 깔끔한 맛이 살아나는 것 같았습니다. 휴대하기도 편해서 가방에 넣어두고 마시기에도 괜찮았어요.다만 아주 달고 진한 맛을 기대하면 조금 심심하게 느껴질 수도 있을 것 같아요. 대신 건강한 느낌의 담백한 맛이라 꾸준히 마시기에는 더 적합한 스타일이라고 생각했습니다. 전체적으로는 간편하게 곡물 영양을 챙기면서 부담 없이 마실 수 있는 두유라 데일리용으로 만족스러운 제품이었습니다.

                      - generic [ref=f98e3567]: 평소 아침을 거르는 날이 많아서 간편하게 챙겨 먹을 수 있는 제품을 찾다가 구매했는데 정말 만족스러워요. 일단 190ml 용량이 부담 없이 딱 한 번 마시기 좋은 사이즈라 가방에 넣고 다니기도 좋고, 출근할 때나 아이 간식으로 챙기기에도 편리합니다. 32개 구성이라 넉넉해서 매일 하나씩 먹어도 오래 먹을 수 있고 가격 대비 만족도가 높아요.가장 마음에 드는 점은 그냥 일반 두유가 아니라 17곡이 들어간 한끼두유라는 점이에요. 콩의 고소한 맛에 여러 곡물의 풍미가 더해져서 그런지 맛이 훨씬 부드럽고 든든한 느낌이 들어요. 너무 달기만 한 두유가 아니라 고소하면서 은은한 단맛이라 질리지 않고 계속 손이 가네요. 아침에 빈속에 마셔도 부담이 적고 속이 편안한 편이라 바쁜 날 식사 대용으로 챙기기 좋아요.190ml 한 팩이 휴대하기 좋은 크기라 냉장고에 넣어두고 하나씩 꺼내 먹기도 편하고, 아이들 간식이나 간단한 간식 시간에도 좋습니다. 과자나 빵만 먹는 것보다 훨씬 든든하고, 바쁜 아침에 밥 먹을 시간이 없을 때 한 팩 마시면 허기지는 느낌이 덜해요.맛도 너무 진하거나 텁텁하지 않고 부드럽게 넘어가는 스타일이라 두유 특유의 향을 싫어하는 사람도 비교적 편하게 먹을 수 있을 것 같아요. 곡물 맛이 살짝 느껴져서 고소함이 더 살아있고, 마시고 나면 포만감도 어느 정도 있어서 만족스럽습니다.또 개별 포장이라 위생적으로 보관하기 좋고 유통기한 걱정 없이 두고 먹을 수 있는 점도 좋아요. 냉장고에 몇 개 넣어두고 아침마다 챙기거나 여행, 외출할 때 몇 개 가져가기에도 딱 좋습니다.32개 대용량이라 가족이 함께 먹기에도 좋고, 꾸준히 건강한 간식을 챙기고 싶은 분들에게 추천하고 싶은 제품이에요. 맛, 휴대성, 든든함까지 모두 만족스러운 두유라 재구매 의사 있습니다.

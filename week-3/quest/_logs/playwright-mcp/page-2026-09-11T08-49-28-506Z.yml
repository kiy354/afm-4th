                      - generic [ref=f98e3857]: 베지밀 17곡 한끼 두유 190ml, 32개를 구입했습니다.두유를 구입할 땐,저는 무조건 검색시 베지밀이라고 조회를 하게 되더라구요.두유라는 용어보다오히려 베지밀이라는 용어가 더 익숙한 것 같습니다.이번에 베지밀 17곡 한끼 두유는선물용으로 구입을 했는데,어쩌다 보니 어긋나게 되어 저희 가족들이 요즘 잘 마시고 있는 중입니다.그렇더라도 처음 구매할 때에는 선물할 거라서혹시 베지밀 겉 종이박스에 송장이 붙어져서 배송되면 어쩌나~ 하는 신경이 쓰였습니다.근데,,한끼 두유 두 박스가 큰 종이상자 안에 든 채 이물질없이 깨끗하게 도착되어 무척 마음에 들더라구요.방문이 취소되어가족들이 요즘 이 베지밀 17곡 한끼 두유를 간식처럼 마시고 있는 중인데,저도 마셔 보니 미숫가루 선식 먹는 것처럼곡물이 입안에 느껴지고 고소합니다.두유 특유의 고소함과 적당한 점성의 농도에고소한 곡물이 첨가되어 든든하더라구요.맵쌀, 옥수수 통밀 흑미 현미찹쌀 보리쌀 등등,,17가지의 곡물이 190ml 한 팩에 모두 들어 있으니상품명처럼 한끼 식사로도 충분히 손색이 없을 듯 합니다.요즘 가족 중 1인은이 베지밀 한끼 두유를 시리얼에 부어서 말아서 맛있게 잘 먹고 있습니다.우유와 시리얼이라는 정석을 깨뜨린 가족 1인이지요.오히려 우유에 말아 먹는 것보다 더 고소하고 맛있다고 합니다.한끼 두유를 열어서 보니,두유색이 검은콩 두유와 비슷한 색을 띄고 있었습니다.적당히 달콤하고 고소하면서 든든한 한끼 두유입니다.

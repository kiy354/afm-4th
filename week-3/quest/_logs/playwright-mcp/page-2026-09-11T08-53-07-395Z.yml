                      - generic [ref=f178e3704]: 아침에 출근 준비하다 보면 밥 챙겨 먹는 게 생각보다 쉽지 않은데, 요즘은 완전두유 검은콩 17곡 고칼슘 190ml를 하나씩 챙겨 먹고 있어요.일단 190ml라서 부담스럽지 않은 양이고, 가방에 하나 넣어두면 출근길에 이동하면서 간편하게 마실 수 있어서 좋더라고요. 아침을 거르기 아쉬울 때 간단하게 식사대용으로 마시기 괜찮았어요. 따로 컵에 따르거나 준비할 필요 없이 바로 마시면 되니까 바쁜 날 특히 손이 많이 가요.맛은 생각보다 진하고 고소한 편이에요. 검은콩 특유의 고소함에 17곡이 들어가서 그런지 그냥 밍밍한 두유 느낌보다는 곡물의 구수한 맛이 느껴져서 제 입맛에는 잘 맞았어요. 너무 달기만 한 맛이 아니라서 아침에 마시기에도 부담스럽지 않았고요. 냉장고에 넣어뒀다가 시원하게 마시면 더 맛있어요.아이들 간식으로도 하나씩 챙겨주기 좋았어요. 과자나 음료만 주기 애매할 때 간단하게 먹이기 좋고, 190ml라 아이가 한 번에 마시기에도 양이 과하지 않은 편이에요. 특히 고소한 맛을 좋아하는 아이들이라면 잘 먹을 것 같아요.무엇보다 마음에 들었던 건 간편함이에요. 아침에 시간 없을 때 냉장고에서 하나 꺼내서 가방에 넣으면 끝이라 따로 준비할 게 없어요. 회사 도착해서 간단하게 마셔도 좋고, 출출할 때 간식처럼 먹어도 괜찮더라고요.맛이 진하고 고소해서 두유 특유의 심심한 맛을 싫어하는 분들도 비교적 맛있게 마실 수 있을 것 같아요. 저처럼 아침을 제대로 챙겨 먹기 어려운 직장인이나, 집에서 간편하게 챙겨 먹을 음료를 찾는 분들에게 잘 맞을 것 같아요.간편하게 챙길 수 있으면서 고소하고 든든한 두유를 찾는다면 괜찮은 선택이에요. 출근길 아침용으로 몇 개 쟁여두고 먹기 좋았습니다.♡

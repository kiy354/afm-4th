                      - generic [ref=f178e3851]: 완전두유 검은콩 17곡 고칼슘, 190ml, 24개두유는 이것저것 먹어봐도 결국 자주 먹던 제품을 다시 찾게 되는데 완전두유 검은콩 17곡은 저희 집에서 꾸준히 구입하고 있는 제품이에요.몇 번째 구매인지 기억도 안 날 정도로 떨어질 때쯤 다시 주문하는 단골 두유입니다.한 박스에 24개 들어 있어서 한번 사두면 든든하고, 멸균제품이라 냉장보관을 하지 않아도 되는 점이 정말 편해요.냉장고는 항상 이것저것 꽉 차 있는데 두유 한 박스까지 자리를 차지하지 않아도 되니 박스째 실온에 보관해두고 먹고 있습니다.190ml라 한 번에 마시기에도 양이 적당해요.너무 큰 팩은 배부르거나 마시다 남길 때가 있는데 이건 빨대 꽂아서 한 번에 깔끔하게 마실 수 있는 크기입니다.개별 팩마다 빨대가 붙어 있어서 컵에 따르거나 따로 챙길 것도 없어요.특히 출근할 때 정말 잘 가지고 다녀요.아침에 정신없이 준비하다 보면 식탁에 앉아서 제대로 챙겨 먹을 시간이 없는 날이 많은데 현관 나가기 전에 하나 집어서 가방에 넣으면 끝입니다.회사에 도착해서 마셔도 되고 이동하면서 출출할 때 마셔도 되니 바쁜 날 챙기기 좋은 간식이에요.아침에는 구운계란 한두 개랑 같이 먹으면 간단하면서도 제법 든든해서 종종 그렇게 챙겨 먹습니다.별도로 조리할 것도 없고 설거지도 나오지 않으니 바쁜 아침에는 이만한 조합도 없는 것 같아요.맛은 검은콩과 곡물이 들어간 두유답게 고소한 편이에요.곡물 특유의 맛이 있어서 그냥 밍밍한 두유보다 제 입에는 훨씬 맛있고 한 팩만 마셔도 입이 심심하지 않습니다.너무 묵직하거나 걸쭉한 타입은 아니라 목 넘김도 괜찮아서 부담 없이 마시기 좋아요.간식으로 빵이나 과자가 당길 때 두유 한 팩으로 대신하기도 합니다.오후쯤 살짝 출출하지만 뭔가 제대로 먹기에는 애매한 시간 있잖아요.그럴 때 하나 마시면 허기도 어느 정도 달래지고 책상에 과자봉지 펼쳐놓는 것보다 간단해서 손이 잘 가더라고요.외출할 때 챙기기도 좋아요.작은 팩이라 가방 안에서 자리를 많이 차지하지 않고 멸균제품이라 냉장 상태를 계속 유지해야 한다는 부담도 없습니다.장거리 운전하거나 여행 갈 때 몇 개 챙겨놓으면 식사시간이 애매해졌을 때 꽤 유용해요.집에서는 몇 팩만 냉장고에 넣어두기도 합니다.여름에는 역시 차갑게 마시는 게 맛있어서 시원한 두유 생각날 때 하나씩 꺼내 먹어요.나머지는 실온에 두면 되니 24팩을 전부 냉장고에 욱여넣을 필요가 없는 것도 마음에 듭니다.저희 집에서는 저만 먹는 게 아니라 가족들도 하나씩 가져가다 보니 24개가 생각보다 오래 가지 않아요.각자 필요한 사람이 하나씩 꺼내 먹으면 되니까 별도로 뭘 준비해줄 필요도 없고, 개별포장이라 위생적으로 보관하기에도 편합니다.다만 가격은 주문할 때마다 조금씩 변동이 있는 것 같아요.워낙 자주 구입하는 제품이다 보니 어느 정도 가격이면 괜찮은지 눈에 들어오더라고요.그래서 저는 급하게 필요한 게 아니면 장바구니에 미리 넣어두고 가격을 한번씩 확인합니다.그러다가 할인해서 가격이 괜찮아지면 그때 한 박스씩 주문해요.이렇게 자주 먹는 제품은 몇백 원, 몇천 원 차이도 계속 쌓이면 은근히 크잖아요.어차피 꾸준히 먹을 거라 굳이 가격이 올라 있을 때 서둘러 살 필요 없이 여유 있을 때 미리 장바구니에 넣어놓는 방식이 저한테는 잘 맞습니다.할인할 때 발견하면 괜히 득템한 기분도 들고요. ㅎㅎ24개가 가지런히 들어 있는 새 박스를 뜯을 때도 왠지 마음이 든든합니다.아침에 바쁠 때도 하나, 출출할 때도 하나, 외출할 때도 하나씩 부담 없이 꺼낼 수 있으니 집에 있으면 활용도가 높아요.상온 보관이 가능하다는 장점 덕분에 비상식량처럼 몇 개 남겨두기에도 괜찮습니다.화려하게 특별한 제품이라기보다는 맛, 휴대성, 보관 편의성까지 골고루 괜찮아서 계속 사게 되는 두유예요.한 번 호기심에 사본 제품은 많아도 이렇게 몇 박스째 꾸준히 구입하는 제품은 결국 생활하면서 편한 이유가 있는 것 같습니다.새로운 두유가 보여서 잠깐 다른 걸 먹어보더라도 다시 돌아오게 되는 익숙한 맛이에요.앞으로도 가격 괜찮을 때 한 박스씩 쟁여놓고 출근이나 외출할 때 하나씩 챙겨 먹을 생각입니다.저희 집에서는 특별히 고민하지 않고 늘 재구매하는 제품이에요.

                      - generic [ref=f178e3750]: 사무실에 두고 간편하게 먹으려고 주문했어요.완전두유 검은콩 17곡 고칼슘 190ml, 40개짜리로 샀는데 생각보다 사무실에서 반응이 괜찮더라고요ㅋㅋㅋ일단 190ml라 용량이 부담스럽지 않아서 좋아요.아침에 뭔가 먹기는 해야 하는데 밥 먹기는 귀찮고… 그렇다고 커피만 마시기는 양심에 찔리고… 그럴 때 하나 딱 들고 가면 간편하게 챙겨 먹기 좋습니다.저희 사무실에서는 특히 건강 생각하시는 분들이 음료 대신 이거 하나씩 챙겨 드시더라고요ㅋㅋㅋ냉장고에서 꺼내서 마시는 음료도 좋지만, 이건 팩으로 되어 있어서 사무실 한쪽에 쟁여놓기도 편하고 유통기한도 길어서 보관 부담이 적어요.맛은 생각보다 괜찮았어요!검은콩이나 곡물 들어간 제품이라 너무 밍밍하거나 텁텁할까 했는데, 적당히 달달해서 그냥 편하게 마시기 좋았습니다. 저는 개인적으로 너무 단 음료는 아침부터 부담스러운데 이 정도는 괜찮았어요.그리고 저희 사무실에 아침 안 먹고 출근하는 사람들이 꽤 있는데ㅋㅋㅋㅋ요즘은 일단 두유 하나 먹고 업무 시작합니다"밥은 안 먹어도 두유는 먹고 시작하자"가 되어버렸어요ㅋㅋㅋ아침을 거르는 분들이나 간단하게 아침 챙겨 드시는 분들, 또는 사무실에 간편하게 먹을 거 쟁여두고 싶은 분들에게 괜찮을 것 같아요.무엇보다 40개라 넉넉해서 하나씩 꺼내 먹기 좋고, 팩이라 보관도 편해서 만족합니다.사무실 간식(?)으로 사놨는데 생각보다 다들 잘 먹어서 금방 없어질 것 같네요ㅋㅋㅋ✔️ 190ml라 부담 없는 용량✔️ 적당히 달달해서 맛있음✔️ 검은콩+17곡이라 건강하게 챙겨 먹는 느낌✔️ 팩이라 보관 편하고 유통기한도 넉넉함✔️ 바쁜 아침 간단하게 먹기 좋음아침 안 먹고 출근하시는 분들… 일단 두유 하나 드시고 시작하세요ㅋㅋㅋ공복에 커피부터 때리는 것보다는 마음의 평화가 옵니다저는 사무실에 두고 먹으려고 산 건데 꽤 만족스러워서 다 먹으면 또 주문할 것 같아요!✨️

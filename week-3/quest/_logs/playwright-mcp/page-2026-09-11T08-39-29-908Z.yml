                      - generic [ref=e3969]: 아이들 간식으로 구운계란을 자주 사놓는 편이라 이번에도 30구짜리로 주문해봄.집에 아이들이 셋이다 보니 간식 하나 준비해도 금방 없어지는 편인데, 과자만 계속 먹이는 것보다는 계란 같은 걸 챙겨주는 게 마음이 조금 편해서 냉장고에 구운계란을 자주 넣어두는 편임.이번에 주문한 맛꾼 맥반석 구운계란은 찜질방에서 먹던 그 느낌을 생각하면 됨. 껍질을 까보면 일반 삶은 계란보다 색이 진하고 노른자도 살짝 쫀득한 느낌이 있음. 아이들도 그냥 삶은 계란보다 이런 구운계란을 더 잘 먹는 편임.무엇보다 아이들이 배고프다고 할 때 바로 하나 꺼내서 먹일 수 있다는 게 편함. 따로 조리할 필요도 없고 껍질만 까면 되니까 아침에 시간이 없을 때나 학교 다녀온 아이들 간식으로도 괜찮았음.저희 집에서는 아이들이 학교나 학원 다녀와서 배고프다고 하면 과자 대신 하나씩 먹기도 하고, 간단하게 출출할 때 먹고 있음. 셋이서 먹다 보니 30구도 생각보다 빠르게 줄어드는 편임 ㅎㅎ맛은 전체적으로 담백하고 촉촉하면서 쫄깃한 식감이 느껴지는 편임. 맥반석 구운계란 특유의 살짝 구워진 듯한 풍미가 있어서 그냥 먹어도 괜찮았음. 소금을 살짝 찍어 먹어도 잘 어울리고, 아이들은 그냥 까서 바로 먹는 경우가 많았음.구운계란은 배송 중 깨질까 은근 걱정되는 제품인데 파손보상이라는 부분도 있어서 주문할 때 조금 안심이 됐음. 실제로 받아보니 저희가 받은 제품은 큰 문제 없이 도착했음.30개라 가족 간식으로 넉넉하게 먹을 수 있고, 냉장고에 넣어두고 하나씩 꺼내 먹기에도 편함. 특히 아이들이 많은 집에서는 간식 준비해두기 좋은 제품이라고 생각함.화려한 간식은 아니지만 과자 대신 간단하게 먹일 수 있고, 아이들도 잘 먹어서 만족스러웠음. 저희 집은 아이들 간식용으로 재구매해도 괜찮겠다 싶음.

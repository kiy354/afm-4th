                      - generic [ref=f184e3888]: 아침에는 주로 시리얼을 먹고 있는데 기존에 먹던 멸균우유가 다 떨어져서 새 멸균우유를 찾던중이녀석은 1개씩만 파는 녀석이라 단품으로 맛을 보기위해서 구매하게 되었습니다.로켓 배송 제품이기 때문에 주문한 다음날 쿠팡맨을 통해서 문앞 배송 받을 수 있었습니다.첨부한 사진에서 보실 수 있듯이 쿠팡 비닐에 감싸진 상태로 배송을 받을 수 있었고내부에는 따로 뽁뽁이 없는 상태로 배송을 받았습니다. 상품을 꺼내보았을 때 다른 배송품에 조금 눌려서 그런지외부는 약간 종이 팩이 찌그러진 모양이었습니다. 정면에는 폴스 팜하우스 골드 엑스트라 크리미풀크림 밀크라 적혀있고 일반 폴스 우유의 경우 3.5%대의 유지방이던데 이 제품은 4.5%로 유지방이 조금 더많은 녀석임을 볼 수 있습니다. 밑에는 100%호주산 우유라고 적혀있습니다.옆면에는 영어로된 영양정보가 나와있고 반대편 옆면에는 한글의무표기설명이 스티커가 붙어는 있는데보관이 잘못된건지 스티커 일부가 찢어진 상태였습니다. 바닥면에는 큰 특징이 없었고윗면에는 우유의 제조일자(19년 7월 19일)와 유통기한이 나와있는데 3개월전 생산된 상품이고수령일기준으로 유통기한이 약 7개월 정도 남아있는 제품이었습니다. 일회용 그릇에 시리얼을 준비하고우유를 부어서 말아먹었는데 확실히 다른우유에 비해서 유지방 함량이 높으니 좀 더 고소하다는 느낌을 받습니다.1개 5천원이라 가격이 조금 비싼감은 있지만 맛은 확실한 녀석이네요추천합니다!

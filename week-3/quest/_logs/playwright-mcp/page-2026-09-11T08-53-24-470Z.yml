                      - generic [ref=f184e3932]: 폴스 팜하우스 골드 밀크 1L 제품을 라떼 만들어 먹으려고 구매했어요. 평소에 라떼를 자주 만들어 마시는 편인데저지우유가 라떼에 특히 잘 어울린다는 이야기를 들어서 궁금하던 차에 이 제품을 알게 됐어요. 유투브에서도 고소하고 진한 맛이 좋다고 하길래 기대하면서 주문했고요 지금은 아주 만족하면서 잘 마시고 있어요.이 우유는 저지우유답게 일반 우유보다 더 진하고 크리미한 느낌이 있어요. 처음 따랐을 때 색감도 살짝 진한 느낌이 들고 질감도 부드럽고 묵직하달까, 뭔가 더 고급진 맛이 느껴져요. 라떼로 만들어 마시면 확실히 고소함이 더 있는 것 같고 커피랑 섞였을 때 우유 맛이 묻히지 않고 조화를 잘 이루더라고요. 또 하나 좋았던 점은 개봉 전에는 실온보관이 가능하다는 거예요. 유통기한도 넉넉하고, 냉장고 자리 걱정 없이 보관할 수 있어서 참 편하더라고요. 개봉 후에는 당연히 냉장보관해야 하지만 빨리 마시게 되니까 문제도 없고요. 개봉 후에도 신선함이 꽤 오래 유지돼서 아침마다 부담 없이 라떼로 즐기고 있어요.가끔은 이 우유만으로 라떼를 만들기도 하고 일반 우유랑 2:1 정도로 섞어서 마시기도 하는데 그렇게 섞어 마셔도 맛이 연해지지 않고 여전히 고소하고 맛있어요. 일반 우유보다 우유 본연의 맛이 더 진해서 그런지 섞어도 존재감이 확실히 느껴져요. 저지우유 특유의 풍부함 덕분에 라떼 말고 시리얼이나 요리에 넣어도 좋을 것 같다는 생각이 들어요.가격은 일반 우유보다는 조금 있는 편이에요.부드러우면서도 고소한 그 맛이 꽤 중독성 있어요.

const nf = (n, d = 0) =>
  n == null || Number.isNaN(n) ? '—' : n.toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });

/** 달러 가격 — 자릿수에 따라 소수점 개수를 바꾼다 */
function usd(n) {
  if (n == null || Number.isNaN(n)) return '—';
  if (n >= 1000) return '$' + nf(n, 2);
  if (n >= 1)    return '$' + nf(n, 2);
  if (n >= 0.01) return '$' + n.toFixed(4);
  return '$' + n.toFixed(6);
}

/** 큰 달러 금액 — $1.73T / $332.9B / $22.1M */
function usdBig(n) {
  if (n == null || Number.isNaN(n)) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
  if (abs >= 1e9)  return '$' + (n / 1e9).toFixed(1) + 'B';
  if (abs >= 1e6)  return '$' + (n / 1e6).toFixed(1) + 'M';
  return '$' + nf(n);
}

/** 원화 금액 — 1억 1,655만원 / 3,676,000원 */
function krw(n) {
  if (n == null || Number.isNaN(n)) return '—';
  if (n >= 1e8) {
    const eok = Math.floor(n / 1e8);
    const man = Math.floor((n % 1e8) / 1e4);
    return `${nf(eok)}억 ${nf(man)}만원`;
  }
  return nf(Math.round(n)) + '원';
}

/** 퍼센트 — 색과 함께 부호·화살표를 같이 넣는다 (색만으로 방향을 표현하지 않기 위해) */
function pctParts(n) {
  if (n == null || Number.isNaN(n)) return { text: '—', dir: 'flat' };
  const dir = n > 0.005 ? 'up' : n < -0.005 ? 'down' : 'flat';
  const arrow = dir === 'up' ? '▲ +' : dir === 'down' ? '▼ −' : '';
  return { text: arrow + Math.abs(n).toFixed(2) + '%', dir };
}

const DIR_TEXT = { up: 'text-emerald-700', down: 'text-rose-700', flat: 'text-slate-500' };
const DIR_CHIP = {
  up:   'bg-emerald-50 text-emerald-800 ring-emerald-200',
  down: 'bg-rose-50 text-rose-800 ring-rose-200',
  warn: 'bg-amber-50 text-amber-800 ring-amber-200',
  flat: 'bg-slate-100 text-slate-600 ring-slate-300',
};

/** 공포·탐욕 지수 → 구간 이름 */
function fngLabel(v) {
  if (v == null) return { ko: '—', chip: 'flat' };
  if (v >= 76) return { ko: '극단적 탐욕', chip: 'warn' };
  if (v >= 56) return { ko: '탐욕',        chip: 'warn' };
  if (v >= 46) return { ko: '중립',        chip: 'flat' };
  if (v >= 26) return { ko: '공포',        chip: 'down' };
  return { ko: '극단적 공포', chip: 'down' };
}


// ============================================================
// 📡 실시간 데이터
//
// 전부 CORS 가 열려 있어서 브라우저에서 직접 부른다 (백엔드 없음).
// 업비트 KRW 마켓 목록은 한 번만 받아서 모듈 변수에 캐시한다 —
// 상장 안 된 심볼을 ticker 에 섞으면 요청 전체가 실패하기 때문.
// ============================================================
const GECKO = 'https://api.coingecko.com/api/v3';
let krwMarketCache = null;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function getJson(url, label) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${label} ${res.status}`);
  return res.json();
}

async function getJsonRetry(url, label, tries = 2) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      return await getJson(url, label);
    } catch (e) {
      last = e;
      if (i < tries - 1) await sleep(500);
    }
  }
  throw last;
}

/**
 * 업비트만 서버를 한 번 거친다.
 *
 * 업비트는 `*.vercel.app` 출처의 브라우저 요청에 CORS 헤더를 주지 않는다.
 * (똑같은 요청이 localhost 와 example.com 에서는 200 으로 돌아온다 — 출처로 막는 것이다.)
 * 그래서 배포본에서는 같은 오리진의 `/api/upbit` 프록시를 쓴다.
 *
 * 다만 정적 서버로 로컬 실행하면 `/api/upbit` 가 없다. 그때는 업비트를 직접 부른다 —
 * localhost 출처는 업비트가 허용하므로 이쪽이 그대로 동작한다.
 */
async function fetchUpbit(path, params = {}) {
  const qs = new URLSearchParams({ path, ...params }).toString();
  try {
    return await getJsonRetry(`/api/upbit?${qs}`, '업비트 프록시');
  } catch (e) {
    const direct =
      path === 'market/all'
        ? 'https://api.upbit.com/v1/market/all?isDetails=false'
        : `https://api.upbit.com/v1/ticker?markets=${params.markets}`;
    return getJsonRetry(direct, '업비트 직접');
  }
}

/**
 * KRW 마켓 목록 — 자주 바뀌지 않으므로 하루 동안 localStorage 에 둔다.
 * 매 로드마다 받으면 업비트를 연달아 두 번(목록 + 시세) 때리게 되고,
 * 그 두 번째가 레이트리밋에 걸려 김치 프리미엄이 통째로 비었다.
 */
const KRW_CACHE_KEY = 'coin-research.krwMarkets.v1';
const KRW_CACHE_TTL = 24 * 60 * 60 * 1000;

function readKrwCache() {
  try {
    const raw = localStorage.getItem(KRW_CACHE_KEY);
    if (!raw) return null;
    const { at, syms } = JSON.parse(raw);
    if (!Array.isArray(syms) || Date.now() - at > KRW_CACHE_TTL) return null;
    return new Set(syms);
  } catch { return null; }
}

function writeKrwCache(set) {
  try {
    localStorage.setItem(KRW_CACHE_KEY, JSON.stringify({ at: Date.now(), syms: [...set] }));
  } catch { /* 시크릿 모드 등 — 캐시 없이도 동작한다 */ }
}

async function fetchKrwMarkets() {
  if (krwMarketCache) return krwMarketCache;

  const cached = readKrwCache();
  if (cached) { krwMarketCache = cached; return cached; }

  const list = await fetchUpbit('market/all');
  krwMarketCache = new Set(
    list.filter((m) => m.market.startsWith('KRW-')).map((m) => m.market.slice(4))
  );
  writeKrwCache(krwMarketCache);
  return krwMarketCache;
}

async function fetchLive() {
  const ids = COINS.map((c) => c.id).join(',');

  // 업비트 ticker 는 마켓 목록을 먼저 알아야 하므로 2단계로 나눈다
  const krwSet = await fetchKrwMarkets().catch(() => null);
  const wanted = COINS.filter((c) => krwSet && krwSet.has(c.sym)).map((c) => 'KRW-' + c.sym);

  const jobs = [
    getJson(`${GECKO}/coins/markets?vs_currency=usd&ids=${ids}&order=market_cap_desc&price_change_percentage=1h,24h,7d`, '시세'),
    getJson(`${GECKO}/global`, '글로벌'),
    getJson('https://api.alternative.me/fng/?limit=2', '공포탐욕'),
    getJson('https://open.er-api.com/v6/latest/USD', '환율'),
    wanted.length
      ? fetchUpbit('ticker', { markets: wanted.join(',') })
      : Promise.resolve([]),
  ];

  const [mk, gl, fg, fx, up] = await Promise.allSettled(jobs);
  const val = (r) => (r.status === 'fulfilled' ? r.value : null);
  const failed = ['시세', '글로벌', '공포탐욕', '환율', '업비트']
    .filter((_, i) => [mk, gl, fg, fx, up][i].status === 'rejected');

  const markets = val(mk) || [];
  const upbit = val(up) || [];
  const global = val(gl) && val(gl).data;
  const fng = val(fg) && val(fg).data;
  const rates = val(fx) && val(fx).rates;

  // 심볼 기준으로 해외/국내 시세를 합친다
  const bySym = {};
  for (const c of COINS) {
    const m = markets.find((x) => x.id === c.id);
    const u = upbit.find((x) => x.market === 'KRW-' + c.sym);
    if (!m && !u) continue;
    bySym[c.sym] = {
      ...c,
      usd: m ? m.current_price : null,
      chg1h: m ? m.price_change_percentage_1h_in_currency : null,
      chg24h: m ? m.price_change_percentage_24h_in_currency : null,
      chg7d: m ? m.price_change_percentage_7d_in_currency : null,
      mcap: m ? m.market_cap : null,
      vol: m ? m.total_volume : null,
      athPct: m ? m.ath_change_percentage : null,
      ath: m ? m.ath : null,
      krwNow: u ? u.trade_price : null,
      krwChg: u ? u.signed_change_rate * 100 : null,
      krwVol24h: u ? u.acc_trade_price_24h : null,
      krwHigh52: u ? u.highest_52_week_price : null,
      krwHigh52At: u ? u.highest_52_week_date : null,
      krwLow52: u ? u.lowest_52_week_price : null,
      krwLow52At: u ? u.lowest_52_week_date : null,
    };
  }

  const fxKrw = rates ? rates.KRW : null;

  // 김치 프리미엄 = 업비트 원화가 ÷ (해외 달러가 × 환율) − 1
  for (const s of Object.keys(bySym)) {
    const c = bySym[s];
    c.abroadKrw = c.usd != null && fxKrw ? c.usd * fxKrw : null;
    c.kimchi = c.krwNow != null && c.abroadKrw ? (c.krwNow / c.abroadKrw - 1) * 100 : null;
  }

  return {
    bySym,
    fx: fxKrw,
    mcap: global ? global.total_market_cap.usd : null,
    mcapChg: global ? global.market_cap_change_percentage_24h_usd : null,
    dom: global ? global.market_cap_percentage : null,
    fng: fng && fng[0] ? Number(fng[0].value) : null,
    fngPrev: fng && fng[1] ? Number(fng[1].value) : null,
    failed,
    at: new Date(),
  };
}

/** 52주 저점↔고점 사이에서 현재가가 어디인지 */
function RangeBar({ coin }) {
  const { krwLow52: lo, krwHigh52: hi, krwNow: now } = coin;
  if (lo == null || hi == null || now == null || hi <= lo) return null;

  const pos = Math.min(100, Math.max(0, ((now - lo) / (hi - lo)) * 100));
  const fromHigh = (now / hi - 1) * 100;
  const fromLow = (now / lo - 1) * 100;

  return (
    <div>
      <div className="mb-2 flex items-baseline justify-between gap-3">
        <div className="text-sm font-semibold text-slate-900">
          {coin.ko} <span className="nums ml-1 text-[11px] font-normal text-slate-500">{coin.sym}</span>
        </div>
        <div className="nums text-sm font-semibold text-slate-900">{krw(now)}</div>
      </div>

      <div className="relative h-2.5 rounded-sm border border-slate-300 bg-slate-200">
        <div className="absolute inset-y-0 left-0 rounded-l-sm bg-sky-800/85" style={{ width: pos + '%' }} />
        <div
          className="absolute -top-1 -bottom-1 w-[3px] -translate-x-1/2 bg-slate-900"
          style={{ left: pos + '%' }}
          aria-hidden="true"
        />
      </div>

      <div className="nums mt-2 flex flex-wrap justify-between gap-x-3 gap-y-1 text-[11px] text-slate-500">
        <span>저점 {krw(lo)} <span className="opacity-60">{coin.krwLow52At}</span></span>
        <span className="font-medium text-slate-700">

          <span className={DIR_TEXT[fromHigh < 0 ? 'down' : 'up']}>

      </div>
    </div>
  );
}

            <li key={t.head} className="grid gap-x-5 gap-y-1 border-b border-slate-300 py-3.5 sm:grid-cols-[110px_1fr]">
              <time className="nums pt-0.5 text-xs font-medium text-sky-800">{t.when}</time>
              <div>
                <h3 className="text-sm font-semibold text-slate-900">{t.head}</h3>
                <p className="mt-0.5 max-w-[74ch] text-[13px] leading-relaxed text-slate-600">{t.body}</p>
              </div>
            </li>
          ))}
        </ul>
      </section>
    </div>
  );
}


// ============================================================
// 🧭 앱 — 해시 라우팅 + 실시간 갱신
// ============================================================
const PAGES = [
  { path: '/',        label: '개요',      el: Overview },
  { path: '/market',  label: '시세',      el: Market },
  { path: '/macro',   label: '매크로',    el: Macro },
  { path: '/levels',  label: '포지셔닝',  el: Levels },
  { path: '/risk',    label: '리스크',    el: Risk },
];

const REFRESH_MS = 90_000; // CoinGecko 무료 티어 레이트리밋을 고려해 90초

function useHashRoute() {
  const read = () => (window.location.hash.replace(/^#/, '') || '/');
  const [path, setPath] = useState(read);
  useEffect(() => {
    const on = () => { setPath(read()); window.scrollTo({ top: 0, behavior: 'instant' }); };
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  return path;
}

function App() {
  const path = useHashRoute();
  const page = PAGES.find((p) => p.path === path) || PAGES[0];

  const [live, setLive] = useState({ bySym: {}, failed: [], at: null });
  const [state, setState] = useState('loading'); // loading | ok | stale
  const timer = useRef(null);

  const load = useCallback(async () => {
    try {
      const data = await fetchLive();
      setLive(data);
      // 일부만 실패하면 그 부분만 스냅숏으로 떨어뜨리고 배너로 알린다
      setState(data.failed.length ? 'stale' : 'ok');
    } catch (e) {
      console.error('[실시간 수집 실패]', e);
      setState('stale');
      setLive((prev) => ({ ...prev, failed: ['전체'] }));
    }
  }, []);

  useEffect(() => {
    load();
    const tick = () => { if (!document.hidden) load(); };
    timer.current = setInterval(tick, REFRESH_MS);
    // 탭으로 돌아오면 바로 한 번 갱신
    const onVis = () => { if (!document.hidden) load(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(timer.current); document.removeEventListener('visibilitychange', onVis); };
  }, [load]);

  const Page = page.el;
  const stamp = live.at
    ? live.at.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
    : '—';

  return (
    <div className="min-h-screen">
      {/* 헤더 */}
      <header className="bg-slate-900 text-slate-100">
        <div className="mx-auto max-w-5xl px-5 pb-5 pt-8 sm:pt-10">
          <div className="text-[11px] font-semibold uppercase tracking-[0.16em] text-sky-300">
            암호화폐 시장 리서치
          </div>
          <h1 className="mt-2 text-3xl font-bold tracking-tight sm:text-4xl">코인 시장 리서치</h1>
          <p className="mt-3 max-w-[62ch] text-[15px] font-light leading-relaxed text-slate-300">
            추세·심리·수급은 모두 위험선호로 돌아섰는데, 금리는 내려가는 게 아니라 올라갈 차례다. 이 어긋남이 지금 시장의
            전부다.
          </p>

          <div className="nums mt-5 flex flex-wrap items-center gap-x-5 gap-y-2 text-xs text-slate-400">
            <span className="inline-flex items-center gap-1.5">
              <span
                className={`live-dot inline-block h-1.5 w-1.5 rounded-full ${
                  state === 'ok' ? 'bg-emerald-400' : state === 'loading' ? 'bg-sky-400' : 'bg-amber-400'
                }`}
              />
              {state === 'loading' ? '불러오는 중' : state === 'ok' ? `실시간 ${stamp}` : `일부 지연 ${stamp}`}
            </span>
            <span>스냅숏 기준 <b className="font-medium text-slate-200">{SNAPSHOT.collectedAt}</b></span>
            <button
              type="button"
              onClick={load}
              className="rounded border border-slate-600 px-2 py-0.5 font-sans text-slate-200 transition hover:border-slate-400 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-400"
            >
              새로 고치기
            </button>
          </div>
        </div>

        {/* 탭 */}
        <nav className="border-t border-slate-700/60">
          <div className="no-scrollbar mx-auto max-w-5xl overflow-x-auto px-5">
            <ul className="flex gap-1">
              {PAGES.map((p) => {
                const on = p.path === page.path;
                return (
                  <li key={p.path}>
                    <a
                      href={'#' + p.path}
                      aria-current={on ? 'page' : undefined}
                      className={`inline-block whitespace-nowrap border-b-2 px-3 py-2.5 text-sm transition ${
                        on
                          ? 'border-sky-400 font-semibold text-white'
                          : 'border-transparent text-slate-400 hover:text-slate-100'
                      }`}
                    >
                      {p.label}
                    </a>
                  </li>
                );
              })}
            </ul>
          </div>
        </nav>
      </header>

      {/* 지연 배너 */}
      {state === 'stale' && (
        <div className="border-b border-amber-300 bg-amber-50">
          <div className="mx-auto max-w-5xl px-5 py-2.5 text-[13px] text-amber-900">
            실시간 호출이 일부 실패했습니다 ({live.failed.join(', ')}). 해당 항목은 <b>수집 스냅숏 값</b>으로 표시됩니다.
            잠시 뒤 자동으로 다시 시도합니다.
          </div>
        </div>
      )}

      {/* 본문 */}
      <main className="mx-auto max-w-5xl px-5 py-10">
        <Page live={live} />
      </main>

      {/* 푸터 */}
      <footer className="border-t border-slate-300 bg-white">
        <div className="mx-auto max-w-5xl px-5 py-8">
          <h2 className="text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-500">데이터 출처</h2>
          <dl className="mt-3 grid gap-x-8 gap-y-1.5 text-[13px] sm:grid-cols-2">
            {SNAPSHOT.sources.map(([name, what]) => (
              <div key={name} className="flex gap-2">
                <dt className="shrink-0 font-medium text-slate-800">{name}</dt>
                <dd className="text-slate-500">{what}</dd>
              </div>
            ))}
          </dl>

          <p className="mt-6 max-w-[78ch] border border-slate-300 bg-slate-50 p-4 text-[13px] leading-relaxed text-slate-600">
            이 사이트는 공개 웹페이지와 공개 API에서 수집한 데이터를 정리한 <b className="font-semibold">리서치 노트</b>이며,
            투자 권유나 자문이 아닙니다. 2차 가공된 항목(김치 프리미엄, 구간 내 위치, 청산가 추정)은 환율·호가 반올림·추적
            방법에 따라 오차가 있습니다. 특히 청산가와 고래 포지션은 제3자 추정값입니다. 투자 판단과 그 결과는 투자자 본인의
            책임입니다.
          </p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>

<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
// ========================================
// React Hooks
// ========================================
const { useState, useEffect, useMemo, useCallback, useContext, createContext } = React;


// ========================================
// 📡 API Client
// ========================================
const API_BASE_URL = '/api';

/** 모든 응답은 { success, data, message? } 구조. 실패 시 Error 를 던진다. */
async function api(endpoint, options = {}) {
  const res = await fetch(`${API_BASE_URL}${endpoint}`, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });

  let body = {};
  try {
    body = await res.json();
  } catch (_) {
    throw new Error(`서버 응답을 해석할 수 없습니다 (${res.status})`);
  }

  if (!res.ok || body.success === false) {
    throw new Error(body.message || `요청에 실패했습니다 (${res.status})`);
  }

  return body.data;
}


// ========================================
// 🗓️ Date Helpers
// ========================================
const TODAY = new Date();
TODAY.setHours(0, 0, 0, 0);

/** Date -> 'YYYY-MM-DD' (toISOString 은 타임존 때문에 하루 밀릴 수 있어 직접 포맷) */
function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

/** 오늘로부터 n일 뒤의 'YYYY-MM-DD' */
function dateFromToday(offsetDays) {
  const d = new Date(TODAY);
  d.setDate(d.getDate() + offsetDays);
  return formatDate(d);
}

/** 'YYYY-MM-DD' 까지 남은 일수 (오늘=0, 지난 날짜는 음수) */
function daysLeft(dateStr) {
  const target = new Date(`${dateStr}T00:00:00`);
  return Math.round((target - TODAY) / 86400000);
}

/** 유통기한 상태 -> 뱃지 문구/색상 */
function expiryStatus(dateStr) {
  const d = daysLeft(dateStr);
  if (d < 0)   return { level: 'expired', label: `${Math.abs(d)}일 지남`, tone: 'danger' };
  if (d === 0) return { level: 'today',   label: '오늘까지',              tone: 'danger' };
  if (d <= 2)  return { level: 'urgent',  label: `D-${d}`,               tone: 'danger' };
  if (d <= 5)  return { level: 'soon',    label: `D-${d}`,               tone: 'caution' };
  return { level: 'fresh', label: `D-${d}`, tone: 'neutral' };
}

/** 유통기한 임박순 정렬 (원본은 건드리지 않음).
 *  'YYYY-MM-DD' 는 문자열 비교만으로 날짜순이 되고, 같은 날이면 서버처럼 id 순. */
function sortByExpiry(list) {
  return [...list].sort((a, b) => a.expiry.localeCompare(b.expiry) || a.id - b.id);
}

/**
 * 레시피 분량 문자열 → { value, unit }.
 * '3개' → {3,'개'}, '1/2모' → {0.5,'모'}, '200g' → {200,'g'}.
 * '적당량'처럼 숫자로 시작하지 않으면 null.
 */
function parseAmount(text) {
  const m = String(text).trim().match(/^(\d+(?:\.\d+)?)(?:\s*\/\s*(\d+))?\s*(.*)$/);
  if (!m) return null;

  const value = m[2] ? Number(m[1]) / Number(m[2]) : Number(m[1]);
  return { value: Math.round(value * 100) / 100, unit: m[3].trim() };
}


// ========================================
// 🏷️ UI 상수 (데이터가 아닌 분류 체계)
// ========================================
const BASE_CATEGORIES = ['채소', '육류', '해산물', '유제품', '곡물', '가공식품', '반찬', '기타'];
const PLACES = ['냉장', '냉동', '실온'];


// ========================================
// 🎨 Design System Components
// ========================================
function Button({ variant = 'primary', size = 'md', disabled = false, onClick, type = 'button', className = '', children, ...rest }) {
  const base = 'inline-flex items-center justify-center gap-1.5 font-semibold rounded-xl transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed';

  const variants = {
    primary:   'bg-emerald-600 text-white hover:bg-emerald-700 active:bg-emerald-800',
    secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 active:bg-slate-100',
    danger:    'bg-rose-600 text-white hover:bg-rose-700 active:bg-rose-800',
    ghost:     'bg-transparent text-slate-600 hover:bg-slate-100 active:bg-slate-200',
  };

  const sizes = {
    sm: 'text-xs px-2.5 py-1.5',
    md: 'text-sm px-4 py-2.5',
    lg: 'text-base px-5 py-3',
  };

  return (
    <button
      type={type}
      onClick={onClick}
      disabled={disabled}
      className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
      {...rest}
    >
      {children}
    </button>
  );
}

function Input({ label, type = 'text', value, onChange, placeholder, error, disabled = false, className = '', ...rest }) {
  return (
    <label className={`block ${className}`}>
      {label && <span className="block mb-1.5 text-sm font-medium text-slate-700">{label}</span>}
      <input
        type={type}
        value={value}
        onChange={onChange}
        placeholder={placeholder}
        disabled={disabled}
        aria-invalid={error ? 'true' : 'false'}
        className={`w-full rounded-xl border px-3.5 py-2.5 text-sm placeholder:text-slate-400 transition-colors focus:outline-none focus:ring-2 disabled:bg-slate-100 ${
          error
            ? 'border-rose-400 focus:border-rose-500 focus:ring-rose-200'
            : 'border-slate-300 focus:border-emerald-500 focus:ring-emerald-200'
        }`}
        {...rest}
      />
      {error && <span className="mt-1 block text-xs font-medium text-rose-600">{error}</span>}
    </label>
  );
}

function Select({ label, value, onChange, options = [], className = '', ...rest }) {
  return (
    <label className={`block ${className}`}>
      {label && <span className="block mb-1.5 text-sm font-medium text-slate-700">{label}</span>}
      <select
        value={value}
        onChange={onChange}
        className="w-full appearance-none rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm transition-colors focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"
        {...rest}
      >
        {options.map((opt) => {
          // 'a' 처럼 문자열만 주면 value 와 label 을 같게 쓴다.
          const { value: v, label: l } = typeof opt === 'string' ? { value: opt, label: opt } : opt;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </label>
  );
}

function Textarea({ label, value, onChange, placeholder, rows = 3, maxLength, disabled = false, className = '', ...rest }) {
  return (
    <label className={`block ${className}`}>
      {label && <span className="block mb-1.5 text-sm font-medium text-slate-700">{label}</span>}
      <textarea
        value={value}
        onChange={onChange}
        placeholder={placeholder}
        rows={rows}
        maxLength={maxLength}
        disabled={disabled}
        className="w-full resize-none rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm placeholder:text-slate-400 transition-colors focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200 disabled:bg-slate-100"
        {...rest}
      />
      {maxLength && (
        <span className="mt-1 block text-right text-xs tabular-nums text-slate-400">
          {value.length} / {maxLength}
        </span>
      )}
    </label>
  );
}

function Card({ className = '', children, ...rest }) {
  return (
    <div className={`rounded-2xl border border-slate-200 bg-white p-5 shadow-sm ${className}`} {...rest}>
      {children}
    </div>
  );
}

function Badge({ tone = 'neutral', className = '', children }) {
  const tones = {
    neutral: 'bg-slate-100 text-slate-600 border-slate-200',
    success: 'bg-emerald-50 text-emerald-700 border-emerald-200',
    caution: 'bg-amber-50 text-amber-700 border-amber-200',
    warning: 'bg-orange-50 text-orange-700 border-orange-200',
    danger:  'bg-rose-50 text-rose-700 border-rose-200',
    info:    'bg-sky-50 text-sky-700 border-sky-200',
  };

  return (
    <span className={`inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-xs font-semibold ${tones[tone]} ${className}`}>
      {children}
    </span>
  );
}

function ProgressBar({ value = 0, tone = 'emerald', className = '' }) {
  const tones = {
    emerald: 'bg-emerald-500',
    amber: 'bg-amber-500',
    rose: 'bg-rose-500',
  };

  return (
    <div className={`h-2 w-full overflow-hidden rounded-full bg-slate-200 ${className}`} role="progressbar" aria-valuenow={Math.round(value)} aria-valuemin="0" aria-valuemax="100">
      <div className={`h-full rounded-full transition-all duration-500 ${tones[tone]}`} style={{ width: `${Math.max(0, Math.min(100, value))}%` }} />
    </div>
  );
}

function StatTile({ label, value, unit, tone = 'neutral', icon }) {
  const tones = {
    neutral: 'text-slate-900',
    success: 'text-emerald-600',
    warning: 'text-orange-600',
    danger:  'text-rose-600',
  };

  return (
    <Card className="p-4">
      <div className="flex items-center gap-1.5 text-xs font-medium text-slate-500">
        <span aria-hidden="true">{icon}</span>
        <span>{label}</span>
      </div>
      <p className={`mt-1.5 text-2xl font-bold tabular-nums ${tones[tone]}`}>
        {value}
        {unit && <span className="ml-0.5 text-sm font-semibold text-slate-400">{unit}</span>}
      </p>
    </Card>
  );
}

// dismissible=false 면 배경 클릭·Esc·✕ 로 닫히지 않는다 (예: 저장 중).
function Modal({ isOpen, onClose, title, size = 'md', dismissible = true, children }) {
  const close = dismissible ? onClose : undefined;

  useEffect(() => {
    if (!isOpen) return undefined;

    const onKeyDown = (e) => { if (e.key === 'Escape' && close) close(); };
    document.addEventListener('keydown', onKeyDown);
    document.body.style.overflow = 'hidden';

    return () => {
      document.removeEventListener('keydown', onKeyDown);
      document.body.style.overflow = '';
    };
  }, [isOpen, close]);

  if (!isOpen) return null;

  const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-2xl' };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/50 p-0 sm:items-center sm:p-4" onClick={close}>
      <div
        role="dialog"
        aria-modal="true"
        aria-label={title}
        onClick={(e) => e.stopPropagation()}
        className={`animate-fade-up w-full ${sizes[size]} max-h-[90vh] overflow-y-auto rounded-t-2xl bg-white shadow-xl sm:rounded-2xl`}
      >
        <div className="flex items-center justify-between border-b border-slate-200 px-5 py-4">
          <h2 className="text-base font-bold text-slate-900">{title}</h2>
          <button
            type="button"
            onClick={close}
            disabled={!close}
            aria-label="닫기"
            className="rounded-lg p-1.5 text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600 disabled:opacity-30"
          >
            ✕
          </button>
        </div>
        <div className="px-5 py-5">{children}</div>
      </div>
    </div>
  );
}

function EmptyState({ icon = '🫙', title, description, action }) {
  return (
    <div className="flex flex-col items-center justify-center rounded-2xl border border-dashed border-slate-300 bg-white/60 px-6 py-14 text-center">
      <div className="text-4xl" aria-hidden="true">{icon}</div>
      <h3 className="mt-3 text-base font-bold text-slate-800">{title}</h3>
      {description && <p className="mt-1 max-w-xs text-sm text-slate-500">{description}</p>}
      {action && <div className="mt-5">{action}</div>}
    </div>
  );
}

function SuccessBanner({ onClose, children }) {
  return (
    <div className="animate-fade-up mb-4 flex items-center justify-between gap-3 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800" role="status">
      <span>{children}</span>
      <button type="button" onClick={onClose} aria-label="닫기" className="shrink-0 opacity-60 hover:opacity-100">✕</button>
    </div>
  );
}

function FavoriteButton({ active, onClick, className = '' }) {
  return (
    <button
      type="button"
      onClick={onClick}
      aria-pressed={active}
      aria-label={active ? '즐겨찾기 해제' : '즐겨찾기'}
      className={`rounded-lg p-1.5 text-xl leading-none transition-colors hover:bg-amber-50 ${active ? 'text-amber-400' : 'text-slate-300 hover:text-amber-300'} ${className}`}
    >
      {active ? '★' : '☆'}
    </button>
  );
}

function Spinner({ label = '불러오는 중...' }) {
  return (
    <div className="flex flex-col items-center justify-center gap-3 py-20" role="status" aria-live="polite">
      <div className="h-8 w-8 animate-spin rounded-full border-[3px] border-slate-200 border-t-emerald-600" />
      <p className="text-sm font-medium text-slate-500">{label}</p>
    </div>
  );
}

function Toast({ message, onClose }) {
  useEffect(() => {
    if (!message) return undefined;

    const timer = setTimeout(onClose, 3200);
    return () => clearTimeout(timer);
  }, [message, onClose]);

  if (!message) return null;

  return (
    <div className="fixed bottom-5 left-1/2 z-50 w-[min(calc(100%-2rem),24rem)] -translate-x-1/2" role="alert">
      <div className="animate-fade-up flex items-start gap-2 rounded-xl bg-rose-600 px-4 py-3 text-sm font-medium text-white shadow-lg">
        <span aria-hidden="true">⚠️</span>
        <span className="flex-1">{message}</span>
        <button type="button" onClick={onClose} aria-label="닫기" className="shrink-0 opacity-70 hover:opacity-100">✕</button>
      </div>
    </div>
  );
}


// ========================================
// 🔀 Router Components (hash-based)
// ========================================
const RouterContext = createContext(null);

/** '/recipes/:id' 패턴을 현재 경로에 매칭. 실패 시 null */
function matchRoute(pattern, pathname) {
  const patternParts = pattern.split('/').filter(Boolean);
  const pathParts = pathname.split('/').filter(Boolean);

  if (patternParts.length !== pathParts.length) return null;

  const params = {};

  for (let i = 0; i < patternParts.length; i += 1) {
    const p = patternParts[i];

    if (p.startsWith(':')) {
      params[p.slice(1)] = decodeURIComponent(pathParts[i]);
    } else if (p !== pathParts[i]) {
      return null;
    }
  }

  return params;
}

function currentPath() {
  const hash = window.location.hash.replace(/^#/, '');
  return hash || '/';
}

function Router({ children }) {
  const [path, setPath] = useState(currentPath);

  useEffect(() => {
    const onHashChange = () => {
      setPath(currentPath());
      window.scrollTo(0, 0);
    };

    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  const navigate = useCallback((to) => { window.location.hash = to; }, []);

  const value = useMemo(() => ({ path, navigate, params: {} }), [path, navigate]);

  return <RouterContext.Provider value={value}>{children}</RouterContext.Provider>;
}

function useRouter() {
  return useContext(RouterContext);
}

function useParams() {
  return useContext(RouterContext).params;
}

function Route() {
  // <Routes> 가 props 만 읽어 처리하므로 직접 렌더링하지 않는다.
  return null;
}

function Routes({ children, fallback = null }) {
  const router = useRouter();
  const routes = React.Children.toArray(children);

  for (const route of routes) {
    const params = matchRoute(route.props.path, router.path);

    if (params) {
      return (
        <RouterContext.Provider value={{ ...router, params }}>
          {route.props.element}
        </RouterContext.Provider>
      );
    }
  }

  return fallback;
}

function Link({ to, className = '', children, ...rest }) {
  return (
    <a href={`#${to}`} className={className} {...rest}>{children}</a>
  );
}


// ========================================
// 🗄️ App State — 서버(/api)와 동기화
// ========================================
const AppStateContext = createContext(null);

function AppStateProvider({ children }) {
  const [ingredients, setIngredients] = useState([]);
  const [recipes, setRecipes] = useState([]);
  const [shopping, setShopping] = useState([]);

  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [toast, setToast] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    setLoadError(null);

    try {
      const [ing, rec, shop] = await Promise.all([
        api('/ingredients'),
        api('/recipes'),
        api('/shopping'),
      ]);

      setIngredients(ing);
      setRecipes(rec);
      setShopping(shop);
    } catch (err) {
      setLoadError(err.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  // ── 재료 ──────────────────────────────────
  const addIngredient = useCallback(async (item) => {
    try {
      const created = await api('/ingredients', { method: 'POST', body: JSON.stringify(item) });
      setIngredients((prev) => sortByExpiry([...prev, created]));
    } catch (err) {
      setToast(err.message);
    }
  }, []);

  // 수정·요리 완료·입고는 run() 으로 감싼다: 성공하면 서버 결과를, 실패하면
  // 토스트를 띄우고 null 을 돌려준다. 호출하는 모달은 null 이면 닫지 않는다.
  const run = async (fn) => {
    try {
      return await fn();
    } catch (err) {
      setToast(err.message);
      return null;
    }
  };

  const updateIngredient = useCallback((id, patch) => run(async () => {
    const saved = await api(`/ingredients/${id}`, { method: 'PATCH', body: JSON.stringify(patch) });
    setIngredients((prev) => sortByExpiry(prev.map((it) => (it.id === id ? saved : it))));
    return saved;
  }), []);

  const removeIngredient = useCallback(async (id) => {
    const snapshot = ingredients;
    setIngredients((prev) => prev.filter((it) => it.id !== id));   // 낙관적 업데이트

    try {
      await api(`/ingredients/${id}`, { method: 'DELETE' });
    } catch (err) {
      setIngredients(snapshot);                                     // 실패 시 롤백
      setToast(err.message);
    }
  }, [ingredients]);

  // ── 레시피 ────────────────────────────────
  // AI 생성은 서버가 OpenAI 를 호출하고 DB 에 저장한 뒤 결과를 돌려준다.
  const generateRecipe = useCallback(async (payload) => {
    const created = await api('/recipes/generate', { method: 'POST', body: JSON.stringify(payload) });
    setRecipes((prev) => [...prev, created]);
    return created;
  }, []);

  const removeRecipe = useCallback(async (id) => {
    const snapshot = recipes;
    setRecipes((prev) => prev.filter((r) => r.id !== id));

    try {
      await api(`/recipes/${id}`, { method: 'DELETE' });
    } catch (err) {
      setRecipes(snapshot);
      setToast(err.message);
    }
  }, [recipes]);

  // 바꿀 값(next)을 호출하는 쪽에서 받아서 recipes 에 의존하지 않는다.
  const toggleFavorite = useCallback(async (id, next) => {
    setRecipes((prev) => prev.map((r) => (r.id === id ? { ...r, is_favorite: next } : r)));

    try {
      await api(`/recipes/${id}`, { method: 'PATCH', body: JSON.stringify({ is_favorite: next }) });
    } catch (err) {
      setRecipes((prev) => prev.map((r) => (r.id === id ? { ...r, is_favorite: !next } : r)));
      setToast(err.message);
    }
  }, []);

  // 요리 완료: 서버가 차감 결과(updated/deleted)와 횟수가 갱신된 레시피를 돌려준다.
  const cookRecipe = useCallback((id, uses) => run(async () => {
    const result = await api(`/recipes/${id}/cook`, { method: 'POST', body: JSON.stringify({ uses }) });
    const updatedById = new Map(result.updated.map((it) => [it.id, it]));
    const deleted = new Set(result.deleted);

    setIngredients((prev) => prev
      .filter((it) => !deleted.has(it.id))
      .map((it) => updatedById.get(it.id) || it));
    setRecipes((prev) => prev.map((r) => (r.id === id ? result.recipe : r)));
    return result;
  }), []);

  // ── 장보기 ────────────────────────────────
  const addToShopping = useCallback(async (names) => {
    try {
      const created = await api('/shopping', { method: 'POST', body: JSON.stringify({ names }) });
      if (created.length > 0) setShopping((prev) => [...prev, ...created]);
    } catch (err) {
      setToast(err.message);
    }
  }, []);

  const toggleShopping = useCallback(async (id) => {
    const target = shopping.find((s) => s.id === id);
    if (!target) return;

    const next = !target.checked;
    setShopping((prev) => prev.map((s) => (s.id === id ? { ...s, checked: next } : s)));

    try {
      await api(`/shopping/${id}`, { method: 'PATCH', body: JSON.stringify({ checked: next }) });
    } catch (err) {
      setShopping((prev) => prev.map((s) => (s.id === id ? { ...s, checked: !next } : s)));
      setToast(err.message);
    }
  }, [shopping]);

  const removeShopping = useCallback(async (id) => {
    const snapshot = shopping;
    setShopping((prev) => prev.filter((s) => s.id !== id));

    try {
      await api(`/shopping/${id}`, { method: 'DELETE' });
    } catch (err) {
      setShopping(snapshot);
      setToast(err.message);
    }
  }, [shopping]);

  const clearCheckedShopping = useCallback(async () => {
    const snapshot = shopping;
    setShopping((prev) => prev.filter((s) => !s.checked));

    try {
      await api('/shopping/checked', { method: 'DELETE' });
    } catch (err) {
      setShopping(snapshot);
      setToast(err.message);
    }
  }, [shopping]);

  // 구매한 항목 → 냉장고.
  const moveShoppingToFridge = useCallback((items) => run(async () => {
    const result = await api('/shopping/to-fridge', { method: 'POST', body: JSON.stringify({ items }) });
    const removed = new Set(result.removed);

    setShopping((prev) => prev.filter((s) => !removed.has(s.id)));
    setIngredients((prev) => sortByExpiry([...prev, ...result.ingredients]));
    return result;
  }), []);

  const value = useMemo(() => ({
    ingredients,
    recipes,
    shopping,
    loading,
    loadError,
    reload: load,
    addIngredient,
    updateIngredient,
    removeIngredient,
    generateRecipe,
    removeRecipe,
    toggleFavorite,
    cookRecipe,
    addToShopping,
    toggleShopping,
    removeShopping,
    clearCheckedShopping,
    moveShoppingToFridge,
  }), [
    ingredients, recipes, shopping, loading, loadError, load,
    addIngredient, updateIngredient, removeIngredient, generateRecipe, removeRecipe,
    toggleFavorite, cookRecipe,
    addToShopping, toggleShopping, removeShopping, clearCheckedShopping, moveShoppingToFridge,
  ]);

  return (
    <AppStateContext.Provider value={value}>
      {children}
      <Toast message={toast} onClose={() => setToast(null)} />
    </AppStateContext.Provider>
  );
}

function useAppState() {
  return useContext(AppStateContext);
}

/** 보유 재료 이름 기준으로 레시피의 보유/부족을 계산 */
function matchRecipe(recipe, ingredients) {
  const owned = new Set(ingredients.map((it) => it.name));
  const have = recipe.ingredients.filter((ri) => owned.has(ri.name));
  const missing = recipe.ingredients.filter((ri) => !owned.has(ri.name));
  const ratio = recipe.ingredients.length === 0
    ? 0
    : Math.round((have.length / recipe.ingredients.length) * 100);

  return { have, missing, ratio, canCook: missing.length === 0 };
}

/** 기본 분류 + DB 에 실제로 있는 분류 */
function useCategories() {
  const { ingredients } = useAppState();

  return useMemo(() => {
    const fromData = ingredients.map((it) => it.category);
    return Array.from(new Set([...BASE_CATEGORIES, ...fromData]));
  }, [ingredients]);
}

function EditIngredientModal({ item, onClose, onSubmit, categories }) {
  const [form, setForm] = useState(() => ({
    name: item.name,
    qty: String(item.qty),
    unit: item.unit,
    category: item.category,
    place: item.place,
    expiry: item.expiry,
  }));
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const update = (key) => (e) => setForm((prev) => ({ ...prev, [key]: e.target.value }));

  const handleSubmit = async (e) => {
    e.preventDefault();

    if (!form.name.trim()) {
      setError('재료 이름을 입력해 주세요.');
      return;
    }
    if (!(Number(form.qty) > 0)) {
      setError('수량은 0보다 커야 합니다. 다 먹었다면 삭제해 주세요.');
      return;
    }
    if (!form.expiry) {
      setError('유통기한을 선택해 주세요.');
      return;
    }

    setSubmitting(true);

    const saved = await onSubmit(item.id, {
      name: form.name.trim(),
      qty: Number(form.qty),
      unit: form.unit.trim() || '개',
      category: form.category,
      place: form.place,
      expiry: form.expiry,
    });

    setSubmitting(false);
    if (saved) onClose();
  };

  return (
    <Modal isOpen onClose={onClose} dismissible={!submitting} title="재료 수정">
      <form onSubmit={handleSubmit} className="space-y-4">
        <Input label="재료 이름" value={form.name} onChange={update('name')} />

        <div className="grid grid-cols-2 gap-3">
          <Input label="수량" type="number" min="0" step="any" value={form.qty} onChange={update('qty')} />
          <Input label="단위" value={form.unit} onChange={update('unit')} placeholder="개 / g / 통" />
        </div>

        <div className="grid grid-cols-2 gap-3">
          <Select
            label="분류"
            value={form.category}
            onChange={update('category')}
            options={categories}
          />
          <Select
            label="보관 위치"
            value={form.place}
            onChange={update('place')}
            options={PLACES}
          />
        </div>

        <Input label="유통기한" type="date" value={form.expiry} onChange={update('expiry')} />

        {error && (
          <p className="rounded-xl bg-rose-50 px-3.5 py-2.5 text-xs font-semibold text-rose-700">{error}</p>
        )}

        <div className="flex justify-end gap-2 pt-1">
          <Button variant="secondary" onClick={onClose} disabled={submitting}>취소</Button>
          <Button type="submit" disabled={submitting}>{submitting ? '저장 중...' : '저장하기'}</Button>
        </div>
      </form>
    </Modal>
  );
}

function FridgePage() {
  const { ingredients, addIngredient, updateIngredient, removeIngredient } = useAppState();
  const categories = useCategories();

  const [query, setQuery] = useState('');
  const [category, setCategory] = useState('전체');
  const [sort, setSort] = useState('expiry');
  const [isAddOpen, setIsAddOpen] = useState(false);
  const [editing, setEditing] = useState(null);

  const stats = useMemo(() => {
    const expired = ingredients.filter((it) => daysLeft(it.expiry) < 0).length;
    const urgent = ingredients.filter((it) => {
      const d = daysLeft(it.expiry);
      return d >= 0 && d <= 2;
    }).length;

    return { total: ingredients.length, expired, urgent, fresh: ingredients.length - expired - urgent };
  }, [ingredients]);

  const visible = useMemo(() => {
    const keyword = query.trim().toLowerCase();

    const filtered = ingredients.filter((it) => {
      const matchCategory = category === '전체' || it.category === category;
      const matchQuery = !keyword || it.name.toLowerCase().includes(keyword);
      return matchCategory && matchQuery;
    });

    const sorted = sort === 'expiry' ? sortByExpiry(filtered) : [...filtered];

    if (sort === 'name') sorted.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    if (sort === 'category') sorted.sort((a, b) => a.category.localeCompare(b.category, 'ko'));

    return sorted;
  }, [ingredients, query, category, sort]);

  const soonList = useMemo(
    () => sortByExpiry(ingredients.filter((it) => daysLeft(it.expiry) <= 2)),
    [ingredients],
  );

  return (
    <PageShell
      title="내 냉장고"
      description="보관 중인 재료와 유통기한을 한눈에 확인하세요."

        <StatTile icon="🟢" label="넉넉함" value={stats.fresh} unit="개" tone="success" />
        <StatTile icon="🔔" label="임박 (2일 내)" value={stats.urgent} unit="개" tone="danger" />
        <StatTile icon="⚠️" label="기한 지남" value={stats.expired} unit="개" tone="danger" />
      </section>

      {/* 임박 재료 알림 */}
      {soonList.length > 0 && (
        <section className="mt-5 rounded-2xl border-2 border-rose-400 bg-rose-50 p-4 shadow-sm shadow-rose-100">
          <h2 className="flex items-center gap-1.5 text-sm font-extrabold text-rose-800">

          </h2>

            {soonList.map((it) => {
              const expired = daysLeft(it.expiry) < 0;

              return (
                <span

                  className={`inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-sm font-semibold ${

                  }`}

                  {expired

            className="mt-3 inline-block text-sm font-semibold text-rose-700 underline underline-offset-2 hover:text-rose-900"
          >

        </section>
      )}

        <div className="flex flex-col gap-3 sm:flex-row">

            value={query}

            aria-label="재료 검색"
          />
          <Select
            className="sm:w-44"
            value={sort}
            onChange={(e) => setSort(e.target.value)}
            aria-label="정렬 기준"
            options={[
              { value: 'expiry', label: '유통기한 임박순' },

            <button
              key={c}

              onClick={() => setCategory(c)}

              className={`shrink-0 rounded-full border px-3.5 py-1.5 text-sm font-semibold transition-colors ${
                category === c

              }`}

            action={
              ingredients.length === 0
                ? <Button onClick={() => setIsAddOpen(true)}>＋ 재료 추가</Button>
                : <Button variant="secondary" onClick={() => { setQuery(''); setCategory('전체'); }}>필터 초기화</Button>
            }
          />

          <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            {visible.map((item) => (
              <IngredientCard key={item.id} item={item} onEdit={setEditing} onDelete={removeIngredient} />
            ))}
          </div>
        )}
      </section>

      <AddIngredientModal
        isOpen={isAddOpen}
        onClose={() => setIsAddOpen(false)}
        onSubmit={addIngredient}
        categories={categories}
      />

      {editing && (
        <EditIngredientModal
          key={editing.id}
          item={editing}
          onClose={() => setEditing(null)}
          onSubmit={updateIngredient}
          categories={categories}
        />
      )}
    </PageShell>
  );
}

function GenerateRecipeModal({ isOpen, onClose }) {
  const { generateRecipe, ingredients } = useAppState();
  const { navigate } = useRouter();

  const [request, setRequest] = useState('');
  const [useFridge, setUseFridge] = useState(true);
  const [generating, setGenerating] = useState(false);
  const [error, setError] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setGenerating(true);
    setError('');

    try {
      const created = await generateRecipe({ useFridge, request: request.trim() });
      setRequest('');
      onClose();
      navigate(`/recipes/${created.id}`);
    } catch (err) {
      setError(err.message);
    } finally {
      setGenerating(false);
    }
  };

  const handleClose = () => {
    if (generating) return;   // 생성 중에는 닫지 않는다
    setError('');
    onClose();
  };

  return (
    <Modal isOpen={isOpen} onClose={handleClose} title="✨ AI로 레시피 만들기">
      {generating ? (
        <div className="py-6">
          <Spinner label="AI가 레시피를 만들고 있어요..." />
          <p className="text-center text-xs text-slate-400">보통 10초 안팎 걸립니다</p>
        </div>
      ) : (
        <form onSubmit={handleSubmit} className="space-y-4">
          <label className="flex cursor-pointer items-start gap-3 rounded-xl border border-slate-200 bg-slate-50 p-3.5">
            <input
              type="checkbox"
              checked={useFridge}
              onChange={(e) => setUseFridge(e.target.checked)}
              className="mt-0.5 h-5 w-5 shrink-0 cursor-pointer rounded border-slate-300 text-emerald-600 focus:ring-emerald-500"
            />
            <span className="text-sm">
              <span className="font-semibold text-slate-800">냉장고 재료 활용하기</span>
              <span className="mt-0.5 block text-xs text-slate-500">
                보관 중인 재료 {ingredients.length}개를 AI에게 알려줍니다.
              </span>
            </span>
          </label>

          <Textarea
            label="원하는 요리 (선택)"
            value={request}
            onChange={(e) => setRequest(e.target.value)}
            placeholder="예) 자취생도 만들 수 있는 매콤한 국물 요리"
            maxLength={300}
            rows={3}
          />

          {error && (
            <p className="rounded-xl bg-rose-50 px-3.5 py-2.5 text-xs font-semibold text-rose-700">{error}</p>
          )}

          <div className="flex justify-end gap-2 pt-1">
            <Button variant="secondary" onClick={handleClose}>취소</Button>
            <Button type="submit">✨ 레시피 생성</Button>
          </div>
        </form>
      )}
    </Modal>
  );
}

function RecipesPage() {
  const { ingredients, recipes, toggleFavorite } = useAppState();
  const [query, setQuery] = useState('');
  const [onlyCookable, setOnlyCookable] = useState(false);
  const [onlyFavorites, setOnlyFavorites] = useState(false);
  const [isGenerateOpen, setIsGenerateOpen] = useState(false);

  const matched = useMemo(
    () => recipes
      .map((recipe) => ({ recipe, match: matchRecipe(recipe, ingredients) }))
      .sort((a, b) => b.match.ratio - a.match.ratio),
    [recipes, ingredients],
  );

  const visible = useMemo(() => {
    const keyword = query.trim().toLowerCase();

    return matched.filter(({ recipe, match }) => {
      const matchQuery = !keyword
        || recipe.name.toLowerCase().includes(keyword)
        || recipe.tags.some((t) => t.toLowerCase().includes(keyword))
        || recipe.ingredients.some((ri) => ri.name.toLowerCase().includes(keyword));

      return matchQuery
        && (!onlyCookable || match.canCook)
        && (!onlyFavorites || recipe.is_favorite);
    });
  }, [matched, query, onlyCookable, onlyFavorites]);

  const cookableCount = matched.filter(({ match }) => match.canCook).length;

  return (
    <PageShell
      title="레시피"
      description={`냉장고 재료로 지금 바로 만들 수 있는 요리가 ${cookableCount}개 있어요.`}
      action={<Button onClick={() => setIsGenerateOpen(true)}>✨ AI로 레시피 만들기</Button>}
    >
      <section className="flex flex-col gap-3 sm:flex-row sm:items-center" aria-label="레시피 검색">
        <Input
          className="flex-1"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder="🔍 요리 이름, 재료, 태그로 검색"
          aria-label="레시피 검색"
        />
        <Button
          variant={onlyCookable ? 'primary' : 'secondary'}
          onClick={() => setOnlyCookable((v) => !v)}
          aria-pressed={onlyCookable}
          className="shrink-0"
        >
          ✅ 지금 만들 수 있는 것만
        </Button>
        <Button
          variant={onlyFavorites ? 'primary' : 'secondary'}
          onClick={() => setOnlyFavorites((v) => !v)}
          aria-pressed={onlyFavorites}
          className="shrink-0"
        >
          ★ 즐겨찾기
        </Button>
      </section>

      <section className="mt-5" aria-label="레시피 목록">
        {visible.length === 0 ? (
          <EmptyState
            icon="🍽️"
            title="조건에 맞는 레시피가 없어요"
            description="검색어를 바꾸거나 필터를 해제해 보세요."
            action={<Button variant="secondary" onClick={() => { setQuery(''); setOnlyCookable(false); setOnlyFavorites(false); }}>필터 초기화</Button>}
          />
        ) : (
          <div className="grid gap-4 sm:grid-cols-2">
            {visible.map(({ recipe, match }) => (
              <RecipeCard key={recipe.id} recipe={recipe} match={match} onToggleFavorite={toggleFavorite} />
            ))}
          </div>
        )}
      </section>

      <GenerateRecipeModal isOpen={isGenerateOpen} onClose={() => setIsGenerateOpen(false)} />
    </PageShell>
  );
}

/**
 * 요리 완료 모달 — 레시피 재료마다 냉장고에서 뺄 양을 정한다.
 * 같은 이름의 재료가 여러 개면 유통기한이 가장 빠른 것부터 쓴다.
 * 레시피 단위와 냉장고 단위가 같을 때만('3개' ↔ '개') 차감량을 미리 채워 준다.
 */
function CookModal({ onClose, recipe, onCooked }) {
  const { ingredients, cookRecipe } = useAppState();
  // 모달이 열리는(마운트되는) 순간의 냉장고 기준으로 한 번만 채운다.
  const [rows, setRows] = useState(() => recipe.ingredients.map((ri) => {
    const stock = sortByExpiry(ingredients.filter((it) => it.name === ri.name))[0];
    const parsed = parseAmount(ri.amount);
    const sameUnit = stock && parsed && parsed.unit === stock.unit;

    return {
      name: ri.name,
      recipeAmount: ri.amount,
      stock,
      use: sameUnit ? String(Math.min(parsed.value, stock.qty)) : '',
    };
  }));
  const [submitting, setSubmitting] = useState(false);

  const setUse = (idx, value) => setRows((prev) => prev.map((r, i) => (i === idx ? { ...r, use: value } : r)));

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSubmitting(true);

    const uses = rows
      .filter((r) => r.stock && Number(r.use) > 0)
      .map((r) => ({ ingredientId: r.stock.id, amount: Number(r.use) }));

    const result = await cookRecipe(recipe.id, uses);
    setSubmitting(false);

    if (result) {
      onCooked({ used: uses.length, emptied: result.deleted.length });
      onClose();
    }
  };

  return (
    <Modal isOpen onClose={onClose} dismissible={!submitting} title="🍳 요리 완료" size="lg">
      <form onSubmit={handleSubmit} className="space-y-4">
        <p className="text-sm text-slate-500">
          사용한 만큼 냉장고에서 빼 드릴게요. 빼지 않을 재료는 비워 두세요.
          남은 양이 0이 되면 냉장고에서 삭제됩니다.
        </p>

        <ul className="divide-y divide-slate-100 rounded-2xl border border-slate-200">
          {rows.map((r, idx) => (
            <li key={r.name} className="flex flex-wrap items-center gap-3 px-4 py-3">
              <div className="min-w-0 flex-1">
                <p className="text-sm font-semibold text-slate-800">
                  {r.stock?.emoji} {r.name}
                  <span className="ml-1.5 text-xs font-normal text-slate-400">레시피 {r.recipeAmount}</span>
                </p>
                <p className="mt-0.5 text-xs text-slate-500">
                  {r.stock ? `냉장고에 ${r.stock.qty}${r.stock.unit} 있음` : '냉장고에 없음'}
                </p>
              </div>

              {r.stock && (
                <div className="flex items-center gap-1.5">
                  <input
                    type="number"
                    min="0"
                    step="any"
                    value={r.use}
                    onChange={(e) => setUse(idx, e.target.value)}
                    aria-label={`${r.name} 사용량`}
                    placeholder="0"
                    className="w-20 rounded-lg border border-slate-300 px-2.5 py-1.5 text-right text-sm tabular-nums focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"
                  />
                  <span className="w-6 text-sm text-slate-500">{r.stock.unit}</span>
                  <Button variant="ghost" size="sm" onClick={() => setUse(idx, String(r.stock.qty))}>전부</Button>
                </div>
              )}
            </li>
          ))}
        </ul>

        <div className="flex justify-end gap-2 pt-1">
          <Button variant="secondary" onClick={onClose} disabled={submitting}>취소</Button>
          <Button type="submit" disabled={submitting}>{submitting ? '기록 중...' : '차감하고 기록하기'}</Button>
        </div>
      </form>
    </Modal>
  );
}

    return (

          title="존재하지 않는 레시피입니다"

      description={recipe.summary}

              ? <Badge tone="success">✅ 지금 만들 수 있어요</Badge>
              : <Badge tone="warning">🛒 {match.missing.length}가지 부족</Badge>}
            {recipe.tags.map((tag) => <Badge key={tag}>#{tag}</Badge>)}

          <div className="mt-3 flex flex-wrap gap-x-5 gap-y-1 text-sm text-slate-600">

/** 구매한 항목을 냉장고 재료로 입고하는 모달. 항목마다 수량·분류·보관·유통기한을 정한다. */
function MoveToFridgeModal({ onClose, items, onMoved }) {
  const { moveShoppingToFridge } = useAppState();
  const categories = useCategories();
  const [rows, setRows] = useState(
    () => items.map((s) => ({ id: s.id, name: s.name, qty: '1', unit: '개', category: '기타', place: '냉장', days: '7' })),
  );
  const [submitting, setSubmitting] = useState(false);

  const update = (idx, key) => (e) => {
    const { value } = e.target;
    setRows((prev) => prev.map((r, i) => (i === idx ? { ...r, [key]: value } : r)));
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSubmitting(true);

    const result = await moveShoppingToFridge(rows.map((r) => ({
      id: r.id,
      qty: Number(r.qty) > 0 ? Number(r.qty) : 1,
      unit: r.unit.trim() || '개',
      category: r.category,
      place: r.place,
      expiry: dateFromToday(Number(r.days) || 0),
    })));

    setSubmitting(false);

    if (result) {
      onMoved(result.ingredients.length);
      onClose();
    }
  };

  return (
    <Modal isOpen onClose={onClose} dismissible={!submitting} title="🧊 냉장고에 넣기" size="lg">
      <form onSubmit={handleSubmit} className="space-y-4">
        <p className="text-sm text-slate-500">구매한 {rows.length}개 항목을 냉장고 재료로 옮깁니다. 장보기 목록에서는 빠져요.</p>

        <ul className="space-y-3">
          {rows.map((r, idx) => (
            <li key={r.id} className="rounded-2xl border border-slate-200 p-3.5">
              <p className="mb-2.5 text-sm font-bold text-slate-800">{r.name}</p>
              <div className="grid grid-cols-2 gap-2.5 sm:grid-cols-5">
                <Input label="수량" type="number" min="0" step="any" value={r.qty} onChange={update(idx, 'qty')} />
                <Input label="단위" value={r.unit} onChange={update(idx, 'unit')} />
                <Select label="분류" value={r.category} onChange={update(idx, 'category')} options={categories} />
                <Select label="보관" value={r.place} onChange={update(idx, 'place')} options={PLACES} />
                <Input label="유통기한(일)" type="number" min="0" value={r.days} onChange={update(idx, 'days')} />
              </div>
            </li>
          ))}
        </ul>

        <div className="flex justify-end gap-2 pt-1">
          <Button variant="secondary" onClick={onClose} disabled={submitting}>취소</Button>
          <Button type="submit" disabled={submitting}>{submitting ? '넣는 중...' : `${rows.length}개 넣기`}</Button>
        </div>
      </form>
    </Modal>
  );
}

function ShoppingPage() {

  const [draft, setDraft] = useState('');
  const [isMoveOpen, setIsMoveOpen] = useState(false);
  const [movedCount, setMovedCount] = useState(0);

  const checkedItems = shopping.filter((s) => s.checked);
  const checkedCount = checkedItems.length;

  const handleAdd = async (e) => {
    e.preventDefault();
    const name = draft.trim();
    if (!name) return;

    setDraft('');
    await addToShopping([name]);
  };

  return (
    <PageShell
      title="장보기 목록"
      description={shopping.length > 0 ? `${shopping.length}개 중 ${checkedCount}개를 담았어요.` : '레시피에서 부족한 재료를 담아보세요.'}
      action={checkedCount > 0 ? (
        <div className="flex flex-wrap gap-2">
          <Button variant="secondary" onClick={clearCheckedShopping}>구매한 항목 비우기</Button>
          <Button onClick={() => setIsMoveOpen(true)}>🧊 냉장고에 넣기</Button>
        </div>
      ) : null}
    >
      {movedCount > 0 && (
        <SuccessBanner onClose={() => setMovedCount(0)}>
          🧊 {movedCount}개를 냉장고에 넣었어요.{' '}
          <Link to="/" className="font-semibold underline underline-offset-2">냉장고 보기 →</Link>
        </SuccessBanner>
      )}

      <form onSubmit={handleAdd} className="flex gap-2">
        <Input
          className="flex-1"
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          placeholder="직접 추가할 품목 입력"
          aria-label="장보기 품목 추가"
        />
        <Button type="submit" className="shrink-0">추가</Button>
      </form>

      <section className="mt-5" aria-label="장보기 항목">
        {shopping.length === 0 ? (
          <EmptyState
            icon="🛒"
            title="장보기 목록이 비어 있어요"
            description="레시피 상세에서 부족한 재료를 한 번에 담을 수 있어요."
            action={<Link to="/recipes"><Button>레시피 보러 가기</Button></Link>}
          />
        ) : (
          <ul className="overflow-hidden rounded-2xl border border-slate-200 bg-white">
            {shopping.map((s) => (
              <li key={s.id} className="flex items-center gap-3 border-b border-slate-100 px-4 py-3 last:border-b-0">
                <input
                  id={`shop-${s.id}`}
                  type="checkbox"
                  checked={s.checked}
                  onChange={() => toggleShopping(s.id)}
                  className="h-5 w-5 shrink-0 cursor-pointer rounded border-slate-300 text-emerald-600 focus:ring-emerald-500"
                />
                <label
                  htmlFor={`shop-${s.id}`}
                  className={`flex-1 cursor-pointer text-sm ${s.checked ? 'text-slate-400 line-through' : 'font-medium text-slate-800'}`}
                >
                  {s.name}
                </label>
                <button
                  type="button"
                  onClick={() => removeShopping(s.id)}
                  aria-label={`${s.name} 삭제`}
                  className="rounded-lg p-1.5 text-slate-300 transition-colors hover:bg-rose-50 hover:text-rose-500"
                >
                  ✕
                </button>
              </li>
            ))}
          </ul>
        )}
      </section>

      {isMoveOpen && (
        <MoveToFridgeModal
          onClose={() => setIsMoveOpen(false)}
          items={checkedItems}
          onMoved={setMovedCount}
        />
      )}
    </PageShell>
  );
}

// ---------- 404 ----------
function NotFoundPage() {
  return (
    <PageShell title="페이지를 찾을 수 없어요">
      <EmptyState
        icon="🧭"
        title="주소가 올바르지 않습니다"
        description="아래 버튼으로 냉장고 화면으로 돌아가세요."
        action={<Link to="/"><Button>냉장고로 가기</Button></Link>}
      />
    </PageShell>
  );
}


// ========================================
// 🚀 App
// ========================================
function AppRoutes() {
  const { loading, loadError, reload } = useAppState();

  if (loading) {
    return <Spinner label="냉장고를 여는 중..." />;
  }

  if (loadError) {
    return (
      <main className="mx-auto max-w-5xl px-4 py-10">
        <EmptyState
          icon="🔌"
          title="서버에 연결하지 못했어요"
          description={loadError}
          action={<Button onClick={reload}>다시 시도</Button>}
        />
      </main>
    );
  }

  return (
    <Routes fallback={<NotFoundPage />}>
      <Route path="/" element={<FridgePage />} />
      <Route path="/recipes" element={<RecipesPage />} />
      <Route path="/recipes/:id" element={<RecipeDetailPage />} />
      <Route path="/shopping" element={<ShoppingPage />} />
    </Routes>
  );
}

function App() {
  return (
    <Router>
      <AppStateProvider>
        <div className="flex min-h-screen flex-col">
          <Header />
          <div className="flex-1"><AppRoutes /></div>
          <Footer />
        </div>
      </AppStateProvider>
    </Router>
  );
}


// ========================================
// Rendering
// ========================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

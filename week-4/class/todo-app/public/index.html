<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투두 앱</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M9 16.5l5 5 9-11' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- CDN 은 모두 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    /* 새 항목이 추가될 때의 등장 효과 (Tailwind 유틸리티로 불가) */
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-in { animation: slide-in 0.18s ease-out; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // 상대 경로 — 포트가 바뀌어도 그대로 동작한다.
    const API_BASE_URL = '/api';

    // 서버 응답은 항상 { success, data?, message? } 구조.
    async function api(endpoint, options = {}) {
      const res = await fetch(`${API_BASE_URL}${endpoint}`, {
        headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
        ...options,
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.success) {
        throw new Error(json.message || '요청을 처리하지 못했습니다.');
      }
      return json.data;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', type = 'button', disabled = false, onClick, className = '', children, ...rest }) {
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 focus-visible:outline-indigo-600',
        secondary: 'bg-white text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50 focus-visible:outline-slate-400',
        danger: 'bg-white text-rose-600 ring-1 ring-rose-200 hover:bg-rose-50 focus-visible:outline-rose-500',
        ghost: 'bg-transparent text-slate-500 hover:bg-slate-100 focus-visible:outline-slate-400',
      };
      const sizes = { sm: 'px-2.5 py-1.5 text-xs', md: 'px-4 py-2 text-sm', lg: 'px-5 py-2.5 text-base' };

      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-1.5 rounded-lg font-semibold transition
            focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2
            disabled:cursor-not-allowed disabled:opacity-50 ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({ value, onChange, placeholder, disabled, className = '', inputRef, ...rest }) {
      return (
        <input
          ref={inputRef}
          type="text"
          value={value}
          onChange={onChange}
          placeholder={placeholder}
          disabled={disabled}
          className={`w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm outline-none transition
            placeholder:text-slate-400 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100
            disabled:bg-slate-100 ${className}`}
          {...rest}
        />
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`rounded-2xl bg-white shadow-sm ring-1 ring-slate-200/70 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children }) {
      return (
        <span className="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-semibold text-slate-600">
          {children}
        </span>
      );
    }

    function Spinner({ className = 'h-4 w-4' }) {
      return (
        <svg className={`animate-spin ${className}`} viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" className="opacity-25" />
          <path d="M4 12a8 8 0 0 1 8-8" stroke="currentColor" strokeWidth="4" strokeLinecap="round" />
        </svg>
      );
    }

    // ========================================
    // 🧩 Todo Components
    // ========================================

    const FILTERS = [
      { key: 'all', label: '전체' },
      { key: 'active', label: '진행 중' },
      { key: 'done', label: '완료' },
    ];

    function FilterTabs({ value, counts, onChange }) {
      return (
        <div className="flex gap-1 rounded-xl bg-slate-100 p-1" role="tablist" aria-label="할 일 필터">
          {FILTERS.map((f) => (
            <button
              key={f.key}
              type="button"
              role="tab"
              aria-selected={value === f.key}
              onClick={() => onChange(f.key)}
              className={`flex-1 rounded-lg px-3 py-1.5 text-sm font-semibold transition
                ${value === f.key ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
            >
              {f.label}
              <span className="ml-1.5 text-xs font-medium text-slate-400">{counts[f.key]}</span>
            </button>
          ))}
        </div>
      );
    }

    function TodoItem({ todo, busy, onToggle, onEdit, onDelete }) {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(todo.title);
      const inputRef = useRef(null);

      useEffect(() => {
        if (editing && inputRef.current) inputRef.current.select();
      }, [editing]);

      function startEdit() {
        setDraft(todo.title);
        setEditing(true);
      }

      async function commit() {
        const title = draft.trim();
        if (!title || title === todo.title) {
          setEditing(false);
          return;
        }
        const ok = await onEdit(todo.id, title);
        if (ok) setEditing(false);
      }

      function handleKeyDown(e) {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape') setEditing(false);
      }

      return (
        <li className="animate-slide-in flex items-center gap-3 px-4 py-3 sm:px-5">
          <input
            type="checkbox"
            checked={todo.done}
            disabled={busy}
            onChange={() => onToggle(todo)}
            aria-label={`${todo.title} 완료 표시`}
            className="h-5 w-5 shrink-0 cursor-pointer rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
          />

          {editing ? (
            <Input
              inputRef={inputRef}
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              onKeyDown={handleKeyDown}
              onBlur={commit}
              disabled={busy}
              maxLength={200}
              className="py-1.5"
            />
          ) : (
            <button
              type="button"
              onDoubleClick={startEdit}
              onClick={startEdit}
              title="클릭해서 수정"
              className={`flex-1 truncate text-left text-sm transition
                ${todo.done ? 'text-slate-400 line-through' : 'text-slate-800 hover:text-indigo-600'}`}
            >
              {todo.title}
            </button>
          )}

          {!editing && (
            <Button
              variant="ghost"
              size="sm"
              disabled={busy}
              onClick={() => onDelete(todo.id)}
              aria-label={`${todo.title} 삭제`}
              className="shrink-0 text-slate-400 hover:text-rose-600"
            >
              {busy ? <Spinner className="h-3.5 w-3.5" /> : '삭제'}
            </Button>
          )}
        </li>
      );
    }

    function EmptyState({ filter }) {
      const message = {
        all: '아직 등록된 할 일이 없습니다. 위에 첫 할 일을 적어 보세요.',
        active: '진행 중인 할 일이 없습니다. 전부 끝내셨네요! 🎉',
        done: '완료한 할 일이 아직 없습니다.',
      }[filter];

      return (
        <div className="px-5 py-14 text-center">
          <div className="text-4xl" aria-hidden="true">📝</div>
          <p className="mt-3 text-sm text-slate-500">{message}</p>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      const [todos, setTodos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [title, setTitle] = useState('');
      const [adding, setAdding] = useState(false);
      const [busyId, setBusyId] = useState(null);
      const [filter, setFilter] = useState('all');

      const load = useCallback(async () => {
        setLoading(true);
        try {
          setTodos(await api('/todos'));
          setError('');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { load(); }, [load]);

      const counts = useMemo(() => {
        const done = todos.filter((t) => t.done).length;
        return { all: todos.length, done, active: todos.length - done };
      }, [todos]);

      const visible = useMemo(() => {
        if (filter === 'active') return todos.filter((t) => !t.done);
        if (filter === 'done') return todos.filter((t) => t.done);
        return todos;
      }, [todos, filter]);

      async function handleAdd(e) {
        e.preventDefault();
        const value = title.trim();
        if (!value || adding) return;

        setAdding(true);
        try {
          const created = await api('/todos', { method: 'POST', body: JSON.stringify({ title: value }) });
          setTodos((prev) => [created, ...prev]);
          setTitle('');
          setError('');
        } catch (err) {
          setError(err.message);
        } finally {
          setAdding(false);
        }
      }

      async function handleToggle(todo) {
        setBusyId(todo.id);
        try {
          const updated = await api(`/todos/${todo.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ done: !todo.done }),
          });
          setTodos((prev) => prev.map((t) => (t.id === updated.id ? updated : t)));
          setError('');
        } catch (err) {
          setError(err.message);
        } finally {
          setBusyId(null);
        }
      }

      async function handleEdit(id, newTitle) {
        setBusyId(id);
        try {
          const updated = await api(`/todos/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ title: newTitle }),
          });
          setTodos((prev) => prev.map((t) => (t.id === updated.id ? updated : t)));
          setError('');
          return true;
        } catch (err) {
          setError(err.message);
          return false;
        } finally {
          setBusyId(null);
        }
      }

      async function handleDelete(id) {
        setBusyId(id);
        try {
          await api(`/todos/${id}`, { method: 'DELETE' });
          setTodos((prev) => prev.filter((t) => t.id !== id));
          setError('');
        } catch (err) {
          setError(err.message);
        } finally {
          setBusyId(null);
        }
      }

      async function handleClearCompleted() {
        try {
          await api('/todos?done=true', { method: 'DELETE' });
          setTodos((prev) => prev.filter((t) => !t.done));
          setError('');
        } catch (err) {
          setError(err.message);
        }
      }

      return (
        <div className="mx-auto flex min-h-screen max-w-2xl flex-col px-4 py-10 sm:py-16">
          <header className="mb-6">
            <h1 className="text-3xl font-extrabold tracking-tight text-slate-900">투두 앱</h1>
            <p className="mt-1.5 text-sm text-slate-500">
              할 일은 Supabase 데이터베이스에 저장되어 새로고침해도 남아 있습니다.
            </p>
          </header>

          <Card className="overflow-hidden">
            {/* 입력 */}
            <form onSubmit={handleAdd} className="flex gap-2 border-b border-slate-200 p-4 sm:p-5">
              <Input
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                placeholder="무엇을 해야 하나요?"
                disabled={adding}
                maxLength={200}
                aria-label="할 일 입력"
              />
              <Button type="submit" disabled={adding || !title.trim()} className="shrink-0">
                {adding ? <Spinner /> : '추가'}
              </Button>
            </form>

            {/* 필터 */}
            <div className="border-b border-slate-200 p-4 sm:p-5">
              <FilterTabs value={filter} counts={counts} onChange={setFilter} />
            </div>

            {/* 목록 */}
            {error && (
              <p role="alert" className="border-b border-rose-100 bg-rose-50 px-5 py-3 text-sm text-rose-700">
                {error}
              </p>
            )}

            {loading ? (
              <div className="flex items-center justify-center gap-2 px-5 py-14 text-sm text-slate-400">
                <Spinner /> 불러오는 중…
              </div>
            ) : visible.length === 0 ? (
              <EmptyState filter={filter} />
            ) : (
              <ul className="divide-y divide-slate-100">
                {visible.map((todo) => (
                  <TodoItem
                    key={todo.id}
                    todo={todo}
                    busy={busyId === todo.id}
                    onToggle={handleToggle}
                    onEdit={handleEdit}
                    onDelete={handleDelete}
                  />
                ))}
              </ul>
            )}

            {/* 요약 */}
            <div className="flex items-center justify-between gap-3 border-t border-slate-200 px-4 py-3 sm:px-5">
              <Badge>남은 할 일 {counts.active}개</Badge>
              {counts.done > 0 && (
                <Button variant="danger" size="sm" onClick={handleClearCompleted}>
                  완료한 {counts.done}개 지우기
                </Button>
              )}
            </div>
          </Card>

          <p className="mt-4 text-center text-xs text-slate-400">
            항목을 클릭하면 수정할 수 있습니다 · Enter 저장 · Esc 취소
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

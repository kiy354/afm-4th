<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 컴퍼니 · 회사 소개</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='21' fill='%23fff' stroke='%230f172a' stroke-width='3'/%3E%3Cpath d='M3 24a21 21 0 0 1 42 0Z' fill='%23f43f5e' stroke='%230f172a' stroke-width='3'/%3E%3Cline x1='3' y1='24' x2='45' y2='24' stroke='%230f172a' stroke-width='3'/%3E%3Ccircle cx='24' cy='24' r='6.5' fill='%23fff' stroke='%230f172a' stroke-width='3'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- CDN 은 모두 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    /* 히어로 배경의 은은한 상하 부유 애니메이션 (Tailwind 유틸리티로 불가) */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    .animate-float { animation: float 5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // 상대 경로 — 로컬/배포 환경 모두 동일하게 동작한다.
    const API_BASE_URL = '/api';

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, type = 'button', onClick, className = '', children }) {
      const variants = {
        primary: 'bg-rose-500 text-white hover:bg-rose-600 focus-visible:outline-rose-500',
        secondary: 'bg-white text-slate-800 ring-1 ring-slate-300 hover:bg-slate-100 focus-visible:outline-slate-400',
        ghost: 'bg-transparent text-slate-600 hover:bg-slate-100 focus-visible:outline-slate-400',
      };
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-5 py-2.5 text-sm', lg: 'px-7 py-3.5 text-base' };

      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-2 rounded-full font-semibold transition
            focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2
            disabled:cursor-not-allowed disabled:opacity-50 ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Field({ id, label, error, required = false, children }) {
      return (
        <div>
          <label htmlFor={id} className="mb-1.5 block text-sm font-semibold text-slate-700">
            {label}
            {required && <span className="ml-1 text-rose-500" aria-hidden="true">*</span>}
          </label>
          {children}
          {error && <p id={`${id}-error`} role="alert" className="mt-1.5 text-sm text-rose-600">{error}</p>}
        </div>
      );
    }

    function Input({ id, label, type = 'text', value, onChange, placeholder, error, required, disabled }) {
      return (
        <Field id={id} label={label} error={error} required={required}>
          <input
            id={id}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={Boolean(error)}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full rounded-xl border bg-white px-4 py-2.5 text-sm outline-none transition
              placeholder:text-slate-400 focus:ring-2 disabled:bg-slate-100
              ${error ? 'border-rose-400 focus:ring-rose-200' : 'border-slate-300 focus:border-rose-400 focus:ring-rose-100'}`}
          />
        </Field>
      );
    }

    function Select({ id, label, value, onChange, options, error, required, disabled }) {
      return (
        <Field id={id} label={label} error={error} required={required}>
          <select
            id={id}
            value={value}
            onChange={onChange}
            disabled={disabled}
            aria-invalid={Boolean(error)}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full rounded-xl border bg-white px-4 py-2.5 text-sm outline-none transition
              focus:ring-2 disabled:bg-slate-100
              ${error ? 'border-rose-400 focus:ring-rose-200' : 'border-slate-300 focus:border-rose-400 focus:ring-rose-100'}`}
          >
            <option value="">선택해 주세요</option>
            {options.map((opt) => <option key={opt} value={opt}>{opt}</option>)}
          </select>
        </Field>
      );
    }

    function Textarea({ id, label, value, onChange, placeholder, error, required, disabled, rows = 6, maxLength }) {
      return (
        <Field id={id} label={label} error={error} required={required}>
          <textarea
            id={id}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            rows={rows}
            maxLength={maxLength}
            aria-invalid={Boolean(error)}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full resize-y rounded-xl border bg-white px-4 py-2.5 text-sm outline-none transition
              placeholder:text-slate-400 focus:ring-2 disabled:bg-slate-100
              ${error ? 'border-rose-400 focus:ring-rose-200' : 'border-slate-300 focus:border-rose-400 focus:ring-rose-100'}`}
          />
          {maxLength && (
            <p className="mt-1 text-right text-xs text-slate-400">{value.length} / {maxLength}</p>
          )}
        </Field>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200/70 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ tone = 'rose', children }) {
      const tones = {
        rose: 'bg-rose-50 text-rose-600 ring-rose-200',
        slate: 'bg-slate-100 text-slate-600 ring-slate-200',
      };
      return (
        <span className={`inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold ring-1 ${tones[tone]}`}>
          {children}
        </span>
      );
    }

    function SectionHeading({ eyebrow, title, description, align = 'center' }) {
      const alignment = align === 'center' ? 'text-center items-center' : 'text-left items-start';
      return (
        <div className={`mx-auto mb-12 flex max-w-2xl flex-col ${alignment}`}>
          <Badge>{eyebrow}</Badge>
          <h2 className="mt-4 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">{title}</h2>
          {description && <p className="mt-4 text-base leading-relaxed text-slate-600">{description}</p>}
        </div>
      );
    }

    // ========================================
    // 🧩 Common / Layout Components
    // ========================================

    const NAV_ITEMS = [
      { href: '#about', label: '회사 소개' },
      { href: '#business', label: '사업 영역' },
      { href: '#partners', label: '파트너 포켓몬' },
      { href: '#history', label: '연혁' },
      { href: '#contact', label: '문의하기' },
    ];

    function PokeballIcon({ className = 'h-7 w-7' }) {
      return (
        <svg viewBox="0 0 48 48" className={className} aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="#fff" stroke="#0f172a" strokeWidth="3" />
          <path d="M3 24a21 21 0 0 1 42 0Z" fill="#f43f5e" stroke="#0f172a" strokeWidth="3" />
          <line x1="3" y1="24" x2="45" y2="24" stroke="#0f172a" strokeWidth="3" />
          <circle cx="24" cy="24" r="6.5" fill="#fff" stroke="#0f172a" strokeWidth="3" />
        </svg>
      );
    }

    function Header() {
      const [open, setOpen] = useState(false);

      return (
        <header className="sticky top-0 z-30 border-b border-slate-200 bg-white/85 backdrop-blur">
          <div className="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6">
            <a href="#top" className="flex items-center gap-2 font-extrabold tracking-tight text-slate-900">
              <PokeballIcon />
              <span>포켓몬 컴퍼니</span>
            </a>

            <nav className="hidden items-center gap-1 md:flex" aria-label="주요 메뉴">
              {NAV_ITEMS.map((item) => (
                <a
                  key={item.href}
                  href={item.href}
                  className="rounded-full px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
                >
                  {item.label}
                </a>
              ))}
            </nav>

            <button
              type="button"
              onClick={() => setOpen((v) => !v)}
              aria-expanded={open}
              aria-label="메뉴 열기"
              className="rounded-lg p-2 text-slate-600 hover:bg-slate-100 md:hidden"
            >
              <svg viewBox="0 0 24 24" className="h-6 w-6" fill="none" stroke="currentColor" strokeWidth="2">
                {open
                  ? <path d="M6 6l12 12M18 6L6 18" strokeLinecap="round" />
                  : <path d="M4 7h16M4 12h16M4 17h16" strokeLinecap="round" />}
              </svg>
            </button>
          </div>

          {open && (
            <nav className="border-t border-slate-200 bg-white px-4 py-2 md:hidden" aria-label="모바일 메뉴">
              {NAV_ITEMS.map((item) => (
                <a
                  key={item.href}
                  href={item.href}
                  onClick={() => setOpen(false)}
                  className="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
                >
                  {item.label}
                </a>
              ))}
            </nav>
          )}
        </header>
      );
    }

    function Footer({ inquiryCount }) {
      return (
        <footer className="border-t border-slate-800 bg-slate-900 text-slate-300">
          <div className="mx-auto grid max-w-6xl gap-8 px-4 py-12 sm:px-6 md:grid-cols-3">
            <div>
              <div className="flex items-center gap-2 font-extrabold text-white">
                <PokeballIcon className="h-6 w-6" />
                포켓몬 컴퍼니
              </div>
              <p className="mt-3 text-sm leading-relaxed text-slate-400">
                포켓몬과 사람이 함께 살아가는 세상을 만듭니다.
              </p>
            </div>
            <div>
              <h3 className="text-sm font-semibold text-white">바로가기</h3>
              <ul className="mt-3 space-y-2 text-sm">
                {NAV_ITEMS.map((item) => (
                  <li key={item.href}>
                    <a href={item.href} className="text-slate-400 transition hover:text-white">{item.label}</a>
                  </li>
                ))}
              </ul>
            </div>
            <div>
              <h3 className="text-sm font-semibold text-white">고객 지원</h3>
              <ul className="mt-3 space-y-2 text-sm text-slate-400">
                <li>서울특별시 관동구 마사라로 1</li>
                <li>평일 10:00 – 18:00 (점심 12:00 – 13:00)</li>
                <li>support@pokemon-company.example</li>
                {inquiryCount !== null && (
                  <li className="pt-1 text-xs text-slate-500">누적 접수 문의 {inquiryCount}건</li>
                )}
              </ul>
            </div>
          </div>
          <div className="border-t border-slate-800 px-4 py-5 text-center text-xs text-slate-500">
            학습용 실습 프로젝트입니다. 등장하는 회사 정보·연혁·수치는 모두 가상의 내용입니다.
          </div>
        </footer>
      );
    }

    // ========================================
    // 📄 Section Components
    // ========================================

    function Hero() {
      return (
        <section id="top" className="relative overflow-hidden bg-gradient-to-br from-rose-500 via-rose-400 to-amber-300">
          <div className="absolute -right-16 -top-16 h-64 w-64 rounded-full bg-white/20 blur-2xl" aria-hidden="true" />
          <div className="absolute -bottom-24 -left-10 h-72 w-72 rounded-full bg-white/10 blur-2xl" aria-hidden="true" />

          <div className="relative mx-auto grid max-w-6xl items-center gap-10 px-4 py-20 sm:px-6 md:grid-cols-2 md:py-28">
            <div className="text-white">
              <Badge tone="slate">Since 1998 · 도쿄 · 서울</Badge>
              <h1 className="mt-5 text-4xl font-extrabold leading-tight tracking-tight sm:text-5xl">
                포켓몬과 사람이<br />함께 살아가는 세상
              </h1>
              <p className="mt-5 max-w-lg text-base leading-relaxed text-rose-50">
                포켓몬 컴퍼니는 게임, 애니메이션, 카드 게임, 라이선싱까지
                포켓몬 IP의 모든 순간을 설계하고 운영합니다.
              </p>
              <div className="mt-8 flex flex-wrap gap-3">
                <Button size="lg" variant="secondary" onClick={() => { window.location.hash = '#contact'; }}>
                  문의하기
                </Button>
                <Button size="lg" variant="ghost" className="text-white hover:bg-white/15" onClick={() => { window.location.hash = '#business'; }}>
                  사업 영역 보기 →
                </Button>
              </div>
            </div>

            <div className="flex justify-center">
              <img
                src="/sprites/25.png"
                alt="포켓몬 컴퍼니의 대표 마스코트 피카츄"
                className="animate-float w-56 drop-shadow-2xl sm:w-72 md:w-80"
              />
            </div>
          </div>
        </section>
      );
    }

    const STATS = [
      { label: '설립', value: '1998년' },
      { label: '글로벌 임직원', value: '1,200명' },
      { label: '서비스 국가', value: '95개국' },
      { label: '누적 트레이너', value: '4.6억명' },
    ];

    function About() {
      return (
        <section id="about" className="mx-auto max-w-6xl px-4 py-20 sm:px-6">
          <SectionHeading
            eyebrow="ABOUT US"
            title="포켓몬을 문화로 만드는 회사"
            description="1998년 설립 이후 포켓몬 IP를 게임 밖으로 확장해 왔습니다. 우리는 콘텐츠를 만드는 데 그치지 않고, 세대를 잇는 경험을 설계합니다."
          />

          <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            {STATS.map((stat) => (
              <Card key={stat.label} className="text-center">
                <p className="text-3xl font-extrabold tracking-tight text-rose-500">{stat.value}</p>
                <p className="mt-2 text-sm font-medium text-slate-500">{stat.label}</p>
              </Card>
            ))}
          </div>

          {/* Card 의 기본 bg-white 와 충돌하지 않도록 별도 블록으로 둔다 */}
          <div className="mt-10 rounded-2xl bg-slate-900 p-8 text-slate-100 shadow-sm">
            <p className="text-sm font-semibold uppercase tracking-widest text-rose-300">Our Mission</p>
            <p className="mt-3 text-lg leading-relaxed sm:text-xl">
              “포켓몬을 통해 사람과 사람을 잇고, 모두가 자신만의 모험을 시작할 수 있게 한다.”
            </p>
          </div>
        </section>
      );
    }

    const BUSINESSES = [
      {
        icon: '🎮',
        title: '게임 사업',
        description: '본가 RPG부터 모바일 타이틀까지, 포켓몬 게임의 기획·퍼블리싱·운영을 총괄합니다.',
        tags: ['콘솔', '모바일', 'e스포츠'],
      },
      {
        icon: '🎬',
        title: '애니메이션 · 영상',
        description: 'TV 시리즈와 극장판, 오리지널 시리즈를 제작하고 전 세계 플랫폼에 배급합니다.',
        tags: ['TV 시리즈', '극장판', 'OTT'],
      },
      {
        icon: '🃏',
        title: '트레이딩 카드 게임',
        description: '카드 설계와 공식 대회 운영까지, 전 세계 TCG 생태계를 직접 만들고 관리합니다.',
        tags: ['카드 제작', '공식 대회', '랭킹'],
      },
      {
        icon: '🛍️',
        title: '라이선싱 · 리테일',
        description: '굿즈, 협업 상품, 포켓몬 센터 운영을 통해 일상 곳곳에서 포켓몬을 만나게 합니다.',
        tags: ['MD', '콜라보', '오프라인 스토어'],
      },
    ];

    function Business() {
      return (
        <section id="business" className="bg-white py-20">
          <div className="mx-auto max-w-6xl px-4 sm:px-6">
            <SectionHeading
              eyebrow="BUSINESS"
              title="네 개의 축으로 확장합니다"
              description="게임에서 시작한 이야기가 화면 밖으로 이어지도록, 서로 맞물리는 네 개의 사업을 함께 운영합니다."
            />

            <div className="grid gap-6 md:grid-cols-2">
              {BUSINESSES.map((item) => (
                <Card key={item.title} className="transition hover:-translate-y-1 hover:shadow-md">
                  <div className="text-3xl" aria-hidden="true">{item.icon}</div>
                  <h3 className="mt-4 text-xl font-bold text-slate-900">{item.title}</h3>
                  <p className="mt-2 text-sm leading-relaxed text-slate-600">{item.description}</p>
                  <div className="mt-4 flex flex-wrap gap-2">
                    {item.tags.map((tag) => <Badge key={tag} tone="slate">{tag}</Badge>)}
                  </div>
                </Card>
              ))}
            </div>
          </div>
        </section>
      );
    }

    const PARTNERS = [
      { id: 25, name: '피카츄', role: '브랜드 앰배서더', color: 'from-amber-200 to-amber-50' },
      { id: 1, name: '이상해씨', role: '친환경 캠페인', color: 'from-emerald-200 to-emerald-50' },
      { id: 4, name: '파이리', role: '스포츠 마케팅', color: 'from-orange-200 to-orange-50' },
      { id: 7, name: '꼬부기', role: '어린이 교육 사업', color: 'from-sky-200 to-sky-50' },
      { id: 150, name: '뮤츠', role: '기술 연구소', color: 'from-violet-200 to-violet-50' },
    ];

    function Partners() {
      return (
        <section id="partners" className="mx-auto max-w-6xl px-4 py-20 sm:px-6">
          <SectionHeading
            eyebrow="PARTNERS"
            title="함께 일하는 파트너 포켓몬"
            description="각 사업부를 대표하는 파트너 포켓몬이 브랜드의 얼굴이 되어 줍니다."
          />

          <div className="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
            {PARTNERS.map((p) => (
              <Card key={p.id} className="p-4 text-center transition hover:-translate-y-1 hover:shadow-md">
                <div className={`mx-auto flex aspect-square items-center justify-center rounded-xl bg-gradient-to-b ${p.color}`}>
                  <img src={`/sprites/${p.id}.png`} alt={p.name} className="w-4/5" loading="lazy" />
                </div>
                <h3 className="mt-3 font-bold text-slate-900">{p.name}</h3>
                <p className="mt-1 text-xs text-slate-500">{p.role}</p>
              </Card>
            ))}
          </div>
        </section>
      );
    }

    const HISTORY = [
      { year: '1998', title: '포켓몬 컴퍼니 설립', description: '포켓몬 IP 관리를 전담하는 법인으로 출범했습니다.' },
      { year: '2005', title: '글로벌 라이선싱 본부 신설', description: '아시아·북미·유럽 3개 권역 동시 운영을 시작했습니다.' },
      { year: '2014', title: '포켓몬 센터 서울 오픈', description: '국내 첫 공식 오프라인 스토어를 열었습니다.' },
      { year: '2021', title: 'TCG 온라인 플랫폼 출시', description: '전 세계 공식 대회를 온라인으로 확장했습니다.' },
      { year: '2025', title: '지속가능 프로젝트 시작', description: '전 제품 포장재를 재생 소재로 전환하고 있습니다.' },
    ];

    function History() {
      return (
        <section id="history" className="bg-white py-20">
          <div className="mx-auto max-w-4xl px-4 sm:px-6">
            <SectionHeading eyebrow="HISTORY" title="지나온 길" />

            <ol className="relative border-l-2 border-rose-100 pl-6 sm:pl-8">
              {HISTORY.map((item) => (
                <li key={item.year} className="relative pb-10 last:pb-0">
                  <span className="absolute -left-[calc(1.5rem+7px)] top-1.5 h-3.5 w-3.5 rounded-full bg-rose-500 ring-4 ring-rose-100 sm:-left-[calc(2rem+7px)]" aria-hidden="true" />
                  <p className="text-sm font-extrabold tracking-widest text-rose-500">{item.year}</p>
                  <h3 className="mt-1 text-lg font-bold text-slate-900">{item.title}</h3>
                  <p className="mt-1 text-sm leading-relaxed text-slate-600">{item.description}</p>
                </li>
              ))}
            </ol>
          </div>
        </section>
      );
    }

    // ========================================
    // 📮 Contact Form (POST /api/inquiries → txt 저장)
    // ========================================

    const INQUIRY_TYPES = ['사업 제휴', '라이선싱 문의', '채용 문의', '언론 취재', '기타'];
    const EMPTY_FORM = { name: '', email: '', company: '', type: '', message: '' };

    // 서버와 동일한 규칙으로 먼저 걸러 네트워크 왕복을 아낀다.
    function validate(form) {
      const errors = {};
      if (!form.name.trim()) errors.name = '이름을 입력해 주세요.';
      if (!form.email.trim()) errors.email = '이메일을 입력해 주세요.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) errors.email = '이메일 형식이 올바르지 않습니다.';
      if (!form.type) errors.type = '문의 유형을 선택해 주세요.';
      if (!form.message.trim()) errors.message = '문의 내용을 입력해 주세요.';
      else if (form.message.trim().length < 10) errors.message = '문의 내용을 10자 이상 입력해 주세요.';
      return errors;
    }

    function Contact({ onSubmitted }) {
      const [form, setForm] = useState(EMPTY_FORM);
      const [errors, setErrors] = useState({});
      const [status, setStatus] = useState('idle'); // idle | loading | success | error
      const [result, setResult] = useState(null);
      const [serverMessage, setServerMessage] = useState('');

      const update = (key) => (e) => {
        const value = e.target.value;
        setForm((prev) => ({ ...prev, [key]: value }));
        setErrors((prev) => (prev[key] ? { ...prev, [key]: undefined } : prev));
      };

      async function handleSubmit(e) {
        e.preventDefault();

        const nextErrors = validate(form);
        setErrors(nextErrors);
        if (Object.keys(nextErrors).length > 0) return;

        setStatus('loading');
        setServerMessage('');

        try {
          const res = await fetch(`${API_BASE_URL}/inquiries`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(form),
          });
          const json = await res.json();

          if (!res.ok || !json.success) {
            setErrors(json.errors || {});
            setServerMessage(json.message || '문의 접수에 실패했습니다.');
            setStatus('error');
            return;
          }

          setResult(json.data);
          setForm(EMPTY_FORM);
          setStatus('success');
          onSubmitted();
        } catch {
          setServerMessage('서버에 연결하지 못했습니다. 서버가 실행 중인지 확인해 주세요.');
          setStatus('error');
        }
      }

      const loading = status === 'loading';

      return (
        <section id="contact" className="bg-slate-100 py-20">
          <div className="mx-auto max-w-3xl px-4 sm:px-6">
            <SectionHeading
              eyebrow="CONTACT"
              title="문의하기"
              description="제휴·라이선싱·채용 등 어떤 내용이든 남겨 주세요. 접수된 문의는 담당 부서로 전달됩니다."
            />

            <Card className="p-6 sm:p-8">
              {status === 'success' && result ? (
                <div className="py-6 text-center" role="status">
                  <div className="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-emerald-100 text-3xl">✅</div>
                  <h3 className="mt-4 text-xl font-bold text-slate-900">문의가 접수되었습니다</h3>
                  <p className="mt-2 text-sm text-slate-600">
                    접수 번호 <strong className="text-slate-900">#{result.id}</strong> · {result.receivedAt}
                  </p>
                  <p className="mt-1 text-xs text-slate-400">
                    저장 위치: {result.savedTo}
                  </p>
                  <Button variant="secondary" className="mt-6" onClick={() => setStatus('idle')}>
                    문의 하나 더 남기기
                  </Button>
                </div>
              ) : (
                <form onSubmit={handleSubmit} noValidate className="space-y-5">
                  <div className="grid gap-5 sm:grid-cols-2">
                    <Input
                      id="name" label="이름" required disabled={loading}
                      value={form.name} onChange={update('name')}
                      placeholder="홍길동" error={errors.name}
                    />
                    <Input
                      id="email" label="이메일" type="email" required disabled={loading}
                      value={form.email} onChange={update('email')}
                      placeholder="trainer@example.com" error={errors.email}
                    />
                  </div>

                  <div className="grid gap-5 sm:grid-cols-2">
                    <Input
                      id="company" label="회사명" disabled={loading}
                      value={form.company} onChange={update('company')}
                      placeholder="선택 입력" error={errors.company}
                    />
                    <Select
                      id="type" label="문의 유형" required disabled={loading}
                      value={form.type} onChange={update('type')}
                      options={INQUIRY_TYPES} error={errors.type}
                    />
                  </div>

                  <Textarea
                    id="message" label="문의 내용" required disabled={loading}
                    value={form.message} onChange={update('message')}
                    placeholder="문의하실 내용을 10자 이상 자세히 적어 주세요."
                    error={errors.message} maxLength={2000}
                  />

                  {status === 'error' && serverMessage && (
                    <p role="alert" className="rounded-xl bg-rose-50 px-4 py-3 text-sm text-rose-700 ring-1 ring-rose-200">
                      {serverMessage}
                    </p>
                  )}

                  <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                    <p className="text-xs text-slate-500">
                      보내주신 내용은 <code className="rounded bg-slate-100 px-1 py-0.5">Supabase</code> 데이터베이스에 저장됩니다.
                    </p>
                    <Button type="submit" size="lg" disabled={loading} className="w-full sm:w-auto">
                      {loading && (
                        <svg className="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                          <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" className="opacity-25" />
                          <path d="M4 12a8 8 0 0 1 8-8" stroke="currentColor" strokeWidth="4" strokeLinecap="round" />
                        </svg>
                      )}
                      {loading ? '전송 중…' : '문의 보내기'}
                    </Button>
                  </div>
                </form>
              )}
            </Card>
          </div>
        </section>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      const [inquiryCount, setInquiryCount] = useState(null);

      // 누적 문의 건수 — 실패해도 페이지 동작에는 영향이 없으므로 조용히 넘긴다.
      const loadCount = useCallback(() => {
        fetch(`${API_BASE_URL}/inquiries`)
          .then((res) => res.json())
          .then((json) => { if (json.success) setInquiryCount(json.data.count); })
          .catch(() => {});
      }, []);

      useEffect(loadCount, [loadCount]);

      return (
        <div className="min-h-screen">
          <Header />
          <main>
            <Hero />
            <About />
            <Business />
            <Partners />
            <History />
            <Contact onSubmitted={loadCount} />
          </main>
          <Footer inquiryCount={inquiryCount} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

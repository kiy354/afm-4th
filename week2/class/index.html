<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국 만나이 계산기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN은 버전을 명시적으로 고정한다. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-enter {
      animation: fadeIn 0.35s ease-out;
    }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useCallback } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 ${className}`}>
          {children}
        </div>
      );
    }

    function Input({ label, type = 'text', value, onChange, placeholder, error, id, min, max, ...rest }) {
      return (
        <div className="flex flex-col gap-1.5">
          {label && (
            <label htmlFor={id} className="text-sm font-medium text-slate-700">
              {label}
            </label>
          )}
          <input
            id={id}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            min={min}
            max={max}
            aria-invalid={!!error}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full rounded-lg border px-4 py-2.5 text-slate-900 placeholder-slate-400
              focus:outline-none focus:ring-2 focus:ring-offset-1 transition
              ${error ? 'border-red-400 focus:ring-red-300' : 'border-slate-300 focus:ring-indigo-300 focus:border-indigo-400'}`}
            {...rest}
          />
          {error && (
            <p id={`${id}-error`} className="text-sm text-red-500">
              {error}
            </p>
          )}
        </div>
      );
    }

    function Button({ children, variant = 'primary', size = 'md', disabled, onClick, className = '', type = 'button' }) {
      const base = 'inline-flex items-center justify-center font-semibold rounded-lg transition focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 focus:ring-indigo-300',
        secondary: 'bg-slate-100 text-slate-700 hover:bg-slate-200 focus:ring-slate-300',
        ghost: 'bg-transparent text-slate-500 hover:bg-slate-100 focus:ring-slate-200',
      };
      const sizes = {
        sm: 'text-sm px-3 py-1.5',
        md: 'text-base px-4 py-2.5',
        lg: 'text-lg px-6 py-3',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Badge({ children, className = '' }) {
      return (
        <span className={`inline-flex items-center rounded-full bg-indigo-50 text-indigo-700 text-xs font-medium px-2.5 py-1 ${className}`}>
          {children}
        </span>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================

    // 만 나이(한국식 국제 나이) 계산: 생일이 지났으면 (올해 - 출생연도), 안 지났으면 -1
    function calculateKoreanAge(birthDateStr, baseDateStr) {
      const birth = new Date(birthDateStr);
      const base = new Date(baseDateStr);

      let age = base.getFullYear() - birth.getFullYear();
      const hasHadBirthdayThisYear =
        base.getMonth() > birth.getMonth() ||
        (base.getMonth() === birth.getMonth() && base.getDate() >= birth.getDate());

      if (!hasHadBirthdayThisYear) {
        age -= 1;
      }

      // 연 나이(한국식, 세는나이 폐지 후 통용): 기준연도 - 출생연도
      const yearAge = base.getFullYear() - birth.getFullYear();

      // 만 나이를 일 단위까지 정확히(개월/일)
      let months = base.getMonth() - birth.getMonth();
      let days = base.getDate() - birth.getDate();
      if (days < 0) {
        months -= 1;
        const prevMonthLastDay = new Date(base.getFullYear(), base.getMonth(), 0).getDate();
        days += prevMonthLastDay;
      }
      if (months < 0) {
        months += 12;
      }

      return { age, yearAge, months, days };
    }

    function KoreanAgeCalculatorPage() {
      const today = useMemo(() => new Date().toISOString().slice(0, 10), []);
      const [birthDate, setBirthDate] = useState('');
      const [baseDate, setBaseDate] = useState(today);
      const [error, setError] = useState('');

      const result = useMemo(() => {
        if (!birthDate || !baseDate) return null;
        if (new Date(birthDate) > new Date(baseDate)) return null;
        return calculateKoreanAge(birthDate, baseDate);
      }, [birthDate, baseDate]);

      const handleBirthChange = useCallback((e) => {
        const value = e.target.value;
        setBirthDate(value);
        if (baseDate && value && new Date(value) > new Date(baseDate)) {
          setError('생년월일이 기준일보다 늦을 수 없습니다.');
        } else {
          setError('');
        }
      }, [baseDate]);

      const handleBaseChange = useCallback((e) => {
        const value = e.target.value;
        setBaseDate(value);
        if (birthDate && value && new Date(birthDate) > new Date(value)) {
          setError('생년월일이 기준일보다 늦을 수 없습니다.');
        } else {
          setError('');
        }
      }, [birthDate]);

      const handleReset = useCallback(() => {
        setBirthDate('');
        setBaseDate(today);
        setError('');
      }, [today]);

      return (
        <div className="min-h-screen flex items-center justify-center px-4 py-10 sm:py-16">
          <div className="w-full max-w-md">
            <div className="text-center mb-6">
              <h1 className="text-2xl sm:text-3xl font-bold text-slate-900">🎂 한국 만나이 계산기</h1>
              <p className="mt-2 text-sm text-slate-500">
                생년월일을 입력하면 만 나이와 연 나이를 계산해드려요.
              </p>
            </div>

            <Card>
              <div className="flex flex-col gap-5">
                <Input
                  id="birth-date"
                  type="date"
                  label="생년월일"
                  value={birthDate}
                  onChange={handleBirthChange}
                  max={today}
                  error={error}
                />
                <Input
                  id="base-date"
                  type="date"
                  label="기준일"
                  value={baseDate}
                  onChange={handleBaseChange}
                />

                <div className="flex gap-2">
                  <Button
                    variant="secondary"
                    size="sm"
                    onClick={() => setBaseDate(today)}
                  >
                    오늘로 설정
                  </Button>
                  <Button
                    variant="ghost"
                    size="sm"
                    onClick={handleReset}
                  >
                    초기화
                  </Button>
                </div>

                {result && !error && (
                  <div className="result-enter mt-2 rounded-xl bg-indigo-50 border border-indigo-100 p-5 text-center">
                    <p className="text-sm text-indigo-500 font-medium mb-1">만 나이</p>
                    <p className="text-4xl font-extrabold text-indigo-700">
                      {result.age}<span className="text-xl font-semibold ml-1">세</span>
                    </p>
                    <p className="mt-1 text-sm text-indigo-500">
                      ({result.months}개월 {result.days}일 지남)
                    </p>
                    <div className="mt-4 flex justify-center">
                      <Badge>연 나이(세는 개념 폐지 후 통용): {result.yearAge}세</Badge>
                    </div>
                  </div>
                )}

                {!birthDate && (
                  <p className="text-center text-sm text-slate-400 mt-1">
                    생년월일을 입력하면 결과가 표시됩니다.
                  </p>
                )}
              </div>
            </Card>

            <p className="mt-6 text-center text-xs text-slate-400">
              2023년 6월 28일부터 대한민국 공식 나이 계산법은 &apos;만 나이&apos;로 통일되었습니다.
            </p>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return <KoreanAgeCalculatorPage />;
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

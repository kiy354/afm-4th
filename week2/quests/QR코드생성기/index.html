<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL → QR 코드 변환기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fade-in 0.25s ease-out; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useEffect, useRef, useCallback } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ children, variant = 'primary', size = 'md', disabled, onClick, type = 'button', className = '' }) {
      const base = 'inline-flex items-center justify-center gap-2 font-medium rounded-xl transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 focus-visible:ring-indigo-500',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus-visible:ring-slate-400',
        ghost: 'text-slate-500 hover:text-slate-800 hover:bg-slate-100 focus-visible:ring-slate-300',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-4 py-2.5 text-sm',
        lg: 'px-5 py-3 text-base',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ label, value, onChange, placeholder, error, type = 'text', onKeyDown, autoFocus }) {
      return (
        <div className="w-full">
          {label && <label className="block text-sm font-medium text-slate-700 mb-1.5">{label}</label>}
          <input
            type={type}
            value={value}
            onChange={onChange}
            onKeyDown={onKeyDown}
            placeholder={placeholder}
            autoFocus={autoFocus}
            className={`w-full px-4 py-2.5 rounded-xl border text-sm text-slate-800 placeholder-slate-400 bg-white
              focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow
              ${error ? 'border-red-400' : 'border-slate-300'}`}
          />
          {error && <p className="mt-1.5 text-sm text-red-500">{error}</p>}
        </div>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 ${className}`}>
          {children}
        </div>
      );
    }

    function Select({ label, value, onChange, options }) {
      return (
        <div>
          {label && <label className="block text-sm font-medium text-slate-700 mb-1.5">{label}</label>}
          <select
            value={value}
            onChange={onChange}
            className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm text-slate-800 bg-white
              focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          >
            {options.map(opt => (
              <option key={opt.value} value={opt.value}>{opt.label}</option>
            ))}
          </select>
        </div>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    function normalizeUrl(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return '';
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    }

    function isLikelyUrl(value) {
      try {
        const u = new URL(value);
        return !!u.hostname && u.hostname.includes('.');
      } catch {
        return false;
      }
    }

    function QRGeneratorPage() {
      const [rawInput, setRawInput] = useState('');
      const [encodedValue, setEncodedValue] = useState('');
      const [error, setError] = useState('');
      const [size, setSize] = useState('256');
      const [level, setLevel] = useState('M');
      const [copied, setCopied] = useState(false);
      const [hasQr, setHasQr] = useState(false);
      const canvasRef = useRef(null);

      const generate = useCallback((valueToEncode, opts) => {
        if (!canvasRef.current || !valueToEncode) return;
        window.QRCode.toCanvas(
          canvasRef.current,
          valueToEncode,
          { width: Number(opts.size), errorCorrectionLevel: opts.level, margin: 2 },
          (err) => {
            if (err) {
              setError('QR 코드 생성에 실패했어요. 잠시 후 다시 시도해 주세요.');
              setHasQr(false);
            } else {
              setHasQr(true);
            }
          }
        );
      }, []);

      const handleGenerate = () => {
        const normalized = normalizeUrl(rawInput);
        if (!normalized) {
          setError('웹사이트 주소를 입력해 주세요.');
          setHasQr(false);
          return;
        }
        if (!isLikelyUrl(normalized)) {
          setError('올바른 웹사이트 주소 형식이 아니에요. 예: example.com');
          setHasQr(false);
          return;
        }
        setError('');
        setEncodedValue(normalized);
        setCopied(false);
      };

      useEffect(() => {
        if (encodedValue) {
          generate(encodedValue, { size, level });
        }
      }, [encodedValue, size, level, generate]);

      const handleDownload = () => {
        if (!canvasRef.current || !hasQr) return;
        const link = document.createElement('a');
        let filename = 'qrcode';
        try {
          filename = new URL(encodedValue).hostname.replace(/^www\./, '');
        } catch {}
        link.download = `${filename}-qrcode.png`;
        link.href = canvasRef.current.toDataURL('image/png');
        link.click();
      };

      const handleCopy = async () => {
        if (!encodedValue) return;
        try {
          await navigator.clipboard.writeText(encodedValue);
          setCopied(true);
          setTimeout(() => setCopied(false), 1500);
        } catch {
          setError('클립보드 복사에 실패했어요.');
        }
      };

      const handleReset = () => {
        setRawInput('');
        setEncodedValue('');
        setError('');
        setHasQr(false);
        setCopied(false);
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4 py-10">
          <div className="w-full max-w-md">
            <div className="text-center mb-6">
              <h1 className="text-2xl font-bold text-slate-800">URL → QR 코드 변환기</h1>
              <p className="mt-2 text-sm text-slate-500">웹사이트 주소를 입력하면 QR 코드로 바꿔드려요.</p>
            </div>

            <Card className="p-6 space-y-5">
              <Input
                label="웹사이트 주소"
                placeholder="example.com 또는 https://example.com"
                value={rawInput}
                onChange={(e) => { setRawInput(e.target.value); if (error) setError(''); }}
                onKeyDown={(e) => { if (e.key === 'Enter') handleGenerate(); }}
                error={error}
                autoFocus
              />

              <div className="grid grid-cols-2 gap-3">
                <Select
                  label="크기"
                  value={size}
                  onChange={(e) => setSize(e.target.value)}
                  options={[
                    { value: '192', label: '작게 (192px)' },
                    { value: '256', label: '보통 (256px)' },
                    { value: '384', label: '크게 (384px)' },
                  ]}
                />
                <Select
                  label="오류 복원력"
                  value={level}
                  onChange={(e) => setLevel(e.target.value)}
                  options={[
                    { value: 'L', label: '낮음 (L)' },
                    { value: 'M', label: '보통 (M)' },
                    { value: 'Q', label: '높음 (Q)' },
                    { value: 'H', label: '최고 (H)' },
                  ]}
                />
              </div>

              <Button className="w-full" size="lg" onClick={handleGenerate}>
                QR 코드 생성
              </Button>

              <div className="flex flex-col items-center justify-center min-h-[220px] rounded-xl border-2 border-dashed border-slate-200 bg-slate-50 p-4">
                {!encodedValue ? (
                  <p className="text-sm text-slate-400 text-center">
                    주소를 입력하고 생성 버튼을 누르면<br />여기에 QR 코드가 나타나요.
                  </p>
                ) : (
                  <div className="fade-in flex flex-col items-center gap-3">
                    <canvas ref={canvasRef} className="rounded-lg shadow-sm" />
                    <p className="text-xs text-slate-500 break-all text-center max-w-[260px]">{encodedValue}</p>
                  </div>
                )}
              </div>

              {encodedValue && (
                <div className="flex gap-2">
                  <Button variant="secondary" className="flex-1" onClick={handleDownload} disabled={!hasQr}>
                    PNG 다운로드
                  </Button>
                  <Button variant="secondary" className="flex-1" onClick={handleCopy}>
                    {copied ? '복사됨!' : '주소 복사'}
                  </Button>
                  <Button variant="ghost" onClick={handleReset}>
                    초기화
                  </Button>
                </div>
              )}
            </Card>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      return <QRGeneratorPage />;
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>저녁 레시피</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <!-- 식단 데이터 · 재료 계산 (냉장고 앱 · 서버와 공유) -->
  <script src="meals.js"></script>
  <style>
    body { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-orange-50/40 text-stone-800">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useEffect, useMemo, useContext, createContext, useCallback } = React;

    // ========================================
    // 📦 Data (meals.js — 냉장고 앱 · 서버와 공유)
    // ========================================
    const { MEALS, WEEKS, PANTRY, neededFor, findInFridge, ingredientName } = window.DINNER;

    // ========================================
    // 🛠 Utils
    // ========================================
    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
    const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const toKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    const fmtShort = (s) => { const d = parseDate(s); return `${d.getMonth() + 1}/${d.getDate()} (${DAY_NAMES[d.getDay()]})`; };
    const dayName = (s) => DAY_NAMES[parseDate(s).getDay()];
    const isWeekend = (s) => [0, 6].includes(parseDate(s).getDay());
    const weekOf = (date) => WEEKS.find((w) => date >= w.start && date <= w.end);
    const mealsOfWeek = (w) => MEALS.filter((m) => m.date >= w.start && m.date <= w.end);

    function usePersistentState(key, initial) {
      const [value, setValue] = useState(() => {
        try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : initial; } catch { return initial; }
      });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 저장 불가 환경은 무시 */ }
      }, [key, value]);
      return [value, setValue];
    }

    // 냉장고 앱(서버)의 재료 목록. 서버 없이 파일로 열면 null 로 남고 표시만 생략된다.
    function useFridgeItems() {
      const [items, setItems] = useState(null);
      useEffect(() => {
        let alive = true;
        fetch('/api/fridge')
          .then((r) => (r.ok ? r.json() : null))
          .then((json) => { if (alive && json?.success) setItems(json.data); })
          .catch(() => {});
        return () => { alive = false; };
      }, []);
      return items;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {
      const variants = {
        primary: 'bg-orange-500 text-white hover:bg-orange-600 focus-visible:ring-orange-300',
        secondary: 'bg-white text-stone-700 border border-stone-200 hover:bg-stone-50 focus-visible:ring-stone-300',
        danger: 'bg-red-500 text-white hover:bg-red-600 focus-visible:ring-red-300',
        ghost: 'text-stone-600 hover:bg-orange-100 focus-visible:ring-orange-200',
      };
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2 text-sm', lg: 'px-5 py-3 text-base' };
      return (
        <button type="button" disabled={disabled} onClick={onClick}
          className={`inline-flex items-center justify-center gap-1.5 rounded-xl font-medium transition focus:outline-none focus-visible:ring-2 disabled:opacity-40 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}>
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, disabled = false, className = '', ...rest }) {
      return (
        <label className={`block ${className}`}>
          {label && <span className="mb-1 block text-sm font-medium text-stone-600">{label}</span>}
          <input type={type} value={value} onChange={onChange} placeholder={placeholder} disabled={disabled}
            className={`w-full rounded-xl border bg-white px-3 py-2 text-sm outline-none transition focus:ring-2 ${error ? 'border-red-400 focus:ring-red-200' : 'border-stone-200 focus:border-orange-400 focus:ring-orange-100'}`}
            {...rest} />
          {error && <span className="mt-1 block text-xs text-red-500">{error}</span>}
        </label>
      );
    }

    function Card({ className = '', children, ...rest }) {
      return <div className={`rounded-2xl bg-white shadow-sm ring-1 ring-stone-100 ${className}`} {...rest}>{children}</div>;
    }

    function Badge({ color = 'orange', className = '', children }) {
      const colors = {
        orange: 'bg-orange-100 text-orange-700',
        stone: 'bg-stone-100 text-stone-600',
        green: 'bg-emerald-100 text-emerald-700',
        blue: 'bg-sky-100 text-sky-700',
      };
      return <span className={`inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ${colors[color]} ${className}`}>{children}</span>;
    }

    function Checkbox({ checked, onChange, children, className = '' }) {
      return (
        <label className={`flex cursor-pointer items-start gap-3 rounded-lg px-2 py-1.5 hover:bg-orange-50 ${className}`}>
          <input type="checkbox" checked={checked} onChange={onChange} className="mt-0.5 h-4 w-4 shrink-0 accent-orange-500" />
          <span className={`text-sm ${checked ? 'text-stone-400 line-through' : ''}`}>{children}</span>
        </label>
      );
    }

    function ProgressBar({ value, max, className = '' }) {
      const pct = max ? Math.round((value / max) * 100) : 0;
      return (
        <div className={`h-2 w-full overflow-hidden rounded-full bg-stone-100 ${className}`} role="progressbar" aria-valuenow={value} aria-valuemin={0} aria-valuemax={max}>
          <div className="h-full rounded-full bg-orange-500 transition-all" style={{ width: `${pct}%` }} />
        </div>
      );
    }

    function Tabs({ tabs, active, onChange, className = '' }) {
      return (
        <div role="tablist" className={`flex gap-1 overflow-x-auto rounded-xl bg-stone-100 p-1 ${className}`}>
          {tabs.map((t) => (
            <button key={t.value} role="tab" aria-selected={active === t.value} onClick={() => onChange(t.value)}
              className={`flex-1 whitespace-nowrap rounded-lg px-3 py-1.5 text-sm font-medium transition ${active === t.value ? 'bg-white text-orange-600 shadow-sm' : 'text-stone-500 hover:text-stone-700'}`}>
              {t.label}
            </button>
          ))}
        </div>
      );
    }

    // ========================================
    // 🔀 Router Components
    // ========================================
    const RouterContext = createContext(null);

    const readHash = () => {
      const raw = window.location.hash.replace(/^#/, '') || '/';
      const [path, query = ''] = raw.split('?');
      return { path: path || '/', query: new URLSearchParams(query) };
    };

    function matchRoute(pattern, path) {
      const p = pattern.split('/').filter(Boolean);
      const s = path.split('/').filter(Boolean);
      if (p.length !== s.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(s[i]);
        else if (p[i] !== s[i]) return null;
      }
      return params;
    }

    function Router({ children }) {
      const [loc, setLoc] = useState(readHash);
      useEffect(() => {
        const onChange = () => { setLoc(readHash()); window.scrollTo(0, 0); };
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      const navigate = useCallback((to) => { window.location.hash = to; }, []);
      return <RouterContext.Provider value={{ ...loc, navigate, params: {} }}>{children}</RouterContext.Provider>;
    }

    const useRouter = () => useContext(RouterContext);
    const useParams = () => useContext(RouterContext).params;

    function Route() { return null; }

    function Routes({ children, fallback = null }) {
      const router = useRouter();
      for (const child of React.Children.toArray(children)) {
        const params = matchRoute(child.props.path, router.path);
        if (params) return <RouterContext.Provider value={{ ...router, params }}>{child.props.element}</RouterContext.Provider>;
      }
      return fallback;
    }

    function Link({ to, className = '', children, ...rest }) {
      return <a href={`#${to}`} className={className} {...rest}>{children}</a>;
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================
    function Header() {
      const { path, query, navigate } = useRouter();
      const [q, setQ] = useState(path === '/search' ? query.get('q') || '' : '');
      useEffect(() => { if (path !== '/search') setQ(''); }, [path]);

      const onSearch = (e) => {
        const v = e.target.value;
        setQ(v);
        navigate(`/search?q=${encodeURIComponent(v)}`);
      };

      const nav = [
        { to: '/', label: '오늘', match: (p) => p === '/' },
        { to: '/calendar', label: '식단표', match: (p) => p === '/calendar' || p.startsWith('/meal') },
        { to: '/shopping', label: '장보기', match: (p) => p.startsWith('/shopping') },
      ];

      return (
        <header className="sticky top-0 z-10 border-b border-orange-100 bg-white/90 backdrop-blur">
          <div className="mx-auto flex max-w-5xl flex-wrap items-center gap-3 px-4 py-3">
            <Link to="/" className="flex items-center gap-2 text-lg font-bold text-stone-800">
              <span aria-hidden="true">🍲</span> 저녁 레시피
            </Link>
            <nav aria-label="주 메뉴" className="order-3 flex w-full gap-1 sm:order-none sm:w-auto">
              {nav.map((n) => (
                <Link key={n.to} to={n.to} aria-current={n.match(path) ? 'page' : undefined}
                  className={`flex-1 rounded-lg px-3 py-1.5 text-center text-sm font-medium sm:flex-none ${n.match(path) ? 'bg-orange-100 text-orange-700' : 'text-stone-500 hover:bg-stone-100'}`}>
                  {n.label}
                </Link>
              ))}
              <a href="/fridge.html" className="flex-1 rounded-lg px-3 py-1.5 text-center text-sm font-medium text-sky-700 hover:bg-sky-50 sm:flex-none">🧊 냉장고</a>
            </nav>
            <div className="w-full sm:ml-auto sm:w-56">
              <Input type="search" value={q} onChange={onSearch} placeholder="메뉴·재료 검색" aria-label="메뉴 또는 재료 검색" />
            </div>
          </div>
        </header>
      );
    }

    function MealCard({ meal, today, compact = false }) {
      const isToday = meal.date === today;
      const isPast = meal.date < today;
      return (
        <Link to={`/meal/${meal.date}`} className="block focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-300 rounded-2xl">
          <Card className={`h-full p-3 transition hover:-translate-y-0.5 hover:shadow-md ${isToday ? 'ring-2 ring-orange-400' : ''} ${isPast ? 'opacity-60' : ''}`}>
            <div className="mb-1 flex items-center justify-between gap-2">
              <span className={`text-xs font-semibold ${isWeekend(meal.date) ? 'text-rose-500' : 'text-stone-500'}`}>{fmtShort(meal.date)}</span>
              {isToday && <Badge>오늘</Badge>}
            </div>
            <p className={`font-semibold leading-snug ${compact ? 'text-sm' : ''}`}>{meal.title}</p>
            <div className="mt-2 flex flex-wrap items-center gap-1">
              <Badge color="stone">⏱ {meal.time}분</Badge>
              {!compact && meal.tags.map((t) => <Badge key={t} color="green">{t}</Badge>)}
            </div>
          </Card>
        </Link>
      );
    }

    function EmptyState({ icon = '🍽', title, children }) {
      return (
        <div className="py-16 text-center">
          <div className="text-4xl" aria-hidden="true">{icon}</div>
          <p className="mt-3 font-semibold">{title}</p>
          {children && <div className="mt-2 text-sm text-stone-500">{children}</div>}
        </div>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    function HomePage({ today }) {
      const first = MEALS[0].date;
      const last = MEALS[MEALS.length - 1].date;
      const todayMeal = MEALS.find((m) => m.date === today);
      const focusDate = todayMeal ? today : today < first ? first : last;
      const week = weekOf(focusDate);
      const next = MEALS.find((m) => m.date > today);
      const fridge = useFridgeItems();
      const needCount = todayMeal && fridge ? neededFor(todayMeal).filter((i) => !findInFridge(i.name, fridge)).length : null;

      return (
        <div className="space-y-6">
          {todayMeal ? (
            <Card className="overflow-hidden">
              <div className="bg-gradient-to-br from-orange-400 to-amber-400 p-6 text-white">
                <p className="text-sm font-medium opacity-90">오늘 저녁 · {fmtShort(today)}</p>
                <h1 className="mt-1 text-2xl font-bold sm:text-3xl">{todayMeal.title}</h1>
                <p className="mt-2 text-sm opacity-90">2인분 · 약 {todayMeal.time}분</p>
              </div>
              <div className="flex flex-wrap items-center gap-2 p-4">
                <Link to={`/meal/${todayMeal.date}`}><Button>레시피 보기</Button></Link>
                <a href="/fridge.html#/shopping">
                  <Button variant="secondary">{needCount === null ? '🧊 오늘 장보기' : needCount === 0 ? '🧊 재료 다 있음' : `🧊 오늘 장볼 것 ${needCount}가지`}</Button>
                </a>
                {next && <span className="ml-auto text-sm text-stone-500">내일: {next.title}</span>}
              </div>
            </Card>
          ) : (
            <Card className="p-6">
              <EmptyState icon="📅" title={today < first ? '식단이 아직 시작되지 않았어요' : '이번 식단 기간이 끝났어요'}>
                식단 기간은 {fmtShort(first)} ~ {fmtShort(last)}입니다.
              </EmptyState>
            </Card>
          )}

          <section aria-labelledby="week-heading">
            <div className="mb-3 flex items-center justify-between">
              <h2 id="week-heading" className="text-lg font-bold">{week.no}주차 식단</h2>
              <Link to="/calendar" className="text-sm text-orange-600 hover:underline">전체 식단표 →</Link>
            </div>
            <div className="grid grid-cols-2 gap-3 sm:grid-cols-4 lg:grid-cols-7">
              {mealsOfWeek(week).map((m) => <MealCard key={m.date} meal={m} today={today} compact />)}
            </div>
          </section>

          {week.tips.length > 0 && (
            <Card className="p-4">
              <h2 className="mb-2 font-bold">💡 이번 주 미리 해두면 편한 것</h2>
              <ul className="list-disc space-y-1 pl-5 text-sm text-stone-600">
                {week.tips.map((t) => <li key={t}>{t}</li>)}
              </ul>
            </Card>
          )}
        </div>
      );
    }

    function CalendarPage({ today }) {
      return (
        <div className="space-y-8">
          <div>
            <h1 className="text-2xl font-bold">한 달 식단표</h1>
            <p className="mt-1 text-sm text-stone-500">{fmtShort(MEALS[0].date)} ~ {fmtShort(MEALS[MEALS.length - 1].date)} · 매주 금요일 장보기 · 모두 2인분</p>
          </div>
          {WEEKS.map((w) => (
            <section key={w.no} aria-labelledby={`w${w.no}`}>
              <div className="mb-3 flex items-center justify-between">
                <h2 id={`w${w.no}`} className="font-bold">
                  {w.no}주차 <span className="text-sm font-normal text-stone-500">{fmtShort(w.start)} ~ {fmtShort(w.end)}</span>
                </h2>
                <Link to={`/shopping/${w.no}`} className="text-sm text-orange-600 hover:underline">장보기 목록 →</Link>
              </div>
              <div className="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-7">
                {mealsOfWeek(w).map((m) => <MealCard key={m.date} meal={m} today={today} compact />)}
              </div>
            </section>
          ))}
        </div>
      );
    }

    function MealPage({ today }) {
      const { date } = useParams();
      const idx = MEALS.findIndex((m) => m.date === date);
      const [done, setDone] = usePersistentState(`dinner-steps-${date}`, {});
      const fridge = useFridgeItems();

      if (idx === -1) {
        return <EmptyState icon="🤔" title="해당 날짜의 식단이 없어요"><Link to="/calendar" className="text-orange-600 underline">식단표로 돌아가기</Link></EmptyState>;
      }

      const meal = MEALS[idx];
      const prev = MEALS[idx - 1];
      const next = MEALS[idx + 1];
      const week = weekOf(meal.date);
      const toggle = (k) => setDone((d) => ({ ...d, [k]: !d[k] }));
      const neededNames = new Set(neededFor(meal).map((i) => i.name));
      // 냉장고 연결 시 재료 옆에 있음/사야 함 표시 (기본 양념·선택 재료는 표시 안 함)
      const fridgeMark = (raw) => {
        const name = ingredientName(raw);
        if (!fridge || !neededNames.has(name) || raw.includes('(선택)')) return null;
        return findInFridge(name, fridge)
          ? <Badge color="green" className="ml-auto shrink-0">냉장고에 있음</Badge>
          : <Badge className="ml-auto shrink-0">사야 함</Badge>;
      };

      return (
        <article className="space-y-5">
          <div className="flex items-center justify-between gap-2">
            {prev ? <Link to={`/meal/${prev.date}`}><Button variant="ghost" size="sm">← {fmtShort(prev.date)}</Button></Link> : <span />}
            {next ? <Link to={`/meal/${next.date}`}><Button variant="ghost" size="sm">{fmtShort(next.date)} →</Button></Link> : <span />}
          </div>

          <header>
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-sm font-semibold text-stone-500">{fmtShort(meal.date)} · {week.no}주차</span>
              {meal.date === today && <Badge>오늘</Badge>}
            </div>
            <h1 className="mt-1 text-2xl font-bold sm:text-3xl">{meal.title}</h1>
            <div className="mt-2 flex flex-wrap gap-1">
              <Badge color="stone">2인분</Badge>
              <Badge color="stone">⏱ 약 {meal.time}분</Badge>
              {meal.tags.map((t) => <Badge key={t} color="green">{t}</Badge>)}
            </div>
          </header>

          {meal.dishes.map((dish, di) => (
            <Card key={dish.name} className="p-5">
              <h2 className="text-lg font-bold">{dish.name}</h2>
              <div className="mt-4 grid gap-5 md:grid-cols-5">
                <div className="space-y-4 md:col-span-2">
                  <div>
                    <h3 className="mb-2 text-sm font-semibold text-orange-600">재료</h3>
                    <ul className="space-y-1 text-sm">
                      {dish.ingredients.map((i) => <li key={i} className="flex items-start gap-2"><span className="text-orange-400" aria-hidden="true">•</span><span>{i}</span>{fridgeMark(i)}</li>)}
                    </ul>
                  </div>
                  {dish.sauce && (
                    <div>
                      <h3 className="mb-2 text-sm font-semibold text-orange-600">양념</h3>
                      <ul className="space-y-1 text-sm">
                        {dish.sauce.map((s) => <li key={s} className="flex gap-2"><span className="text-orange-400" aria-hidden="true">•</span>{s}</li>)}
                      </ul>
                    </div>
                  )}
                </div>
                <div className="md:col-span-3">
                  <h3 className="mb-2 text-sm font-semibold text-orange-600">만드는 법 <span className="font-normal text-stone-400">(누르면 완료 표시)</span></h3>
                  <ol className="space-y-2">
                    {dish.steps.map((s, si) => {
                      const k = `${di}-${si}`;
                      return (
                        <li key={k}>
                          <button type="button" onClick={() => toggle(k)} aria-pressed={!!done[k]}
                            className={`flex w-full gap-3 rounded-xl p-2 text-left text-sm transition hover:bg-orange-50 ${done[k] ? 'text-stone-400 line-through' : ''}`}>
                            <span className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold ${done[k] ? 'bg-emerald-100 text-emerald-600' : 'bg-orange-100 text-orange-700'}`}>
                              {done[k] ? '✓' : si + 1}
                            </span>
                            <span className="pt-0.5">{s}</span>
                          </button>
                        </li>
                      );
                    })}
                  </ol>
                </div>
              </div>
            </Card>
          ))}

          <div className="flex flex-wrap gap-2">
            <Link to={`/shopping/${week.no}`}><Button variant="secondary">{week.no}주차 장보기 목록</Button></Link>
            {Object.values(done).some(Boolean) && <Button variant="ghost" onClick={() => setDone({})}>단계 표시 초기화</Button>}
          </div>
        </article>
      );
    }

    function ShoppingPage({ today }) {
      const { params, navigate } = useRouter();
      const current = weekOf(today) || (today < WEEKS[0].start ? WEEKS[0] : WEEKS[WEEKS.length - 1]);
      const weekNo = Number(params.week) || current.no;
      const week = WEEKS.find((w) => w.no === weekNo);
      const [checked, setChecked] = usePersistentState('dinner-shopping', {});

      if (!week) return <EmptyState icon="🛒" title="해당 주차가 없어요" />;

      const keyOf = (item) => `${week.no}:${item}`;
      const all = week.shopping.flatMap((g) => g.items);
      const doneCount = all.filter((i) => checked[keyOf(i)]).length;
      const toggle = (item) => setChecked((c) => ({ ...c, [keyOf(item)]: !c[keyOf(item)] }));
      const reset = () => setChecked((c) => Object.fromEntries(Object.entries(c).filter(([k]) => !k.startsWith(`${week.no}:`))));

      return (
        <div className="space-y-5">
          <div>
            <h1 className="text-2xl font-bold">장보기 목록</h1>
            <p className="mt-1 text-sm text-stone-500">체크한 항목은 이 브라우저에 저장됩니다.</p>
          </div>

          <Tabs active={week.no} onChange={(no) => navigate(`/shopping/${no}`)}
            tabs={WEEKS.map((w) => ({ value: w.no, label: `${w.no}주차${w.no === current.no ? ' ·이번 주' : ''}` }))} />

          <Card className="p-5">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <p className="font-semibold">{fmtShort(week.start)} ~ {fmtShort(week.end)}</p>
              <span className="text-sm text-stone-500">{doneCount} / {all.length} 담음</span>
            </div>
            <ProgressBar value={doneCount} max={all.length} className="mt-2" />
            {doneCount === all.length && <p className="mt-3 text-sm font-medium text-emerald-600">🎉 이번 주 장보기를 모두 마쳤어요!</p>}

            <div className="mt-5 grid gap-5 md:grid-cols-3">
              {week.shopping.map((g) => (
                <div key={g.cat}>
                  <h2 className="mb-1 text-sm font-semibold text-orange-600">{g.cat}</h2>
                  {g.items.map((item) => (
                    <Checkbox key={item} checked={!!checked[keyOf(item)]} onChange={() => toggle(item)}>{item}</Checkbox>
                  ))}
                </div>
              ))}
            </div>
            <div className="mt-4 flex justify-end">
              <Button variant="ghost" size="sm" onClick={reset} disabled={doneCount === 0}>체크 초기화</Button>
            </div>
          </Card>

          <Card className="p-5">
            <h2 className="font-bold">이번 주 메뉴</h2>
            <ul className="mt-2 divide-y divide-stone-100">
              {mealsOfWeek(week).map((m) => (
                <li key={m.date}>
                  <Link to={`/meal/${m.date}`} className="flex justify-between gap-3 py-2 text-sm hover:text-orange-600">
                    <span className="w-24 shrink-0 text-stone-500">{fmtShort(m.date)}</span>
                    <span className="flex-1">{m.title}</span>
                  </Link>
                </li>
              ))}
            </ul>
          </Card>

          <Card className="p-5">
            <h2 className="font-bold">기본 양념 <span className="text-sm font-normal text-stone-500">(한 달 내내 쓰는 것 · 집에 없으면 준비)</span></h2>
            <div className="mt-3 flex flex-wrap gap-1.5">
              {PANTRY.map((p) => <Badge key={p} color="stone">{p}</Badge>)}
            </div>
          </Card>
        </div>
      );
    }

    function SearchPage({ today }) {
      const { query } = useRouter();
      const q = (query.get('q') || '').trim();

      const results = useMemo(() => {
        if (!q) return [];
        const needle = q.toLowerCase();
        return MEALS.map((m) => {
          const hits = new Set();
          m.dishes.forEach((d) => {
            if (d.name.toLowerCase().includes(needle)) hits.add(`메뉴: ${d.name}`);
            [...d.ingredients, ...(d.sauce || [])].forEach((i) => { if (i.toLowerCase().includes(needle)) hits.add(i); });
          });
          m.tags.forEach((t) => { if (t.includes(needle)) hits.add(`분류: ${t}`); });
          return { meal: m, hits: [...hits] };
        }).filter((r) => r.hits.length > 0);
      }, [q]);

      if (!q) return <EmptyState icon="🔎" title="메뉴나 재료를 검색해 보세요">예: 두부, 닭, 고등어, 찌개</EmptyState>;

      return (
        <div className="space-y-4">
          <h1 className="text-xl font-bold">‘{q}’ 검색 결과 <span className="text-base font-normal text-stone-500">{results.length}끼</span></h1>
          {results.length === 0 ? (
            <EmptyState icon="🥲" title="찾는 메뉴나 재료가 없어요">다른 단어로 검색해 보세요.</EmptyState>
          ) : (
            <div className="grid gap-3 sm:grid-cols-2">
              {results.map(({ meal, hits }) => (
                <Link key={meal.date} to={`/meal/${meal.date}`} className="block rounded-2xl focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-300">
                  <Card className={`h-full p-4 transition hover:shadow-md ${meal.date === today ? 'ring-2 ring-orange-400' : ''}`}>
                    <p className="text-xs font-semibold text-stone-500">{fmtShort(meal.date)}</p>
                    <p className="font-semibold">{meal.title}</p>
                    <div className="mt-2 flex flex-wrap gap-1">
                      {hits.slice(0, 4).map((h) => <Badge key={h} color="blue">{h}</Badge>)}
                      {hits.length > 4 && <Badge color="stone">+{hits.length - 4}</Badge>}
                    </div>
                  </Card>
                </Link>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      // 자정을 넘기면 '오늘'이 바뀌도록 1분마다 확인
      const [today, setToday] = useState(() => toKey(new Date()));
      useEffect(() => {
        const id = setInterval(() => setToday(toKey(new Date())), 60000);
        return () => clearInterval(id);
      }, []);

      return (
        <Router>
          <Header />
          <main className="mx-auto max-w-5xl px-4 py-6">
            <Routes fallback={<EmptyState icon="🧭" title="페이지를 찾을 수 없어요"><Link to="/" className="text-orange-600 underline">처음으로</Link></EmptyState>}>
              <Route path="/" element={<HomePage today={today} />} />
              <Route path="/calendar" element={<CalendarPage today={today} />} />
              <Route path="/meal/:date" element={<MealPage today={today} />} />
              <Route path="/shopping" element={<ShoppingPage today={today} />} />
              <Route path="/shopping/:week" element={<ShoppingPage today={today} />} />
              <Route path="/search" element={<SearchPage today={today} />} />
            </Routes>
          </main>
          <footer className="py-8 text-center text-xs text-stone-400">2인분 기준 · <a href="/fridge.html" className="underline">우리집 냉장고</a>와 연결됨</footer>
        </Router>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>참치 김치볶음밥 - 레시피 검색</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", -apple-system, sans-serif; }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 0.25s ease-in-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = "primary", size = "md", disabled, onClick, className = "", children }) {
      const base = "inline-flex items-center justify-center gap-1.5 rounded-md font-medium transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-1 disabled:opacity-40 disabled:cursor-not-allowed";
      const variants = {
        primary: "bg-[#03C75A] text-white hover:bg-[#02b351] focus-visible:ring-[#03C75A]",
        outline: "bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 focus-visible:ring-gray-300",
        ghost: "bg-transparent text-gray-500 hover:bg-gray-100 focus-visible:ring-gray-300",
      };
      const sizes = { sm: "px-2.5 py-1 text-xs", md: "px-4 py-1.5 text-sm", lg: "px-5 py-2.5 text-base" };
      return (
        <button type="button" disabled={disabled} onClick={onClick} className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}>
          {children}
        </button>
      );
    }

    function Badge({ children, tone = "gray", className = "" }) {
      const tones = {
        gray: "bg-gray-100 text-gray-500",
        green: "bg-[#e7f9ee] text-[#03C75A]",
        amber: "bg-amber-50 text-amber-600",
      };
      return (
        <span className={`inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function Card({ className = "", children }) {
      return <div className={`bg-white rounded-xl border border-gray-100 ${className}`}>{children}</div>;
    }

    function Checkbox({ checked, onChange, label, subLabel, ariaLabel }) {
      return (
        <label className="flex items-center gap-3 py-2.5 px-3 rounded-lg hover:bg-gray-50 cursor-pointer select-none transition-colors">
          <span
            role="checkbox"
            aria-checked={checked}
            aria-label={ariaLabel || label}
            tabIndex={0}
            onClick={onChange}
            onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onChange(); } }}
            className={`flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${checked ? "bg-[#03C75A] border-[#03C75A]" : "border-gray-300 bg-white"}`}
          >
            {checked && (
              <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
            )}
          </span>
          <span className="flex-1">
            <span className={`block text-sm text-gray-800 ${checked ? "line-through text-gray-400" : ""}`}>{label}</span>
            {subLabel && <span className={`block text-xs text-gray-400 ${checked ? "line-through" : ""}`}>{subLabel}</span>}
          </span>
        </label>
      );
    }

    function ProgressBar({ value, total }) {
      const pct = total === 0 ? 0 : Math.round((value / total) * 100);
      return (
        <div className="w-full">
          <div className="flex justify-between text-xs text-gray-400 mb-1">
            <span>진행률</span>
            <span>{value} / {total}</span>
          </div>
          <div className="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
            <div className="h-full bg-[#03C75A] rounded-full transition-all duration-300" style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function NaverMark({ size = 40 }) {
      return (
        <div
          className="flex items-center justify-center rounded-[6px] bg-[#03C75A] text-white font-black select-none shrink-0"
          style={{ width: size, height: size, fontSize: size * 0.55 }}
          aria-hidden="true"
        >
          N
        </div>
      );
    }

    function GnbTab({ active, onClick, children }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className={`shrink-0 px-3 py-2 text-sm whitespace-nowrap border-b-2 transition-colors ${
            active ? "border-[#03C75A] text-[#03C75A] font-bold" : "border-transparent text-gray-600 hover:text-gray-900"
          }`}
        >
          {children}
        </button>
      );
    }

    // ========================================
    // 🧩 Common / Layout Components
    // ========================================

    function TopUtilityBar() {
      const links = ["메일", "카페", "블로그", "쇼핑", "쇼핑라이브", "페이"];
      return (
        <div className="hidden sm:flex items-center justify-end gap-3 max-w-5xl mx-auto px-4 pt-2 text-xs text-gray-500">
          {links.map((l) => (
            <a key={l} href="#" onClick={(e) => e.preventDefault()} className="hover:text-gray-900 hover:underline">{l}</a>
          ))}
          <span className="w-px h-3 bg-gray-200" />
          <a href="#" onClick={(e) => e.preventDefault()} className="hover:text-gray-900 hover:underline">로그인</a>
        </div>
      );
    }

    function SearchBar() {
      const [query, setQuery] = useState("참치 김치볶음밥");
      const [notice, setNotice] = useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        setNotice(query.trim() ? `"${query}" 검색은 데모 페이지라 동작하지 않아요.` : "검색어를 입력해 주세요.");
        setTimeout(() => setNotice(""), 2500);
      };

      return (
        <div className="max-w-5xl mx-auto px-4 pt-4 pb-3 flex items-center justify-center gap-3">
          <NaverMark size={40} />
          <form onSubmit={handleSubmit} className="relative w-full max-w-xl">
            <input
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="레시피를 검색해 보세요."
              aria-label="레시피 검색"
              className="w-full h-11 pl-5 pr-20 rounded-full border-2 border-[#03C75A] text-sm text-gray-800 placeholder-gray-400 focus:outline-none"
            />
            <div className="absolute right-1.5 top-1.5 flex items-center gap-1">
              <button type="submit" className="w-8 h-8 rounded-full bg-[#03C75A] text-white flex items-center justify-center hover:bg-[#02b351]" aria-label="검색">
                🔍
              </button>
            </div>
            {notice && <p className="absolute left-0 -bottom-6 text-xs text-gray-400">{notice}</p>}
          </form>
        </div>
      );
    }

    function GnbMenu() {
      const tabs = ["레시피", "한식", "일식", "중식", "양식", "분식", "간식/디저트", "커뮤니티"];
      const [active, setActive] = useState("레시피");
      return (
        <nav className="max-w-5xl mx-auto px-4 border-b border-gray-100">
          <div className="flex items-center gap-0.5 overflow-x-auto no-scrollbar">
            {tabs.map((t) => (
              <GnbTab key={t} active={active === t} onClick={() => setActive(t)}>{t}</GnbTab>
            ))}
          </div>
        </nav>
      );
    }

    function Footer() {
      const links = ["회사소개", "이용약관", "개인정보처리방침", "고객센터"];
      return (
        <footer className="bg-gray-50 border-t border-gray-100 mt-8">
          <div className="max-w-5xl mx-auto px-4 py-6 text-xs text-gray-400">
            <div className="flex flex-wrap gap-3 mb-3">
              {links.map((l) => (
                <a key={l} href="#" onClick={(e) => e.preventDefault()} className="hover:text-gray-600 hover:underline">{l}</a>
              ))}
            </div>
            <p>레시피북 &middot; week-1 quests &middot; 직접 만들어 먹어본 레시피를 기록합니다.</p>
            <p className="mt-1">본 페이지는 UI 스타일 학습을 위해 제작된 정적 클론이며, 네이버(NAVER Corp.)와 무관한 비공식 데모입니다.</p>
          </div>
        </footer>
      );
    }

    // 초를 mm:ss 형식으로 변환
    function formatTime(totalSeconds) {
      const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
      const s = Math.floor(totalSeconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function StepTimer({ minutes }) {
      const totalSeconds = Math.round(minutes * 60);
      const [remaining, setRemaining] = useState(totalSeconds);
      const [running, setRunning] = useState(false);
      const intervalRef = useRef(null);

      useEffect(() => {
        if (running && remaining > 0) {
          intervalRef.current = setInterval(() => {
            setRemaining((prev) => {
              if (prev <= 1) {
                clearInterval(intervalRef.current);
                setRunning(false);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(intervalRef.current);
      }, [running]);

      const reset = () => {
        clearInterval(intervalRef.current);
        setRunning(false);
        setRemaining(totalSeconds);
      };

      const isDone = remaining === 0;

      return (
        <div className="flex items-center gap-2 mt-2">
          <span className={`font-mono text-sm px-2 py-1 rounded ${isDone ? "bg-[#e7f9ee] text-[#03C75A]" : "bg-gray-100 text-gray-600"}`}>
            {isDone ? "완료!" : formatTime(remaining)}
          </span>
          {!isDone ? (
            <Button size="sm" variant={running ? "outline" : "primary"} onClick={() => setRunning((r) => !r)}>
              {running ? "일시정지" : remaining === totalSeconds ? "타이머 시작" : "계속"}
            </Button>
          ) : null}
          {(running || remaining !== totalSeconds) && (
            <Button size="sm" variant="ghost" onClick={reset}>초기화</Button>
          )}
        </div>
      );
    }

    // ========================================
    // 📄 Page Data
    // ========================================

    const INGREDIENTS = [
      { name: "밥", base: 1, unit: "공기" },
      { name: "신김치", base: 0.5, unit: "컵 (잘게 썰기)" },
      { name: "참치캔", base: 0.5, unit: "캔 (기름 제거)" },
      { name: "대파", note: "약간" },
      { name: "식용유", base: 1, unit: "큰술" },
      { name: "고추장", base: 1, unit: "작은술" },
      { name: "설탕", base: 0.5, unit: "작은술" },
      { name: "간장", base: 1, unit: "작은술" },
      { name: "계란", base: 1, unit: "개 (선택)" },
      { name: "김가루, 참기름", note: "약간" },
    ];

    const STEPS = [
      { text: "팬에 식용유를 두르고 대파를 넣어 파기름을 낸다.", minutes: 1, timeLabel: "1분" },
      { text: "썰어둔 김치를 넣고 중불에서 볶는다.", minutes: 2, timeLabel: "2분" },
      { text: "고추장, 설탕, 간장을 넣고 함께 볶는다.", minutes: 2, timeLabel: "2분" },
      { text: "기름을 뺀 참치를 넣고 살짝 더 볶는다.", minutes: 1, timeLabel: "1분" },
      { text: "밥을 넣고 재료와 골고루 섞이도록 강불에서 볶는다.", minutes: 4, timeLabel: "3~4분" },
      { text: "불을 끄고 참기름과 김가루를 뿌려 마무리한다.", minutes: 0, timeLabel: null },
      { text: "계란 프라이를 올려 완성한다.", minutes: 0, timeLabel: null, optional: true },
    ];

    const TIPS = [
      "신김치를 사용해야 깊은 맛이 난다.",
      "밥은 살짝 식은 찬밥을 쓰면 더 고슬고슬하게 볶인다.",
      "칠리소스를 추가해서 먹으니 맛있었다.",
    ];

    // 소수 분량을 "1 1/2" 같은 읽기 쉬운 형태로 변환
    function formatAmount(base, servings) {
      const value = base * servings;
      const whole = Math.floor(value);
      const frac = value - whole;
      let fracStr = "";
      if (Math.abs(frac - 0.5) < 0.01) fracStr = "1/2";
      else if (frac > 0.01) fracStr = frac.toFixed(1);
      if (whole === 0 && fracStr) return fracStr;
      if (!fracStr) return `${whole}`;
      return `${whole} ${fracStr}`;
    }

    // ========================================
    // 📄 Page Component
    // ========================================

    function RecipePage() {
      const [servings, setServings] = useState(1);
      const [checkedIngredients, setCheckedIngredients] = useState({});
      const [checkedSteps, setCheckedSteps] = useState({});

      const toggleIngredient = (idx) => setCheckedIngredients((prev) => ({ ...prev, [idx]: !prev[idx] }));
      const toggleStep = (idx) => setCheckedSteps((prev) => ({ ...prev, [idx]: !prev[idx] }));

      const ingredientCount = useMemo(() => Object.values(checkedIngredients).filter(Boolean).length, [checkedIngredients]);
      const stepCount = useMemo(() => Object.values(checkedSteps).filter(Boolean).length, [checkedSteps]);

      return (
        <main className="max-w-5xl mx-auto px-4 py-6">
          {/* 검색결과 스타일 브레드크럼 */}
          <p className="text-xs text-gray-400 mb-3">레시피 &gt; 한식 &gt; <span className="text-gray-600">참치 김치볶음밥</span></p>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {/* 왼쪽 2/3: 재료 + 조리순서 */}
            <div className="md:col-span-2 space-y-4">
              <Card className="p-5">
                <div className="flex items-center gap-2 mb-1">
                  <Badge tone="green">한식</Badge>
                  <Badge tone="amber">🔥 15분 완성</Badge>
                </div>
                <h1 className="text-2xl font-bold text-gray-900 mt-2">참치 김치볶음밥</h1>
                <p className="mt-1 text-sm text-gray-500">간단하고 빠르게 만들 수 있는 저녁 메뉴예요.</p>
              </Card>

              <Card className="p-5">
                <div className="flex items-center justify-between mb-1">
                  <h2 className="text-sm font-bold text-gray-800">🧂 재료</h2>
                  <div className="flex gap-1.5" role="group" aria-label="인분 선택">
                    {[1, 2, 3].map((n) => (
                      <Button key={n} size="sm" variant={servings === n ? "primary" : "outline"} onClick={() => setServings(n)}>
                        {n}인분
                      </Button>
                    ))}
                  </div>
                </div>
                <p className="text-xs text-gray-400 mb-2">체크하면서 재료를 준비해보세요.</p>
                <ProgressBar value={ingredientCount} total={INGREDIENTS.length} />
                <div className="mt-3 divide-y divide-gray-50">
                  {INGREDIENTS.map((ing, idx) => (
                    <Checkbox
                      key={ing.name}
                      checked={!!checkedIngredients[idx]}
                      onChange={() => toggleIngredient(idx)}
                      label={ing.name}
                      subLabel={ing.note ? ing.note : `${formatAmount(ing.base, servings)} ${ing.unit}`}
                    />
                  ))}
                </div>
              </Card>

              <Card className="p-5">
                <h2 className="text-sm font-bold text-gray-800 mb-1">🍳 조리 순서</h2>
                <p className="text-xs text-gray-400 mb-2">단계마다 타이머를 눌러 시간을 재보세요.</p>
                <ProgressBar value={stepCount} total={STEPS.length} />
                <ol className="mt-3 space-y-2">
                  {STEPS.map((step, idx) => {
                    const done = !!checkedSteps[idx];
                    return (
                      <li key={idx} className={`rounded-lg border p-3 transition-colors ${done ? "bg-[#e7f9ee] border-[#c9f2d9]" : "bg-gray-50/60 border-gray-100"}`}>
                        <div className="flex items-start gap-3">
                          <button
                            onClick={() => toggleStep(idx)}
                            aria-label={`${idx + 1}단계 ${done ? "완료 취소" : "완료 표시"}`}
                            className={`mt-0.5 flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold transition-all ${done ? "bg-[#03C75A] text-white pop" : "bg-white text-[#03C75A] border border-[#03C75A]"}`}
                          >
                            {done ? "✓" : idx + 1}
                          </button>
                          <div className="flex-1">
                            <p className={`text-sm text-gray-800 ${done ? "line-through text-gray-400" : ""}`}>
                              {step.optional && <span className="text-gray-400">(선택) </span>}
                              {step.text}
                            </p>
                            {step.timeLabel && (
                              <div className="flex items-center gap-2 mt-1">
                                <Badge tone="gray">⏱ {step.timeLabel}</Badge>
                              </div>
                            )}
                            {step.minutes > 0 && !done && <StepTimer minutes={step.minutes} />}
                          </div>
                        </div>
                      </li>
                    );
                  })}
                </ol>
              </Card>
            </div>

            {/* 오른쪽 1/3: 팁 위젯 */}
            <div className="space-y-4">
              <Card className="p-5">
                <h2 className="text-sm font-bold text-gray-800 mb-3">💡 팁</h2>
                <ul className="space-y-2">
                  {TIPS.map((tip, idx) => (
                    <li key={idx} className="flex items-start gap-2 text-sm text-gray-700">
                      <span className="text-[#03C75A] mt-0.5">•</span>
                      <span>
                        {tip}
                        {idx === TIPS.length - 1 && <Badge tone="green" className="ml-2">추천</Badge>}
                      </span>
                    </li>
                  ))}
                </ul>
              </Card>

              <Card className="p-5">
                <h2 className="text-sm font-bold text-gray-800 mb-2">함께 찾는 레시피</h2>
                <ul className="space-y-2 text-sm text-[#03C75A]">
                  <li><a href="#" onClick={(e) => e.preventDefault()} className="hover:underline">토마토 계란 파스타</a></li>
                  <li><a href="#" onClick={(e) => e.preventDefault()} className="hover:underline">김치볶음우동</a></li>
                  <li><a href="#" onClick={(e) => e.preventDefault()} className="hover:underline">스팸계란덮밥</a></li>
                </ul>
              </Card>
            </div>
          </div>
        </main>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return (
        <div className="min-h-screen bg-white">
          <header className="sticky top-0 z-10 bg-white">
            <TopUtilityBar />
            <SearchBar />
            <GnbMenu />
          </header>
          <RecipePage />
          <Footer />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

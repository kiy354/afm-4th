<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프렌치토스트 - 10분 완성 레시피</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 0.25s ease-in-out; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #fca5a5; border-radius: 9999px; }
  </style>
</head>
<body class="bg-orange-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = "primary", size = "md", disabled, onClick, className = "", children }) {
      const base = "inline-flex items-center justify-center gap-1.5 rounded-full font-semibold transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 disabled:opacity-40 disabled:cursor-not-allowed";
      const variants = {
        primary: "bg-red-500 text-white hover:bg-red-600 active:bg-red-700 focus-visible:ring-red-400 shadow-sm",
        secondary: "bg-white text-red-600 border border-red-200 hover:bg-red-50 focus-visible:ring-red-300",
        ghost: "bg-transparent text-gray-600 hover:bg-gray-100 focus-visible:ring-gray-300",
        danger: "bg-gray-700 text-white hover:bg-gray-800 focus-visible:ring-gray-400",
      };
      const sizes = {
        sm: "px-3 py-1 text-xs",
        md: "px-4 py-2 text-sm",
        lg: "px-6 py-3 text-base",
      };
      return (
        <button
          type="button"
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Badge({ children, tone = "red", className = "" }) {
      const tones = {
        red: "bg-red-100 text-red-700",
        gray: "bg-gray-100 text-gray-600",
        green: "bg-emerald-100 text-emerald-700",
        amber: "bg-amber-100 text-amber-700",
      };
      return (
        <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function Card({ className = "", children }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-orange-100 ${className}`}>
          {children}
        </div>
      );
    }

    function Checkbox({ checked, onChange, label, subLabel, ariaLabel }) {
      return (
        <label className="flex items-center gap-3 py-2.5 px-3 rounded-xl hover:bg-orange-50 cursor-pointer select-none transition-colors">
          <span
            role="checkbox"
            aria-checked={checked}
            aria-label={ariaLabel || label}
            tabIndex={0}
            onClick={onChange}
            onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onChange(); } }}
            className={`flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${checked ? "bg-red-500 border-red-500" : "border-gray-300 bg-white"}`}
          >
            {checked && (
              <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
            )}
          </span>
          <span className="flex-1">
            <span className={`block text-sm text-gray-800 ${checked ? "line-through text-gray-400" : ""}`}>{label}</span>
            {subLabel && <span className={`block text-xs text-gray-400 ${checked ? "line-through" : ""}`}>{subLabel}</span>}
          </span>
        </label>
      );
    }

    function ProgressBar({ value, total }) {
      const pct = total === 0 ? 0 : Math.round((value / total) * 100);
      return (
        <div className="w-full">
          <div className="flex justify-between text-xs text-gray-500 mb-1">
            <span>진행률</span>
            <span>{value} / {total}</span>
          </div>
          <div className="w-full h-2 bg-orange-100 rounded-full overflow-hidden">
            <div
              className="h-full bg-gradient-to-r from-red-400 to-orange-400 rounded-full transition-all duration-300"
              style={{ width: `${pct}%` }}
            />
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 Common Components
    // ========================================

    function Header() {
      return (
        <header className="max-w-2xl mx-auto px-4 pt-6 pb-2">
          <div className="flex items-center gap-2 text-red-500 font-bold text-lg">
            <span>🍞</span>
            <span>오늘의 레시피북</span>
          </div>
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="max-w-2xl mx-auto px-4 py-10 text-center text-xs text-gray-400">
          <p>레시피북 &middot; week-1 quests</p>
          <p className="mt-1">직접 만들어 먹어본 레시피를 기록합니다 🍳</p>
        </footer>
      );
    }

    // 초를 mm:ss 형식으로 변환
    function formatTime(totalSeconds) {
      const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
      const s = Math.floor(totalSeconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function StepTimer({ minutes }) {
      const totalSeconds = Math.round(minutes * 60);
      const [remaining, setRemaining] = useState(totalSeconds);
      const [running, setRunning] = useState(false);
      const intervalRef = useRef(null);

      useEffect(() => {
        if (running && remaining > 0) {
          intervalRef.current = setInterval(() => {
            setRemaining((prev) => {
              if (prev <= 1) {
                clearInterval(intervalRef.current);
                setRunning(false);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(intervalRef.current);
      }, [running]);

      const reset = () => {
        clearInterval(intervalRef.current);
        setRunning(false);
        setRemaining(totalSeconds);
      };

      const isDone = remaining === 0;

      return (
        <div className="flex items-center gap-2 mt-2">
          <span className={`font-mono text-sm px-2 py-1 rounded-lg ${isDone ? "bg-emerald-100 text-emerald-700" : "bg-orange-100 text-orange-700"}`}>
            {isDone ? "완료!" : formatTime(remaining)}
          </span>
          {!isDone ? (
            <Button size="sm" variant={running ? "secondary" : "primary"} onClick={() => setRunning((r) => !r)}>
              {running ? "일시정지" : remaining === totalSeconds ? "타이머 시작" : "계속"}
            </Button>
          ) : null}
          {(running || remaining !== totalSeconds) && (
            <Button size="sm" variant="ghost" onClick={reset}>초기화</Button>
          )}
        </div>
      );
    }

    // ========================================
    // 📄 Page Data
    // ========================================

    const INGREDIENTS = [
      { name: "식빵", base: 2, unit: "장 (도톰한 통식빵이면 더 좋아요)" },
      { name: "계란", base: 1, unit: "개" },
      { name: "우유", base: 80, unit: "ml" },
      { name: "설탕", base: 1, unit: "작은술" },
      { name: "시나몬가루", note: "약간 (선택)" },
      { name: "바닐라 익스트랙", note: "약간 (선택)" },
      { name: "버터", base: 1, unit: "작은술" },
      { name: "메이플시럽, 슈가파우더", note: "약간 (토핑용)" },
      { name: "딸기 또는 바나나", note: "약간 (선택, 토핑용)" },
    ];

    const STEPS = [
      { text: "볼에 계란, 우유, 설탕, 시나몬가루, 바닐라 익스트랙을 넣고 잘 섞어 달걀물을 만든다.", minutes: 1, timeLabel: "1분" },
      { text: "식빵을 달걀물에 앞뒤로 충분히 적신다.", minutes: 2, timeLabel: "2분" },
      { text: "팬을 약불로 달군 뒤 버터를 녹인다.", minutes: 0.5, timeLabel: "30초" },
      { text: "식빵을 올려 앞뒤로 노릇하게 굽는다.", minutes: 4.5, timeLabel: "4~5분" },
      { text: "접시에 담고 메이플시럽과 슈가파우더를 뿌린다.", minutes: 0, timeLabel: null },
      { text: "딸기나 바나나를 올려 마무리한다.", minutes: 0, timeLabel: null, optional: true },
    ];

    const TIPS = [
      "하루 정도 지나 살짝 마른 식빵을 쓰면 달걀물을 더 잘 흡수해서 촉촉하다.",
      "약불에서 천천히 구워야 겉만 타지 않고 속까지 고루 익는다.",
      "시나몬가루를 넣으면 향이 훨씬 풍부해진다.",
    ];

    // 소수 분량을 "1 1/2" 같은 읽기 쉬운 형태로 변환
    function formatAmount(base, servings) {
      const value = base * servings;
      const whole = Math.floor(value);
      const frac = value - whole;
      let fracStr = "";
      if (Math.abs(frac - 0.5) < 0.01) fracStr = "1/2";
      else if (frac > 0.01) fracStr = frac.toFixed(1);
      if (whole === 0 && fracStr) return fracStr;
      if (!fracStr) return `${whole}`;
      return `${whole} ${fracStr}`;
    }

    // ========================================
    // 📄 Page Component
    // ========================================

    function RecipePage() {
      const [servings, setServings] = useState(1);
      const [checkedIngredients, setCheckedIngredients] = useState({});
      const [checkedSteps, setCheckedSteps] = useState({});

      const toggleIngredient = (idx) => {
        setCheckedIngredients((prev) => ({ ...prev, [idx]: !prev[idx] }));
      };
      const toggleStep = (idx) => {
        setCheckedSteps((prev) => ({ ...prev, [idx]: !prev[idx] }));
      };

      const ingredientCount = useMemo(
        () => Object.values(checkedIngredients).filter(Boolean).length,
        [checkedIngredients]
      );
      const stepCount = useMemo(
        () => Object.values(checkedSteps).filter(Boolean).length,
        [checkedSteps]
      );

      return (
        <main className="max-w-2xl mx-auto px-4 pb-4">
          {/* Hero */}
          <Card className="overflow-hidden mb-6">
            <div className="relative h-40 sm:h-52 bg-gradient-to-br from-amber-300 via-orange-300 to-yellow-200 flex items-center justify-center">
              <span className="text-6xl sm:text-7xl" role="img" aria-label="프렌치토스트">🍞</span>
              <div className="absolute top-3 left-3 flex gap-2">
                <Badge tone="red">🔥 10분 완성</Badge>
                <Badge tone="amber">🍯 달콤</Badge>
              </div>
            </div>
            <div className="p-5">
              <h1 className="text-2xl font-bold text-gray-900">프렌치토스트</h1>
              <p className="mt-1 text-sm text-gray-500">주말 브런치로 딱 좋은, 달콤하고 폭신한 프렌치토스트예요.</p>
            </div>
          </Card>

          {/* 재료 */}
          <Card className="p-5 mb-6">
            <div className="flex items-center justify-between mb-1">
              <h2 className="text-lg font-bold text-gray-900 flex items-center gap-2">
                <span>🧂</span> 재료
              </h2>
              <div className="flex gap-1.5" role="group" aria-label="인분 선택">
                {[1, 2, 3].map((n) => (
                  <Button
                    key={n}
                    size="sm"
                    variant={servings === n ? "primary" : "secondary"}
                    onClick={() => setServings(n)}
                  >
                    {n}인분
                  </Button>
                ))}
              </div>
            </div>
            <p className="text-xs text-gray-400 mb-2">체크하면서 재료를 준비해보세요.</p>
            <ProgressBar value={ingredientCount} total={INGREDIENTS.length} />
            <div className="mt-3 divide-y divide-orange-50">
              {INGREDIENTS.map((ing, idx) => (
                <Checkbox
                  key={ing.name}
                  checked={!!checkedIngredients[idx]}
                  onChange={() => toggleIngredient(idx)}
                  label={ing.name}
                  subLabel={ing.note ? ing.note : `${formatAmount(ing.base, servings)} ${ing.unit}`}
                />
              ))}
            </div>
          </Card>

          {/* 조리 순서 */}
          <Card className="p-5 mb-6">
            <h2 className="text-lg font-bold text-gray-900 flex items-center gap-2 mb-1">
              <span>🍳</span> 조리 순서
            </h2>
            <p className="text-xs text-gray-400 mb-2">단계마다 타이머를 눌러 시간을 재보세요.</p>
            <ProgressBar value={stepCount} total={STEPS.length} />
            <ol className="mt-3 space-y-2">
              {STEPS.map((step, idx) => {
                const done = !!checkedSteps[idx];
                return (
                  <li
                    key={idx}
                    className={`rounded-xl border p-3 transition-colors ${done ? "bg-emerald-50 border-emerald-100" : "bg-orange-50/40 border-orange-100"}`}
                  >
                    <div className="flex items-start gap-3">
                      <button
                        onClick={() => toggleStep(idx)}
                        aria-label={`${idx + 1}단계 ${done ? "완료 취소" : "완료 표시"}`}
                        className={`mt-0.5 flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold transition-all ${done ? "bg-emerald-500 text-white pop" : "bg-white text-red-500 border border-red-200"}`}
                      >
                        {done ? "✓" : idx + 1}
                      </button>
                      <div className="flex-1">
                        <p className={`text-sm text-gray-800 ${done ? "line-through text-gray-400" : ""}`}>
                          {step.optional && <span className="text-gray-400">(선택) </span>}
                          {step.text}
                        </p>
                        {step.timeLabel && (
                          <div className="flex items-center gap-2 mt-1">
                            <Badge tone="gray">⏱ {step.timeLabel}</Badge>
                          </div>
                        )}
                        {step.minutes > 0 && !done && <StepTimer minutes={step.minutes} />}
                      </div>
                    </div>
                  </li>
                );
              })}
            </ol>
          </Card>

          {/* 팁 */}
          <Card className="p-5 mb-6">
            <h2 className="text-lg font-bold text-gray-900 flex items-center gap-2 mb-3">
              <span>💡</span> 팁
            </h2>
            <ul className="space-y-2">
              {TIPS.map((tip, idx) => (
                <li key={idx} className="flex items-start gap-2 text-sm text-gray-700">
                  <span className="text-red-400 mt-0.5">•</span>
                  <span>
                    {tip}
                    {idx === 0 && <Badge tone="green" className="ml-2">추천</Badge>}
                  </span>
                </li>
              ))}
            </ul>
          </Card>

          {/* 함께 찾는 레시피 */}
          <Card className="p-5">
            <h2 className="text-lg font-bold text-gray-900 mb-2">함께 찾는 레시피</h2>
            <ul className="space-y-2 text-sm text-red-500">
              <li><a href="아보카도에그토스트.md" className="hover:underline">아보카도 에그 토스트</a></li>
              <li><a href="토마토계란파스타.html" className="hover:underline">토마토 계란 파스타</a></li>
              <li><a href="스팸계란덮밥.md" className="hover:underline">스팸계란덮밥</a></li>
            </ul>
          </Card>
        </main>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return (
        <div className="min-h-screen bg-orange-50">
          <Header />
          <RecipePage />
          <Footer />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
